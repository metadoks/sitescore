[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescore-core"
version = "0.1.0"
description = "Deterministic scoring and financial core for SiteScore AI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
