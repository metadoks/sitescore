name: faz7-7-1-ci-mechanics-patcher

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Patch permanent CI mechanics and self-remove
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          git switch -c faz7/7-1-reproducible-containers-supply-chain-governance
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/faz7-container-ci.yml')
          s=p.read_text()
          replacements = [
            ('git fetch --depth=1 origin "${SOURCE_SHA}"\n          git checkout --detach FETCH_HEAD\n          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"\n          git fetch --depth=1 origin "${BASE_SHA}"',
             'git fetch --no-tags origin "${SOURCE_SHA}"\n          git checkout --detach FETCH_HEAD\n          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"\n          git fetch --no-tags origin "${BASE_SHA}"'),
            ('api_output="$(docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-api:test python -m pytest -q /testsrc/sitescore-api/tests)"\n          printf \'%s\\n\' "$api_output"\n          grep -E \'114 passed\' <<<"$api_output"',
             'set +e\n          docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-api:test python -m pytest -q /testsrc/sitescore-api/tests > /tmp/api-tests.txt 2>&1\n          api_rc=$?\n          set -e\n          cat /tmp/api-tests.txt\n          test "$api_rc" -eq 0\n          grep -E \'114 passed\' /tmp/api-tests.txt'),
            ('report_output="$(docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-api:test python -m pytest -q /testsrc/sitescore-report/tests)"\n          printf \'%s\\n\' "$report_output"\n          grep -E \'24 passed\' <<<"$report_output"',
             'set +e\n          docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-api:test python -m pytest -q /testsrc/sitescore-report/tests > /tmp/report-tests.txt 2>&1\n          report_rc=$?\n          set -e\n          cat /tmp/report-tests.txt\n          test "$report_rc" -eq 0\n          grep -E \'24 passed\' /tmp/report-tests.txt'),
            ('commerce_output="$(docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-commerce:test python -m pytest -q tests \\\n            --deselect tests/test_faz6_final_freeze_gate.py::test_final_candidate_is_based_on_corrective_locked_main_and_permanent_diff_is_audit_only)"\n          printf \'%s\\n\' "$commerce_output"\n          grep -E \'416 passed\' <<<"$commerce_output"',
             'set +e\n          docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-commerce:test python -m pytest -q tests \\\n            --deselect tests/test_faz6_final_freeze_gate.py::test_final_candidate_is_based_on_corrective_locked_main_and_permanent_diff_is_audit_only > /tmp/commerce-tests.txt 2>&1\n          commerce_rc=$?\n          set -e\n          cat /tmp/commerce-tests.txt\n          test "$commerce_rc" -eq 0\n          grep -E \'416 passed\' /tmp/commerce-tests.txt'),
            ('pdf_output="$(docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-api:test python -m pytest -q /testsrc/sitescore-report/tests/test_visual_report_rendering.py)"\n          printf \'%s\\n\' "$pdf_output"\n          grep -E \'passed\' <<<"$pdf_output"',
             'set +e\n          docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-api:test python -m pytest -q /testsrc/sitescore-report/tests/test_visual_report_rendering.py > /tmp/pdf-test.txt 2>&1\n          pdf_rc=$?\n          set -e\n          cat /tmp/pdf-test.txt\n          test "$pdf_rc" -eq 0\n          grep -E \'passed\' /tmp/pdf-test.txt'),
            ('output="$(docker run --rm -v "$PWD:/repo" -w /repo "$PYTHON_IMAGE" sh -euc \'\n            python -m venv /tmp/faz6-commerce\n            /tmp/faz6-commerce/bin/pip install "./sitescore-commerce[test]" >/dev/null\n            /tmp/faz6-commerce/bin/python -m pytest sitescore-commerce/tests -q\n          \')"\n          printf \'%s\\n\' "$output"\n          grep -E \'417 passed\' <<<"$output"',
             'set +e\n          docker run --rm -v "$PWD:/repo" -w /repo "$PYTHON_IMAGE" sh -euc \'\n            python -m venv /tmp/faz6-commerce\n            /tmp/faz6-commerce/bin/pip install "./sitescore-commerce[test]" >/dev/null\n            /tmp/faz6-commerce/bin/python -m pytest sitescore-commerce/tests -q\n          \' > /tmp/faz6-replay.txt 2>&1\n          replay_rc=$?\n          set -e\n          cat /tmp/faz6-replay.txt\n          test "$replay_rc" -eq 0\n          grep -E \'417 passed\' /tmp/faz6-replay.txt')
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('expected CI mechanics block not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git rm .github/workflows/faz7-7-1-ci-mechanics-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/faz7-container-ci.yml
          git diff --cached --check
          git commit -m 'fix(faz7): expose regression failures and fetch ancestry'
          git push origin HEAD:faz7/7-1-reproducible-containers-supply-chain-governance
