name: faz7-7-1-snowflake-path-patcher

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Emit canonical resolved-store probe blob
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/faz7-7-1-n8n-snowflake-prune-probe.yml')
          s=p.read_text()
          old="                      pnpm_root=(root/'.pnpm').resolve()\n                      store_key=m.relative_to(root/'.pnpm').parts[0]\n                      real_store=(root/'.pnpm'/store_key).resolve()\n                      real_dir=m.parent.resolve()\n                      if real_store.parent.resolve()!=pnpm_root:\n"
          new="                      real_dir=m.parent.resolve()\n                      pnpm_root=(root/'.pnpm').resolve()\n                      store_candidates=[p.resolve() for p in real_dir.parents if p.parent.resolve()==pnpm_root]\n                      if len(store_candidates)!=1:\n                          raise SystemExit(f'unexpected resolved pnpm store candidates: dir={real_dir} candidates={store_candidates}')\n                      real_store=store_candidates[0]\n                      if real_store.parent.resolve()!=pnpm_root:\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected scope-safe block count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check -- .github/workflows/faz7-7-1-n8n-snowflake-prune-probe.yml
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          data=Path('.github/workflows/faz7-7-1-n8n-snowflake-prune-probe.yml').read_bytes()
          payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',data=payload,method='POST',headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'sitescore-faz7-snowflake-resolved-store-fix'})
          with urllib.request.urlopen(req,timeout=30) as r:
              result=json.load(r)
          print('PATCHED_BLOB_SHA='+result['sha'])
          print('PATCHED_WORKFLOW_SHA256='+hashlib.sha256(data).hexdigest())
          PY
