name: faz7-7-1-prune-patcher

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Build corrected pruning probe blob
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          PATCH_SCRIPT_B64: ''
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          python -c "import base64,os; exec(base64.b64decode(os.environ['PATCH_SCRIPT_B64']))"
