name: faz7-7-1-regression-env-patcher

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Build corrected permanent CI blob
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/faz7-container-ci.yml')
          s=p.read_text()
          if 'POSTGRES_IMAGE:' not in s:
              needle='  PYTHON_IMAGE: python:3.11.16-slim-bookworm@sha256:2e32f7d302adc1c37428355c1e646897c0c53f4fd60b6a551245fb90ee129f91\n'
              s=s.replace(needle, needle+'  POSTGRES_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94\n',1)
          old="              if 'uses:' in line and not pattern.match(line):"
          new="              if re.match(r'^\\s*uses:\\s*', line) and not pattern.match(line):"
          if old not in s:
              raise SystemExit('self-pin predicate block not found')
          s=s.replace(old,new,1)

          c0=s.index('  container-validation:')
          c1=s.index('  faz6-commerce-replay:',c0)
          c=s[c0:c1]
          old_fetch='          git fetch --depth=1 origin "${SOURCE_SHA}"\n          git checkout --detach FETCH_HEAD\n          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"\n'
          new_fetch='          git fetch --no-tags origin "${SOURCE_SHA}"\n          git checkout --detach FETCH_HEAD\n          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"\n          for sha in 0e370940ee5c8c1253db72fa7e33078fb4ef3b2c 8a4e358709ae7a662bf079722db042fb6e319ffd af3b9567d644f6bcf0410af704dd7d86de41b5ce 719a17c4359524337f57298252a59ccb89dcd0aa 8027239b4b168e98e8ee16e15787366632017156 3ed6f6e323fdf4e3b0ef63e8c083d4f978e12628 acc213ac52f980789164d9fedcd4e18deeefcf75 64887a560c4af492312e726f990363fc5010345d 7b0b63eb3f4a9fbd74a0bfd92ef793c7d7522fba 1f22c4a09c08c2803c746b87a20209d7fdf6c574 bdf43a891ca14941ba2f2c4f115e4a15bec0015a 4ed902dd9ebf230dcb983392705ab0d95bb0c846 287367ce8eb708efce0ebae0a2f9c90d681cce01 813e3436bc3f899a774c853a6a81ba7924b54c42 df4e3181712e7f426f8f1752628952a620c98f05; do\n            git fetch --depth=1 origin "$sha"\n          done\n'
          if old_fetch not in c:
              raise SystemExit('container checkout block not found')
          c=c.replace(old_fetch,new_fetch,1)
          r0=c.index('      - name: Run exact current API report and Commerce applicable regressions')
          r1=c.index('      - name: Prove API web worker beat commands and PDF font runtime',r0)
          regression='''      - name: Run exact current API report and Commerce applicable regressions
        run: |
          set -euo pipefail
          pg_cid="$(docker run -d --rm --name faz7-regression-postgres \\
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=postgres \\
            -p 127.0.0.1:5432:5432 "$POSTGRES_IMAGE")"
          trap 'docker rm -f "$pg_cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if docker exec "$pg_cid" pg_isready -U ci -d postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$pg_cid" pg_isready -U ci -d postgres
          docker exec "$pg_cid" createdb -U ci api_ci
          docker exec "$pg_cid" createdb -U ci commerce_ci
          api_db='postgresql+psycopg://ci:ci@127.0.0.1:5432/api_ci'
          commerce_db='postgresql+psycopg://ci:ci@127.0.0.1:5432/commerce_ci'

          docker run --rm --network host -v "$PWD:/testsrc:ro" -w /testsrc \\
            -e SITESCORE_DATABASE_URL="$api_db" sitescore-api:test \\
            alembic -c /testsrc/sitescore-api/alembic.ini upgrade head

          set +e
          docker run --rm --network host -v "$PWD:/testsrc:ro" -w /testsrc \\
            -e SITESCORE_DATABASE_URL="$api_db" sitescore-api:test \\
            python -m pytest -q -p no:cacheprovider /testsrc/sitescore-api/tests > /tmp/api-tests.txt 2>&1
          api_rc=$?
          set -e
          cat /tmp/api-tests.txt
          test "$api_rc" -eq 0
          grep -E '114 passed' /tmp/api-tests.txt

          set +e
          docker run --rm -v "$PWD:/testsrc:ro" -w /testsrc sitescore-api:test \\
            python -m pytest -q -p no:cacheprovider /testsrc/sitescore-report/tests > /tmp/report-tests.txt 2>&1
          report_rc=$?
          set -e
          cat /tmp/report-tests.txt
          test "$report_rc" -eq 0
          grep -E '24 passed' /tmp/report-tests.txt

          cat > /tmp/Dockerfile.commerce-integration <<'EOF'
          FROM sitescore-api:test
          USER 0:0
          ARG DEBIAN_SNAPSHOT=20260821T000000Z
          COPY deploy/containers/commerce/requirements.lock /locks/commerce-runtime.lock
          RUN /opt/venv/bin/pip install --require-hashes -r /locks/commerce-runtime.lock \\
           && rm -f /etc/apt/sources.list.d/debian.sources \\
           && printf '%s\\n' \\
                "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/${DEBIAN_SNAPSHOT}/ bookworm main" \\
                "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/${DEBIAN_SNAPSHOT}/ bookworm-security main" \\
                > /etc/apt/sources.list \\
           && apt-get -o Acquire::Check-Valid-Until=false update \\
           && apt-get install -y --no-install-recommends git \\
           && git config --system --add safe.directory /testsrc \\
           && rm -rf /var/lib/apt/lists/*
          USER 10001:10001
          EOF
          docker build --platform linux/amd64 -f /tmp/Dockerfile.commerce-integration -t sitescore-commerce:test-integration .

          set +e
          docker run --rm --network host -v "$PWD:/testsrc:ro" -w /testsrc/sitescore-commerce \\
            -e PYTHONPATH=/testsrc/sitescore-commerce/src \\
            -e SITESCORE_COMMERCE_DATABASE_URL="$commerce_db" \\
            sitescore-commerce:test-integration \\
            python -m pytest -q -p no:cacheprovider /testsrc/sitescore-commerce/tests \\
              --deselect /testsrc/sitescore-commerce/tests/test_faz6_final_freeze_gate.py::test_final_candidate_is_based_on_corrective_locked_main_and_permanent_diff_is_audit_only \\
            > /tmp/commerce-tests.txt 2>&1
          commerce_rc=$?
          set -e
          cat /tmp/commerce-tests.txt
          test "$commerce_rc" -eq 0
          grep -E '416 passed' /tmp/commerce-tests.txt
          docker rm -f "$pg_cid" >/dev/null
          trap - EXIT

'''
          c=c[:r0]+regression+c[r1:]
          s=s[:c0]+c+s[c1:]

          f0=s.index('  faz6-commerce-replay:')
          f1=s.index('  n8n-validation:',f0)
          replay='''  faz6-commerce-replay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen FAZ6 Commerce base and provenance objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${FAZ6_COMMERCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${FAZ6_COMMERCE_SHA}"
          for sha in 0e370940ee5c8c1253db72fa7e33078fb4ef3b2c 8a4e358709ae7a662bf079722db042fb6e319ffd af3b9567d644f6bcf0410af704dd7d86de41b5ce 719a17c4359524337f57298252a59ccb89dcd0aa 8027239b4b168e98e8ee16e15787366632017156 3ed6f6e323fdf4e3b0ef63e8c083d4f978e12628 acc213ac52f980789164d9fedcd4e18deeefcf75 64887a560c4af492312e726f990363fc5010345d 7b0b63eb3f4a9fbd74a0bfd92ef793c7d7522fba 1f22c4a09c08c2803c746b87a20209d7fdf6c574 bdf43a891ca14941ba2f2c4f115e4a15bec0015a 4ed902dd9ebf230dcb983392705ab0d95bb0c846 287367ce8eb708efce0ebae0a2f9c90d681cce01 813e3436bc3f899a774c853a6a81ba7924b54c42 df4e3181712e7f426f8f1752628952a620c98f05; do
            git fetch --depth=1 origin "$sha"
          done

      - name: Replay frozen FAZ6 Commerce 417-pass baseline
        run: |
          set -euo pipefail
          pg_cid="$(docker run -d --rm --name faz6-replay-postgres \\
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=postgres \\
            -p 127.0.0.1:5432:5432 "$POSTGRES_IMAGE")"
          trap 'docker rm -f "$pg_cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if docker exec "$pg_cid" pg_isready -U ci -d postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$pg_cid" pg_isready -U ci -d postgres
          docker exec "$pg_cid" createdb -U ci commerce_ci
          set +e
          docker run --rm --network host -v "$PWD:/repo" -w /repo \\
            -e SITESCORE_COMMERCE_DATABASE_URL=postgresql+psycopg://ci:ci@127.0.0.1:5432/commerce_ci \\
            "$PYTHON_IMAGE" sh -euc '
              rm -f /etc/apt/sources.list.d/debian.sources
              printf "%s\\n" \\
                "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260821T000000Z/ bookworm main" \\
                "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20260821T000000Z/ bookworm-security main" > /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update >/dev/null
              apt-get install -y --no-install-recommends git >/dev/null
              git config --global --add safe.directory /repo
              python -m venv /tmp/faz6-commerce
              /tmp/faz6-commerce/bin/pip install \\
                ./sitescore-core ./sitescore-data ./sitescore-providers ./sitescore-spatial \\
                ./sitescore-metrics ./sitescore-benchmarks ./sitescore-pipeline ./sitescore-app \\
                ./sitescore-report ./sitescore-api "./sitescore-commerce[test]" >/dev/null
              /tmp/faz6-commerce/bin/python -m pytest -q -p no:cacheprovider sitescore-commerce/tests
            ' > /tmp/faz6-replay.txt 2>&1
          replay_rc=$?
          set -e
          cat /tmp/faz6-replay.txt
          test "$replay_rc" -eq 0
          grep -E '417 passed' /tmp/faz6-replay.txt
          docker rm -f "$pg_cid" >/dev/null
          trap - EXIT

'''
          s=s[:f0]+replay+s[f1:]
          p.write_text(s)
          PY
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          data=Path('.github/workflows/faz7-container-ci.yml').read_bytes()
          payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
          req=urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs', data=payload, method='POST',
              headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'sitescore-faz7-regression-env'})
          with urllib.request.urlopen(req,timeout=30) as r: result=json.load(r)
          print('PATCHED_BLOB_SHA='+result['sha'])
          print('PATCHED_WORKFLOW_SHA256='+hashlib.sha256(data).hexdigest())
          PY
