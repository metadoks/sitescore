name: faz7-7-1-n8n-snowflake-prune-probe

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance

permissions:
  contents: read

env:
  N8N_VERSION: '2.37.10'
  N8N_COMMIT: '5542b8b6419cb6925cca8f11b270c9bfbe09d85e'
  N8N_TREE: '8d44b0feb4a74c9fb07f4156793e3c7eaee30fc0'
  OFFICIAL_IMAGE: 'n8nio/n8n@sha256:307d6065be25619aa24cfc63a7c2f04ca56d084a08c05c8e9f189a89f353b1ec'
  DHI_REF: 'dhi.io/node:26.5.1-alpine3.24-dev@sha256:c4062f85acd1ca91ffb7d15048dcc5f15a922d630e65eb3c3c0dcdcef6ea36d8'
  BUILDER_IMAGE: 'node:26.5.1-alpine3.24@sha256:233761595746769ebfdb6090f44fc7cdf818ae0ce62d2b37e0367723b9823e36'
  HARDENED_BASE_IMAGE: 'sitescore-n8n-base-pruned:26.5.1'
  PROBE_IMAGE: 'sitescore-n8n-snowflake-pruned:probe'
  OUT: 'deploy/containers/artifacts/n8n-snowflake-prune-probe'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout SiteScore exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Free runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Setup exact Node 26.5.1
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '26.5.1'

      - name: Setup pnpm
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v26.5.1'
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          test "$(pnpm --version)" = '11.22.0'

      - name: Re-enumerate latest stable and test official image first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python - <<'PY'
          import json,os,re,urllib.request
          from urllib.parse import urlencode
          h={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-snowflake-prune'}
          rels=[]
          for page in range(1,11):
              req=urllib.request.Request('https://api.github.com/repos/n8n-io/n8n/releases?'+urlencode({'per_page':100,'page':page}),headers=h)
              with urllib.request.urlopen(req,timeout=30) as r: batch=json.load(r)
              if not batch: break
              for rel in batch:
                  if rel.get('draft') or rel.get('prerelease'): continue
                  m=re.fullmatch(r'n8n@(\d+)\.(\d+)\.(\d+)',str(rel.get('tag_name','')))
                  if m and int(m.group(1))==2: rels.append((tuple(map(int,m.groups())),rel))
              if len(batch)<100: break
          vt,rel=max(rels,key=lambda x:x[0]); version='.'.join(map(str,vt))
          ctx={'latest_stable_2x':version,'release_id':rel['id'],'tag':rel['tag_name'],'published_at':rel.get('published_at'),'source_commit':os.environ['N8N_COMMIT'],'source_tree':os.environ['N8N_TREE'],'official_image':os.environ['OFFICIAL_IMAGE'],'dhi_ref':os.environ['DHI_REF'],'builder_image':os.environ['BUILDER_IMAGE']}
          json.dump(ctx,open(os.environ['OUT']+'/source-context.json','w'),indent=2,sort_keys=True)
          print(json.dumps(ctx,indent=2,sort_keys=True))
          if version != os.environ['N8N_VERSION']: raise SystemExit(f'new official stable {version}; revalidation required')
          PY
          test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = '02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1'
          test "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" = 'f5409839cec1fa86b6af20f6cd242e71d52dceec8dcdb6cf35fd0b237e4a489c'
          ! grep -R -F 'n8n-nodes-base.snowflake' automation/n8n/workflows/*.json
          docker pull --platform linux/amd64 "$OFFICIAL_IMAGE" >/dev/null
          test "$(docker run --rm "$OFFICIAL_IMAGE" n8n --version | tr -d '\r' | tail -n1)" = "$N8N_VERSION"

      - name: Bind exact upstream stable source and build mechanics
        run: |
          set -euo pipefail
          rm -rf /tmp/n8n-src
          git clone --filter=blob:none --no-checkout https://github.com/n8n-io/n8n.git /tmp/n8n-src
          git -C /tmp/n8n-src fetch --depth=1 origin "$N8N_COMMIT"
          git -C /tmp/n8n-src checkout --detach "$N8N_COMMIT"
          test "$(git -C /tmp/n8n-src rev-parse HEAD)" = "$N8N_COMMIT"
          test "$(git -C /tmp/n8n-src rev-parse HEAD^{tree})" = "$N8N_TREE"
          cp /tmp/n8n-src/docker/images/n8n/Dockerfile "$OUT/upstream-n8n-Dockerfile"
          cp /tmp/n8n-src/docker/images/n8n-base/Dockerfile "$OUT/upstream-n8n-base-Dockerfile"
          cp /tmp/n8n-src/.github/workflows/build-base-image.yml "$OUT/upstream-build-base-image.yml"
          grep -F 'node:26.5.1-alpine3.24@sha256:233761595746769ebfdb6090f44fc7cdf818ae0ce62d2b37e0367723b9823e36' /tmp/n8n-src/docker/images/n8n/Dockerfile
          grep -F "$DHI_REF" /tmp/n8n-src/.github/workflows/build-base-image.yml
          grep -F 'fast-uri: 3.1.5' /tmp/n8n-src/pnpm-workspace.yaml
          grep -F 'ip-address@10: 10.3.1' /tmp/n8n-src/pnpm-workspace.yaml
          grep -F 'brace-expansion@5: 5.0.9' /tmp/n8n-src/pnpm-workspace.yaml

      - name: Apply exact upstream-adopted fast-uri 3.1.6 backport
        working-directory: /tmp/n8n-src
        env:
          UPSTREAM_FAST_URI_REF: '33eb5c196e0ce3a2c71525929a4ef861cb94b168'
        run: |
          set -euo pipefail
          cp pnpm-workspace.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-workspace.stable.yaml"
          cp pnpm-lock.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-lock.stable.yaml"
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/n8n-io/n8n/${UPSTREAM_FAST_URI_REF}/pnpm-workspace.yaml" -o "$GITHUB_WORKSPACE/$OUT/upstream-fast-uri-adoption.yaml"
          grep -F 'fast-uri: 3.1.6' "$GITHUB_WORKSPACE/$OUT/upstream-fast-uri-adoption.yaml"
          python -c "from pathlib import Path; p=Path('pnpm-workspace.yaml'); s=p.read_text(); assert s.count('fast-uri: 3.1.5') == 1; assert 'fast-uri: 3.1.6' not in s; p.write_text(s.replace('fast-uri: 3.1.5','fast-uri: 3.1.6',1))"
          pnpm install --lockfile-only --ignore-scripts
          cp pnpm-workspace.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-workspace.backported.yaml"
          cp pnpm-lock.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-lock.backported.yaml"
          git diff -- pnpm-workspace.yaml pnpm-lock.yaml > "$GITHUB_WORKSPACE/$OUT/fast-uri-backport.diff"
          git diff --check -- pnpm-workspace.yaml pnpm-lock.yaml
          grep -F 'fast-uri: 3.1.6' pnpm-workspace.yaml
          ! grep -F 'fast-uri@3.1.5' pnpm-lock.yaml
          grep -F 'fast-uri@3.1.6' pnpm-lock.yaml

      - name: Materialize production graph evidence
        working-directory: /tmp/n8n-src
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=7168'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm why --prod --recursive snowflake-sdk --json > "$GITHUB_WORKSPACE/$OUT/pnpm-why-prod-snowflake-sdk.json"
          pnpm why --prod --recursive toml --json > "$GITHUB_WORKSPACE/$OUT/pnpm-why-prod-toml.json"
          pnpm why --prod --recursive fast-uri --json > "$GITHUB_WORKSPACE/$OUT/pnpm-why-prod-fast-uri.json"
          pnpm why --prod --recursive ip-address --json > "$GITHUB_WORKSPACE/$OUT/pnpm-why-prod-ip-address.json"
          pnpm why --prod --recursive brace-expansion --json > "$GITHUB_WORKSPACE/$OUT/pnpm-why-prod-brace-expansion.json"
          grep -F 'snowflake-sdk' "$GITHUB_WORKSPACE/$OUT/pnpm-why-prod-snowflake-sdk.json"
          grep -F 'toml' "$GITHUB_WORKSPACE/$OUT/pnpm-why-prod-toml.json"

      - name: Build exact stable production closure
        working-directory: /tmp/n8n-src
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=7168'
          RELEASE: '2.37.10'
        run: |
          set -euo pipefail
          pnpm build:n8n
          test -d compiled
          grep -R '"version": "3.1.6"' compiled/node_modules/.pnpm/fast-uri@3.1.6*/node_modules/fast-uri/package.json
          grep -R '"version": "10.3.1"' compiled/node_modules/.pnpm/ip-address@10.3.1*/node_modules/ip-address/package.json
          grep -R '"version": "5.0.9"' compiled/node_modules/.pnpm/brace-expansion@5.0.9*/node_modules/brace-expansion/package.json
          grep -R '"version": "8.0.10"' compiled/node_modules/.pnpm/nodemailer@8.0.10*/node_modules/nodemailer/package.json
          grep -R '"version": "2.1.0"' compiled/node_modules/.pnpm/snowflake-sdk@2.1.0*/node_modules/snowflake-sdk/package.json
          grep -R '"version": "3.0.0"' compiled/node_modules/.pnpm/toml@3.0.0*/node_modules/toml/package.json

      - name: Prove graph exclusivity and prune Snowflake closure
        working-directory: /tmp/n8n-src
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path('compiled/node_modules')
          out=Path(os.environ['GITHUB_WORKSPACE'])/os.environ['OUT']
          def instances():
              rows=[]
              for pat in ('.pnpm/*/node_modules/*/package.json','.pnpm/*/node_modules/@*/*/package.json'):
                  for m in root.glob(pat):
                      try: j=json.loads(m.read_text())
                      except Exception: continue
                      real_dir=m.parent.resolve()
                      real_store=real_dir.parents[1].resolve()
                      pnpm_root=(root/'.pnpm').resolve()
                      if real_store.parent.resolve()!=pnpm_root:
                          raise SystemExit(f'unexpected resolved pnpm store layout: dir={real_dir} store={real_store}')
                      rows.append({'name':j.get('name'),'version':j.get('version'),'manifest':str(m),'dir':str(real_dir),'store':str(real_store)})
              unique={r['dir']:r for r in rows if r['name'] and r['version']}
              return sorted(unique.values(),key=lambda r:(r['name'],r['version'],r['dir']))
          before=instances(); json.dump(before,open(out/'inventory.before.json','w'),indent=2,sort_keys=True)
          bykey={}
          for r in before: bykey.setdefault((r['name'],r['version']),[]).append(r)
          snow=bykey.get(('snowflake-sdk','2.1.0'),[]); toml=bykey.get(('toml','3.0.0'),[])
          if len(snow)!=1 or len(toml)!=1: raise SystemExit(f'exact target multiplicity failed: snow={len(snow)} toml={len(toml)}')
          targets={Path(snow[0]['dir']).resolve():'snowflake-sdk@2.1.0',Path(toml[0]['dir']).resolve():'toml@3.0.0'}
          authorized_target_ids={'snowflake-sdk@2.1.0','toml@3.0.0'}
          n8n_base=bykey.get(('n8n-nodes-base','2.37.4'),[])
          if len(n8n_base)!=1: raise SystemExit(f'exact n8n-nodes-base multiplicity failed: {len(n8n_base)}')
          n8n_store=Path(n8n_base[0]['store']).resolve()
          why_snow=json.load(open(out/'pnpm-why-prod-snowflake-sdk.json'))
          why_toml=json.load(open(out/'pnpm-why-prod-toml.json'))
          if len(why_snow)!=1 or why_snow[0].get('name')!='snowflake-sdk' or why_snow[0].get('version')!='2.1.0':
              raise SystemExit(f'unexpected snowflake pnpm why root: {why_snow}')
          snow_deps=why_snow[0].get('dependents') or []
          snow_parent_ids=sorted(f"{d.get('name')}@{d.get('version')}" for d in snow_deps)
          if snow_parent_ids != ['n8n-nodes-base@2.37.4']:
              raise SystemExit(f'unexpected snowflake production parents: {snow_parent_ids}')
          if len(why_toml)!=1 or why_toml[0].get('name')!='toml' or why_toml[0].get('version')!='3.0.0':
              raise SystemExit(f'unexpected toml pnpm why root: {why_toml}')
          toml_deps=why_toml[0].get('dependents') or []
          toml_parent_ids=sorted(f"{d.get('name')}@{d.get('version')}" for d in toml_deps)
          if toml_parent_ids != ['snowflake-sdk@2.1.0']:
              raise SystemExit(f'unexpected toml production parents: {toml_parent_ids}')
          nested=toml_deps[0].get('dependents') or []
          nested_ids=sorted(f"{d.get('name')}@{d.get('version')}" for d in nested)
          if nested_ids != ['n8n-nodes-base@2.37.4']:
              raise SystemExit(f'unexpected transitive Snowflake chain: {nested_ids}')
          links=[]
          for base,dirs,files in os.walk(root,followlinks=False):
              for name in list(dirs)+list(files):
                  p=Path(base)/name
                  if not p.is_symlink(): continue
                  try: target=p.resolve(strict=True)
                  except FileNotFoundError: continue
                  if target in targets:
                      links.append({'link':str(p),'target':str(target),'package':targets[target]})
          linked_packages=sorted(set(r['package'] for r in links))
          if linked_packages != ['snowflake-sdk@2.1.0','toml@3.0.0']:
              raise SystemExit(f'target filesystem links incomplete: {linked_packages}')
          parent_map={'snowflake-sdk@2.1.0':snow_parent_ids,'toml@3.0.0':toml_parent_ids}
          graph={'parents':parent_map,'transitive_chain':{'toml@3.0.0':['snowflake-sdk@2.1.0','n8n-nodes-base@2.37.4']},'pnpm_why_snowflake':why_snow,'pnpm_why_toml':why_toml,'filesystem_links':links,'authorized_removed_packages':['snowflake-sdk@2.1.0','toml@3.0.0'],'shared_parent_analysis':{'snowflake_sdk_external_parents':[],'toml_external_parents':[]}}
          json.dump(graph,open(out/'parent-map.json','w'),indent=2,sort_keys=True); print(json.dumps(graph,indent=2,sort_keys=True))
          for row in links:
              p=Path(row['link'])
              if p.is_symlink(): p.unlink()
          delete_targets=[]
          for r in (snow[0],toml[0]):
              pkg_dir=Path(r['dir']).resolve()
              store=Path(r['store']).resolve()
              meta=json.loads((pkg_dir/'package.json').read_text())
              ident=f"{meta.get('name')}@{meta.get('version')}"
              if ident not in authorized_target_ids:
                  raise SystemExit(f'unauthorized resolved delete identity: {ident}')
              expected_store=pkg_dir.parents[1].resolve()
              if store != expected_store or store.parent.resolve() != (root/'.pnpm').resolve():
                  raise SystemExit(f'resolved delete store mismatch for {ident}: store={store} expected={expected_store}')
              if store == n8n_store or n8n_store in store.parents:
                  raise SystemExit(f'delete target overlaps n8n-nodes-base store: {ident} target={store} n8n={n8n_store}')
              delete_targets.append({'package':ident,'dir':str(pkg_dir),'store':str(store)})
          if {r['package'] for r in delete_targets} != authorized_target_ids or len({r['store'] for r in delete_targets}) != 2:
              raise SystemExit(f'expected delete-target set mismatch: {delete_targets}')
          json.dump(delete_targets,open(out/'delete-targets.json','w'),indent=2,sort_keys=True)
          print(json.dumps({'resolved_delete_targets':delete_targets,'n8n_nodes_base_store':str(n8n_store)},indent=2,sort_keys=True))
          for row in delete_targets:
              store=Path(row['store'])
              if not store.exists(): raise SystemExit(f'resolved delete store missing before prune: {store}')
              shutil.rmtree(store)
          after=instances(); json.dump(after,open(out/'inventory.after.json','w'),indent=2,sort_keys=True)
          b={(r['name'],r['version']) for r in before}; a={(r['name'],r['version']) for r in after}
          removed=sorted(f'{n}@{v}' for n,v in b-a); added=sorted(f'{n}@{v}' for n,v in a-b)
          authorized_removed=['snowflake-sdk@2.1.0','toml@3.0.0']
          shared_non_snowflake_removed=sorted(x for x in removed if x not in authorized_removed)
          before_versions={}; after_versions={}
          for n,v in b: before_versions.setdefault(n,set()).add(v)
          for n,v in a: after_versions.setdefault(n,set()).add(v)
          version_changes=[]
          for n in sorted(set(before_versions)&set(after_versions)):
              if before_versions[n] != after_versions[n]:
                  version_changes.append({'name':n,'before':sorted(before_versions[n]),'after':sorted(after_versions[n])})
          delta={'removed':removed,'added':added,'version_changes':version_changes,'shared_non_snowflake_removed':shared_non_snowflake_removed}
          json.dump(delta,open(out/'package-delta.json','w'),indent=2,sort_keys=True); print(json.dumps(delta,indent=2,sort_keys=True))
          if removed != authorized_removed or added or version_changes or shared_non_snowflake_removed: raise SystemExit(f'unexpected prune delta: {delta}')
          if len([r for r in after if r['name']=='n8n-nodes-base' and r['version']=='2.37.4']) != 1: raise SystemExit('n8n-nodes-base@2.37.4 not preserved exactly once')
          if any(r['name']=='snowflake-sdk' for r in after): raise SystemExit('snowflake-sdk remains')
          if any(r['name']=='toml' and r['version']=='3.0.0' for r in after): raise SystemExit('toml 3.0.0 remains')
          PY
          ! find compiled/node_modules -type f -path '*/snowflake-sdk/package.json' -print -quit | grep .
          ! find compiled/node_modules -type f -path '*/toml/package.json' -exec grep -l '"version": "3.0.0"' {} + | grep .

      - name: Build hardened runtime base and exact APK evidence
        run: |
          set -euo pipefail
          cat > /tmp/Dockerfile.base <<'EOF'
          ARG DHI_REF
          FROM ${DHI_REF} AS evidence
          RUN apk add --no-cache busybox-binsh && \
              apk --no-cache add --virtual .build-deps-fonts msttcorefonts-installer fontconfig && \
              update-ms-fonts && fc-cache -f && apk del .build-deps-fonts && \
              find /usr/share/fonts/truetype/msttcorefonts/ -type l -exec unlink {} \; && \
              apk add --no-cache openssh graphicsmagick tini tzdata ca-certificates libc6-compat librdkafka && \
              mkdir -p /security-evidence && \
              cp /etc/apk/repositories /security-evidence/repositories.before && \
              cp /etc/apk/world /security-evidence/world.before && \
              cp /lib/apk/db/installed /security-evidence/installed.before && \
              (apk del openssh graphicsmagick 2>&1 | tee /security-evidence/removal.log) && \
              (apk add --no-cache --upgrade 'libcrypto3=3.5.8-r0' 'libssl3=3.5.8-r0' 'libexpat=2.8.4-r0' 2>&1 | tee /security-evidence/pins.log) && \
              apk policy libcrypto3 libssl3 libexpat > /security-evidence/policy.after.txt && \
              cp /etc/apk/repositories /security-evidence/repositories.after && \
              cp /etc/apk/world /security-evidence/world.after && \
              cp /lib/apk/db/installed /security-evidence/installed.after && \
              rm -rf /tmp/* /root/.npm /root/.cache/node /opt/yarn*
          FROM evidence AS final
          RUN apk del apk-tools && rm -rf /security-evidence
          RUN mkdir -p /usr/local/bin && ln -sf /usr/bin/node /usr/local/bin/node
          WORKDIR /home/node
          ENV NODE_PATH=/usr/local/lib/node_modules
          EXPOSE 5678/tcp
          EOF
          docker build --platform linux/amd64 --no-cache --target evidence --build-arg DHI_REF="$DHI_REF" -f /tmp/Dockerfile.base -t sitescore-n8n-base-pruned:evidence /tmp/n8n-src
          eid="$(docker create sitescore-n8n-base-pruned:evidence)"; docker cp "$eid:/security-evidence/." "$OUT/apk-evidence"; docker rm "$eid" >/dev/null
          docker build --platform linux/amd64 --no-cache --target final --build-arg DHI_REF="$DHI_REF" -f /tmp/Dockerfile.base -t "$HARDENED_BASE_IMAGE" /tmp/n8n-src
          docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'cat /lib/apk/db/installed' > "$OUT/final-installed.raw"
          test "$(docker image inspect "$HARDENED_BASE_IMAGE" --format '{{.Architecture}}')" = amd64
          test "$(docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'node --version')" = 'v26.5.1'
          ! docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'command -v apk >/dev/null'
          python - <<'PY'
          import os
          raw=open(os.environ['OUT']+'/final-installed.raw').read()
          for x in ('P:libcrypto3\nV:3.5.8-r0','P:libssl3\nV:3.5.8-r0','P:libexpat\nV:2.8.4-r0'):
              if x not in raw: raise SystemExit('required exact runtime pin missing: '+x)
          for x in ('P:openssh\n','P:graphicsmagick\n','P:apk-tools\n'):
              if x in raw: raise SystemExit('forbidden runtime package remains: '+x)
          for x in ('P:tini\n','P:tzdata\n','P:ca-certificates\n','P:librdkafka\n','P:gcompat\n'):
              if x not in raw: raise SystemExit('required runtime package/provider missing: '+x)
          PY

      - name: Build final Snowflake-pruned n8n image
        working-directory: /tmp/n8n-src
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg BUILDER_IMAGE="$BUILDER_IMAGE" --build-arg RUNTIME_IMAGE="$HARDENED_BASE_IMAGE" --build-arg N8N_VERSION="$N8N_VERSION" --build-arg N8N_RELEASE_TYPE=stable -f docker/images/n8n/Dockerfile -t sitescore-n8n-pruned-core:probe .
          cat > /tmp/Dockerfile.contract <<'EOF'
          FROM sitescore-n8n-pruned-core:probe
          ENV NODES_EXCLUDE='["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.emailSend","n8n-nodes-base.snowflake"]'
          EOF
          docker build --network=none --platform linux/amd64 -f /tmp/Dockerfile.contract -t "$PROBE_IMAGE" /tmp
          docker image inspect "$PROBE_IMAGE" > "$GITHUB_WORKSPACE/$OUT/final-image-inspect.json"
          docker image inspect "$PROBE_IMAGE" --format '{{.Id}}' > "$GITHUB_WORKSPACE/$OUT/final-image-id.txt"

      - name: Prove runtime health imports and disabled Snowflake capability
        run: |
          set -euo pipefail
          test "$(docker image inspect "$PROBE_IMAGE" --format '{{.Architecture}}')" = amd64
          user="$(docker image inspect "$PROBE_IMAGE" --format '{{.Config.User}}')"; test -n "$user" && test "$user" != root && test "$user" != 0
          test "$(docker run --rm "$PROBE_IMAGE" n8n --version | tr -d '\r' | tail -n1)" = "$N8N_VERSION"
          envs="$(docker image inspect "$PROBE_IMAGE" --format '{{json .Config.Env}}')"; printf '%s\n' "$envs" > "$OUT/image-env.json"
          for node in n8n-nodes-base.executeCommand n8n-nodes-base.localFileTrigger n8n-nodes-base.emailSend n8n-nodes-base.snowflake; do grep -F "$node" "$OUT/image-env.json"; done
          cid="$(docker run -d --rm --tmpfs /tmp:rw,nosuid,nodev -e N8N_USER_FOLDER=/tmp/n8n -e N8N_ENCRYPTION_KEY=ci-only-prune-key-0000000000000000000000 -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false -p 127.0.0.1:15678:5678 "$PROBE_IMAGE")"
          trap 'docker logs "$cid" > "$OUT/startup-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 120); do curl -fsS http://127.0.0.1:15678/healthz >/dev/null 2>&1 && break; sleep .5; done
          curl -fsS http://127.0.0.1:15678/healthz >/dev/null
          curl -fsS http://127.0.0.1:15678/types/nodes.json -o "$OUT/node-types.json"
          ! grep -Fq 'n8n-nodes-base.snowflake' "$OUT/node-types.json"
          ! grep -Fq 'n8n-nodes-base.emailSend' "$OUT/node-types.json"
          grep -Fq 'n8n-nodes-base.httpRequest' "$OUT/node-types.json"
          docker stop -t 5 "$cid" >/dev/null; trap - EXIT
          vol="sitescore-pruned-import-${GITHUB_RUN_ID}"; docker volume create "$vol" >/dev/null
          trap 'docker volume rm -f "$vol" >/dev/null 2>&1 || true' EXIT
          for wf in sitescore-order-paid-v1.json sitescore-recovery-schedule-v1.json; do docker run --rm -e N8N_ENCRYPTION_KEY=ci-only-prune-key-0000000000000000000000 -e N8N_DIAGNOSTICS_ENABLED=false -v "$vol:/home/node/.n8n" -v "$GITHUB_WORKSPACE/automation/n8n/workflows:/workflows:ro" "$PROBE_IMAGE" import:workflow --input="/workflows/$wf"; done
          docker volume rm -f "$vol" >/dev/null; trap - EXIT

      - name: Generate final SPDX and Grype evidence
        run: |
          set -euo pipefail
          syft="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          grype="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$syft" "$PROBE_IMAGE" -o spdx-json > "$OUT/n8n.spdx.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype" "$PROBE_IMAGE" -o json > "$OUT/n8n.grype.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype" "$OFFICIAL_IMAGE" -o json > "$OUT/official.grype.json"

      - name: Reconcile OpenVEX and CISA KEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o "$OUT/cisa-kev.json"
          python - <<'PY'
          import hashlib,json,os,urllib.request
          out=os.environ['OUT']; ctx=json.load(open(out+'/source-context.json')); token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/n8n-io/n8n/releases/{ctx["release_id"]}/assets',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-prune'})
          with urllib.request.urlopen(req,timeout=30) as r: assets=json.load(r)
          asset=next((a for a in assets if a.get('name')=='vex.openvex.json'),None)
          if not asset: raise SystemExit('exact stable OpenVEX asset missing')
          urllib.request.urlretrieve(asset['browser_download_url'],out+'/upstream.openvex.json')
          computed='sha256:'+hashlib.sha256(open(out+'/upstream.openvex.json','rb').read()).hexdigest(); recorded=asset.get('digest')
          verified=bool(recorded and recorded==computed)
          json.dump(asset,open(out+'/openvex-asset-metadata.json','w'),indent=2,sort_keys=True)
          json.dump({'metadata_digest':recorded,'computed_digest':computed,'verified':verified},open(out+'/openvex-asset-verification.json','w'),indent=2,sort_keys=True)
          if not verified: raise SystemExit('OpenVEX digest verification failed')
          ctx['selected_digest']=open(out+'/final-image-id.txt').read().strip(); json.dump(ctx,open(out+'/release-context.json','w'),indent=2,sort_keys=True)
          PY
          git show d008f7b9689a936afd09ac55397c82647477b644:deploy/containers/n8n_openvex_reconcile.py > /tmp/n8n_openvex_reconcile.py
          python /tmp/n8n_openvex_reconcile.py "$OUT"

      - name: Enforce final security threshold with sole nodemailer exception
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          out=os.environ['OUT']; rows=json.load(open(out+'/n8n.vendor-openvex-reconciliation.json')); official=json.load(open(out+'/official.grype.json'))
          critical=[r for r in rows if r['severity']=='CRITICAL' and r.get('final_disposition')!='VEX_NOT_AFFECTED_ALLOWED']
          high=[r for r in rows if r['severity']=='HIGH' and r.get('final_disposition')!='VEX_NOT_AFFECTED_ALLOWED']
          kev=[r for r in rows if r.get('CISA_KEV_alias_matches')]
          nodemailer=[]; other=[]
          for r in high:
              ids={str(x).upper() for x in (r.get('scanner_alias_ids') or [])}; ids.add(str(r.get('scanner_advisory_id') or '').upper())
              if r.get('package_name')=='nodemailer' and r.get('installed_version')=='8.0.10' and 'GHSA-P6GQ-J5CR-W38F' in ids: nodemailer.append(r)
              else: other.append(r)
          os_high=[r for r in high if r.get('package_type')=='apk']
          forbidden={n:[r for r in high if r.get('package_name')==n] for n in ('fast-uri','ip-address','brace-expansion','toml','snowflake-sdk')}
          official_high={(str((m.get('vulnerability') or {}).get('id')),str((m.get('artifact') or {}).get('name'))) for m in official.get('matches',[]) if str((m.get('vulnerability') or {}).get('severity') or '').upper()=='HIGH'}
          new_high=[r for r in high if (str(r.get('scanner_advisory_id')),str(r.get('package_name'))) not in official_high]
          summary={'BLOCKING_CRITICAL':len(critical),'CISA_KEV':len(kev),'OS_HIGH':len(os_high),'NEW_HIGH':len(new_high),'OTHER_HIGH':len(other),'NODEMAILER_EXCEPTION_CANDIDATES':len(nodemailer),'FORBIDDEN_PACKAGE_HIGH':{k:len(v) for k,v in forbidden.items()}}
          json.dump(summary,open(out+'/security-summary.json','w'),indent=2,sort_keys=True); print(json.dumps(summary,indent=2,sort_keys=True))
          if critical or kev or os_high or new_high or other or len(nodemailer)!=1 or any(forbidden.values()): raise SystemExit('final security threshold failed')
          PY

      - name: Prove nodemailer containment and frozen static contracts
        run: |
          set -euo pipefail
          ! grep -R -F 'n8n-nodes-base.emailSend' automation/n8n/workflows/*.json
          ! grep -R -F 'n8n-nodes-base.snowflake' automation/n8n/workflows/*.json
          ! grep -R -F 'n8n-nodes-base.executeCommand' automation/n8n/workflows/*.json
          ! grep -R -F 'n8n-nodes-base.readWriteFile' automation/n8n/workflows/*.json
          ! grep -Eiq 'SMTP|N8N_EMAIL_MODE|N8N_SMTP' automation/n8n/runtime/docker-compose.yml
          grep -F '127.0.0.1:5678:5678' automation/n8n/runtime/docker-compose.yml
          python -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          python -m pytest -q automation/n8n/tests | tee "$OUT/static-tests.txt"
          grep -E '12 passed' "$OUT/static-tests.txt"
          cat > "$OUT/nodemailer-risk-record-probe.md" <<'EOF'
          # nodemailer residual probe risk record
          Advisory: GHSA-p6gq-j5cr-w38f
          Package/version: nodemailer 8.0.10
          Owner: SiteScore owner/operator
          Controls: frozen workflows do not use emailSend; emailSend/executeCommand/localFileTrigger excluded; Snowflake excluded separately; no SMTP transport configured; n8n bind is loopback/non-public.
          Re-review triggers: newer official stable; upstream nodemailer remediation; workflow/node/exclusion/SMTP/network exposure change; FAZ7 final audit.
          EOF

      - name: Run order-paid and recovery compatibility smokes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re,difflib
          out=Path(os.environ['OUT']); paths=[Path('automation/n8n/tests/runtime_smoke.sh'),Path('automation/n8n/tests/recovery_schedule_runtime_smoke.sh'),Path('automation/n8n/tests/recovery_replay_runtime_smoke.sh')]
          for p in paths:
              text=p.read_text(); patched=text.replace('IMAGE="n8nio/n8n:2.33.4"','IMAGE="sitescore-n8n-snowflake-pruned:probe"').replace('docker pull "$IMAGE" >/dev/null\n','').replace('test "$VERSION" = "2.33.4"','test "$VERSION" = "2.37.10"')
              patched=re.sub(r'DIGEST="\$\(docker image inspect "\$IMAGE" --format \'\{\{index \.RepoDigests 0\}\}\'\)"\ncase "\$DIGEST" in .*?esac\n','DIGEST="$(docker image inspect "$IMAGE" --format \'{{.Id}}\')"\ntest -n "$DIGEST"\n',patched,count=1,flags=re.S)
              q=p.with_name('.probe-'+p.name); q.write_text(patched); q.chmod(0o755); (out/(p.name+'.probe.patch')).write_text(''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile=str(p),tofile=str(q))))
          PY
          trap 'rm -f automation/n8n/tests/.probe-runtime_smoke.sh automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh' EXIT
          bash automation/n8n/tests/.probe-runtime_smoke.sh | tee "$OUT/order-paid-runtime-smoke.txt"
          bash automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh | tee "$OUT/recovery-schedule-runtime-smoke.txt"
          bash automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh | tee "$OUT/recovery-replay-runtime-smoke.txt"
          rm -f automation/n8n/tests/.probe-runtime_smoke.sh automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh; trap - EXIT
          git diff --exit-code

      - name: Final decision
        run: |
          set -euo pipefail
          test -f "$OUT/package-delta.json"
          test -f "$OUT/security-summary.json"
          test -f "$OUT/order-paid-runtime-smoke.txt"
          test -f "$OUT/recovery-schedule-runtime-smoke.txt"
          test -f "$OUT/recovery-replay-runtime-smoke.txt"
          echo 'SNOWFLAKE_PRUNED_HARDENED_N8N_SECURITY_RUNTIME_WORKFLOW_GATE=PASS' | tee "$OUT/final-gate.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: faz7-n8n-snowflake-prune-${{ github.sha }}
          path: deploy/containers/artifacts/n8n-snowflake-prune-probe/
          if-no-files-found: warn
          retention-days: 14
