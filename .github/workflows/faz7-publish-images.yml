name: faz7-publish-images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.sha }}
      API_IMAGE: ghcr.io/metadoks/sitescore-api
      COMMERCE_IMAGE: ghcr.io/metadoks/sitescore-commerce
      N8N_IMAGE: ghcr.io/metadoks/sitescore-n8n
    steps:
      - name: Checkout exact main commit without third-party action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Authenticate GHCR with ephemeral GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Setup exact Node 26.5.1 for frozen n8n build
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '26.5.1'

      - name: Build and publish immutable linux amd64 application images
        run: |
          set -euo pipefail
          version="sha-${SOURCE_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --target runtime \
            --build-arg "SOURCE_REVISION=${SOURCE_SHA}" \
            --build-arg "SOURCE_VERSION=${version}" \
            --tag "${API_IMAGE}:${version}" \
            --push \
            --file deploy/containers/api/Dockerfile .
          docker buildx build \
            --platform linux/amd64 \
            --target runtime \
            --build-arg "SOURCE_REVISION=${SOURCE_SHA}" \
            --build-arg "SOURCE_VERSION=${version}" \
            --tag "${COMMERCE_IMAGE}:${version}" \
            --push \
            --file deploy/containers/commerce/Dockerfile .

      - name: Rebuild validate and publish exact frozen n8n candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v26.5.1'
          set -a
          . deploy/containers/n8n-image.lock
          set +a
          corepack enable
          corepack prepare "pnpm@${N8N_PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "$N8N_PNPM_VERSION"
          bash deploy/containers/n8n-frozen-candidate-ci.sh
          version="sha-${SOURCE_SHA}"
          docker tag "$N8N_CANDIDATE_IMAGE" "${N8N_IMAGE}:${version}"
          docker push "${N8N_IMAGE}:${version}"

      - name: Resolve exact published digests
        run: |
          set -euo pipefail
          mkdir -p deploy/containers/artifacts/publish
          version="sha-${SOURCE_SHA}"
          resolve_digest() {
            local ref="$1" output="$2" digest
            docker buildx imagetools inspect "$ref" > "$output"
            digest="$(awk '/^Digest:/ {print $2; exit}' "$output")"
            case "$digest" in sha256:*) ;; *) echo "invalid digest for $ref: $digest" >&2; exit 1;; esac
            printf '%s' "$digest"
          }
          api_digest="$(resolve_digest "${API_IMAGE}:${version}" deploy/containers/artifacts/publish/api-imagetools.txt)"
          commerce_digest="$(resolve_digest "${COMMERCE_IMAGE}:${version}" deploy/containers/artifacts/publish/commerce-imagetools.txt)"
          n8n_digest="$(resolve_digest "${N8N_IMAGE}:${version}" deploy/containers/artifacts/publish/n8n-imagetools.txt)"
          cat > deploy/containers/artifacts/publish/image-digests.env <<EOF
          SOURCE_SHA=${SOURCE_SHA}
          API_IMAGE=${API_IMAGE}@${api_digest}
          API_DIGEST=${api_digest}
          COMMERCE_IMAGE=${COMMERCE_IMAGE}@${commerce_digest}
          COMMERCE_DIGEST=${commerce_digest}
          N8N_IMAGE=${N8N_IMAGE}@${n8n_digest}
          N8N_DIGEST=${n8n_digest}
          EOF

      - name: Generate application SBOM and enforce vulnerability policy on published digests
        run: |
          set -euo pipefail
          . deploy/containers/artifacts/publish/image-digests.env
          syft_image="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          grype_image="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          docker pull --platform linux/amd64 "$API_IMAGE"
          docker pull --platform linux/amd64 "$COMMERCE_IMAGE"
          for name in api commerce; do
            eval "subject=\${${name^^}_IMAGE}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$syft_image" "$subject" -o spdx-json > "deploy/containers/artifacts/publish/${name}.spdx.json"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype_image" "$subject" -o json > "deploy/containers/artifacts/publish/${name}.grype.json"
            python - "$name" "deploy/containers/artifacts/publish/${name}.grype.json" <<'PY'
          import json, sys
          name, path = sys.argv[1:]
          data = json.load(open(path))
          blockers = []
          for match in data.get('matches', []):
              vulnerability = match.get('vulnerability') or {}
              severity = str(vulnerability.get('severity', '')).upper()
              fixes = (vulnerability.get('fix') or {}).get('versions') or []
              if severity == 'CRITICAL' or (severity == 'HIGH' and fixes):
                  artifact = match.get('artifact') or {}
                  blockers.append((vulnerability.get('id'), severity, artifact.get('name'), artifact.get('version'), fixes))
          print(f'{name.upper()}_VULNERABILITY_BLOCKERS={len(blockers)}')
          for blocker in blockers:
              print('BLOCKER', blocker)
          if blockers:
              raise SystemExit(42)
          PY
          done

      - name: Prove published n8n digest is exact validated candidate and generate SBOM
        run: |
          set -euo pipefail
          . deploy/containers/artifacts/publish/image-digests.env
          set -a
          . deploy/containers/n8n-image.lock
          set +a
          syft_image="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          grype_image="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          docker pull --platform linux/amd64 "$N8N_IMAGE"
          test "$(docker image inspect "$N8N_IMAGE" --format '{{.Architecture}}')" = amd64
          test "$(docker run --rm "$N8N_IMAGE" n8n --version | tr -d '\r' | tail -n 1)" = "$N8N_VERSION"
          validated_id="$(cat deploy/containers/artifacts/n8n-final/final-image-id.txt)"
          published_id="$(docker image inspect "$N8N_IMAGE" --format '{{.Id}}')"
          printf 'VALIDATED_IMAGE_ID=%s\nPUBLISHED_IMAGE_ID=%s\n' "$validated_id" "$published_id" | tee deploy/containers/artifacts/publish/n8n-image-id-equivalence.txt
          test "$published_id" = "$validated_id"
          envs="$(docker image inspect "$N8N_IMAGE" --format '{{json .Config.Env}}')"
          for node in n8n-nodes-base.executeCommand n8n-nodes-base.localFileTrigger n8n-nodes-base.emailSend n8n-nodes-base.snowflake; do printf '%s' "$envs" | grep -F "$node"; done
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$syft_image" "$N8N_IMAGE" -o spdx-json > deploy/containers/artifacts/publish/n8n.spdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype_image" "$N8N_IMAGE" -o json > deploy/containers/artifacts/publish/n8n.grype.json
          cp deploy/containers/artifacts/n8n-final/security-summary.json deploy/containers/artifacts/publish/n8n.security-summary.json
          cp deploy/containers/artifacts/n8n-final/package-delta.json deploy/containers/artifacts/publish/n8n.package-delta.json
          cp deploy/containers/artifacts/n8n-final/final-gate.txt deploy/containers/artifacts/publish/n8n.final-gate.txt
          grep -F 'FROZEN_N8N_2_37_10_SNOWFLAKE_PRUNED_SECURITY_RUNTIME_GATE=PASS' deploy/containers/artifacts/publish/n8n.final-gate.txt
          python - deploy/containers/artifacts/publish/n8n.spdx.json <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          packages={(p.get('name'), p.get('versionInfo')) for p in data.get('packages', [])}
          if ('n8n-nodes-base','2.37.4') not in packages:
              raise SystemExit('published n8n SBOM missing n8n-nodes-base@2.37.4')
          if any(name == 'snowflake-sdk' for name, version in packages):
              raise SystemExit('published n8n SBOM contains snowflake-sdk')
          if ('toml','3.0.0') in packages:
              raise SystemExit('published n8n SBOM contains toml@3.0.0')
          print('PUBLISHED_N8N_PRUNED_PACKAGE_IDENTITY=PASS')
          PY

      - name: Create signed provenance predicates
        run: |
          set -euo pipefail
          mkdir -p deploy/containers/artifacts/publish
          for name in api commerce; do
            python - "$name" "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json, pathlib, sys
          name, sha, run_id, run_attempt = sys.argv[1:]
          predicate = {
              'buildDefinition': {
                  'buildType': 'https://github.com/metadoks/sitescore/.github/workflows/faz7-publish-images.yml@refs/heads/main',
                  'externalParameters': {'image': name, 'source_revision': sha, 'platform': 'linux/amd64'},
                  'internalParameters': {},
                  'resolvedDependencies': [
                      {'uri': 'git+https://github.com/metadoks/sitescore', 'digest': {'gitCommit': sha}}
                  ],
              },
              'runDetails': {
                  'builder': {'id': f'https://github.com/metadoks/sitescore/actions/runs/{run_id}'},
                  'metadata': {'invocationId': f'{run_id}/{run_attempt}'},
              },
          }
          pathlib.Path(f'deploy/containers/artifacts/publish/{name}.provenance.json').write_text(
              json.dumps(predicate, indent=2, sort_keys=True) + '\n'
          )
          PY
          done
          set -a
          . deploy/containers/n8n-image.lock
          . deploy/containers/artifacts/publish/image-digests.env
          set +a
          python - <<'PY'
          import hashlib, json, os, pathlib
          lock=pathlib.Path('deploy/containers/n8n-image.lock')
          predicate={
              'buildDefinition': {
                  'buildType': 'https://github.com/metadoks/sitescore/.github/workflows/faz7-publish-images.yml@refs/heads/main',
                  'externalParameters': {'image':'n8n','source_revision':os.environ['SOURCE_SHA'],'platform':'linux/amd64','candidate':'n8n-2.37.10-snowflake-pruned'},
                  'internalParameters': {'lock_sha256':hashlib.sha256(lock.read_bytes()).hexdigest()},
                  'resolvedDependencies': [
                      {'uri':'git+https://github.com/metadoks/sitescore','digest':{'gitCommit':os.environ['SOURCE_SHA']}},
                      {'uri':'git+https://github.com/n8n-io/n8n','digest':{'gitCommit':os.environ['N8N_SOURCE_COMMIT'],'gitTree':os.environ['N8N_SOURCE_TREE']}},
                      {'uri':'docker://n8nio/n8n','digest':{'sha256':os.environ['N8N_OFFICIAL_AMD64_DIGEST'].split(':',1)[1]}},
                  ],
              },
              'runDetails': {
                  'builder': {'id':f'https://github.com/metadoks/sitescore/actions/runs/{os.environ["GITHUB_RUN_ID"]}'},
                  'metadata': {'invocationId':f'{os.environ["GITHUB_RUN_ID"]}/{os.environ["GITHUB_RUN_ATTEMPT"]}','publishedDigest':os.environ['N8N_DIGEST']},
              },
          }
          pathlib.Path('deploy/containers/artifacts/publish/n8n.provenance.json').write_text(json.dumps(predicate,indent=2,sort_keys=True)+'\n')
          PY

      - name: Keyless sign images and attest SBOM plus provenance
        run: |
          set -euo pipefail
          . deploy/containers/artifacts/publish/image-digests.env
          cosign_image="$(awk -F= '$1=="COSIGN_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          for name in api commerce n8n; do
            eval "subject=\${${name^^}_IMAGE}"
            common=(--rm -v "$HOME/.docker:/root/.docker:ro" -v "$PWD:/work" -w /work \
              -e ACTIONS_ID_TOKEN_REQUEST_TOKEN -e ACTIONS_ID_TOKEN_REQUEST_URL)
            docker run "${common[@]}" "$cosign_image" sign --yes "$subject"
            docker run "${common[@]}" "$cosign_image" attest --yes \
              --predicate "deploy/containers/artifacts/publish/${name}.spdx.json" \
              --type spdxjson "$subject"
            docker run "${common[@]}" "$cosign_image" attest --yes \
              --predicate "deploy/containers/artifacts/publish/${name}.provenance.json" \
              --type https://slsa.dev/provenance/v1 "$subject"
          done

      - name: Upload immutable publication evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: faz7-published-image-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: deploy/containers/artifacts/publish/
