name: faz6-6-4-frozen-exact-head-validation
on:
  pull_request:
    branches: [main]
jobs:
  frozen:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitescore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sitescore" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SITESCORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore
      SITESCORE_BROKER_URL: redis://127.0.0.1:6379/0
      SITESCORE_API_KEY_PEPPER: ci-pepper-value-not-real-0123456789-abcdefghijklmnopqrstuvwxyz
      SITESCORE_ANALYSIS_DEADLINE_SECONDS: "900"
      SITESCORE_WORKER_SOFT_LIMIT_SECONDS: "840"
      SITESCORE_WORKER_HARD_LIMIT_SECONDS: "900"
      SITESCORE_REPORT_STORAGE_BUCKET: sitescore-reports
      SITESCORE_REPORT_STORAGE_REGION: us-east-1
      SITESCORE_REPORT_STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      SITESCORE_REPORT_MAX_BYTES: "10485760"
      AWS_EC2_METADATA_DISABLED: "true"
      MPLCONFIGDIR: /tmp/sitescore-mplconfig
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0
      - name: Verify exact head base and frozen scope
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git merge-base --is-ancestor 7b0b63eb3f4a9fbd74a0bfd92ef793c7d7522fba HEAD
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','7b0b63eb3f4a9fbd74a0bfd92ef793c7d7522fba...HEAD'],text=True).splitlines()
          frozen=('sitescore-core/','sitescore-data/','sitescore-providers/','sitescore-spatial/','sitescore-metrics/','sitescore-benchmarks/','sitescore-pipeline/','sitescore-app/','sitescore-report/','sitescore-api/')
          assert not [p for p in changed if p.startswith(frozen)], changed
          allowed=('sitescore-commerce/','automation/n8n/','.github/workflows/faz6-6-4-validation.yml','.github/workflows/faz6-6-4-frozen-validation.yml')
          assert not [p for p in changed if not p.startswith(allowed)], changed
          print('FROZEN_SCOPE_SCAN=PASS')
          PY
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install frozen graph
        run: |
          python -m pip install --upgrade pip
          python -m pip install "shapely==2.1.2" "pyproj==3.7.2"
          for pkg in sitescore-core sitescore-data sitescore-providers sitescore-spatial sitescore-metrics sitescore-benchmarks sitescore-pipeline sitescore-app; do python -m pip install -e "$pkg" --no-deps; done
          python -m pip install -e "sitescore-report[dev]"
          python -m pip install -e "sitescore-api[dev]"
          python -m pip check
      - name: Scan workflow and delivery persistence for privileged material
        run: |
          python - <<'PY'
          from pathlib import Path
          export=Path('automation/n8n/workflows/sitescore-order-paid-v1.json').read_text().lower()
          for forbidden in ['sitescore_api_service_key','postmark_server_token','postgresql://','redis://','aws_secret_access_key','token_digest','secure_download_url','report_id','recipient']:
            assert forbidden not in export, forbidden
          migration=Path('sitescore-commerce/alembic/versions/0004_delivery_email.py').read_text().lower()
          for forbidden in ['raw_token','download_url','postmark_server_token']:
            assert forbidden not in migration, forbidden
          print('SECRET_BOUNDARY_SCAN=PASS')
          PY
      - name: Start private MinIO
        run: |
          ACCESS=$(python -c 'import secrets; print("ci"+secrets.token_hex(8))')
          SECRET=$(python -c 'import secrets; print(secrets.token_hex(24))')
          echo "::add-mask::$ACCESS"; echo "::add-mask::$SECRET"
          echo "AWS_ACCESS_KEY_ID=$ACCESS" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"
          docker run -d --name sitescore-minio -p 9000:9000 -e MINIO_ROOT_USER="$ACCESS" -e MINIO_ROOT_PASSWORD="$SECRET" minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --address :9000
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null
      - name: Upgrade frozen API migrations
        working-directory: sitescore-api
        run: alembic upgrade head
      - name: Prove private S3-compatible storage
        run: |
          python - <<'PY'
          import boto3,os
          from sitescore_api.report_artifacts import S3CompatibleObjectStorage
          endpoint=os.environ['SITESCORE_REPORT_STORAGE_ENDPOINT_URL']; bucket=os.environ['SITESCORE_REPORT_STORAGE_BUCKET']; region=os.environ['SITESCORE_REPORT_STORAGE_REGION']
          client=boto3.client('s3',endpoint_url=endpoint,region_name=region); client.create_bucket(Bucket=bucket)
          storage=S3CompatibleObjectStorage(bucket=bucket,region=region,endpoint_url=endpoint)
          payload=b'%PDF-1.7\n6.4 frozen regression\n%%EOF\n'; key='integration/private/report.pdf'
          storage.put(key,payload,content_type='application/pdf'); assert storage.get(key,max_bytes=1024)==payload; storage.delete(key)
          print('PRIVATE_S3_REGRESSION=PASS')
          PY
      - name: Locked sitescore-report suite
        working-directory: sitescore-report
        run: python -m pytest -o addopts='' -q
      - name: Locked sitescore-api suite
        working-directory: sitescore-api
        run: python -m pytest -o addopts='' -q
      - name: Re-prove Redis Celery transport
        run: |
          python -m celery -A sitescore_api.tasks:celery_app worker --loglevel=INFO --concurrency=1 --hostname=faz64@%h > /tmp/faz64-celery.log 2>&1 & echo $! > /tmp/faz64-celery.pid
          ready=0; for i in $(seq 1 20); do if python -m celery -A sitescore_api.tasks:celery_app inspect ping -t 1 >/tmp/faz64-ping.log 2>&1; then ready=1; break; fi; sleep 1; done; test "$ready" = "1"
          python - <<'PY'
          from uuid import uuid4
          from sitescore_api.runtime import build_runtime
          r=build_runtime(); assert r.celery_app.conf.task_ignore_result is True; assert r.celery_app.conf.task_acks_late is True; assert r.celery_app.conf.task_reject_on_worker_lost is True
          r.celery_app.send_task('sitescore_api.reconcile_timeouts',task_id=str(uuid4()))
          PY
          sleep 3; grep -q 'sitescore_api.reconcile_timeouts' /tmp/faz64-celery.log; kill "$(cat /tmp/faz64-celery.pid)" || true
          echo REDIS_CELERY_TRANSPORT=PASS
      - name: Frozen sitescore-app regression
        working-directory: sitescore-app
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-pipeline regression
        working-directory: sitescore-pipeline
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-benchmarks regression
        working-directory: sitescore-benchmarks
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-metrics regression
        working-directory: sitescore-metrics
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-spatial regression
        working-directory: sitescore-spatial
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-providers regression
        working-directory: sitescore-providers
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-data regression
        working-directory: sitescore-data
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-core regression
        working-directory: sitescore-core
        run: python -m pytest -o addopts='' -q
