name: faz7-7-1-n8n-candidate-probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/faz7-7-1-n8n-candidate-probe.yml'
      - 'deploy/containers/n8n-probe-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n8n-candidate-probe:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HISTORICAL_VERSION: '2.33.4'
    steps:
      - name: Checkout exact source head without third-party action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Probe official stable candidates in ordered four-version batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deploy/containers/artifacts/n8n-candidates
          export GRYPE_IMAGE="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          export SYFT_IMAGE="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          test -n "$GRYPE_IMAGE"
          test -n "$SYFT_IMAGE"
          python - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.request
          from urllib.parse import urlencode

          ARTIFACTS = pathlib.Path('deploy/containers/artifacts/n8n-candidates')
          HISTORICAL = tuple(map(int, os.environ['HISTORICAL_VERSION'].split('.')))
          TOKEN = os.environ['GH_TOKEN']
          GRYPE_IMAGE = os.environ['GRYPE_IMAGE']
          SYFT_IMAGE = os.environ['SYFT_IMAGE']
          BATCH_SIZE = 4

          def run(*args: str, capture: bool = False) -> str:
              result = subprocess.run(args, check=True, text=True, capture_output=capture)
              return result.stdout if capture else ''

          versions: set[tuple[int, int, int]] = set()
          for page in range(1, 11):
              url = 'https://api.github.com/repos/n8n-io/n8n/releases?' + urlencode({'per_page': 100, 'page': page})
              req = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {TOKEN}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'sitescore-faz7-n8n-probe',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  releases = json.load(response)
              if not releases:
                  break
              for release in releases:
                  if release.get('draft') or release.get('prerelease'):
                      continue
                  match = re.fullmatch(r'n8n@(\d+)\.(\d+)\.(\d+)', str(release.get('tag_name', '')))
                  if match:
                      version_tuple = tuple(map(int, match.groups()))
                      if version_tuple > HISTORICAL:
                          versions.add(version_tuple)
              if len(releases) < 100:
                  break

          ordered = ['.'.join(map(str, version)) for version in sorted(versions)]
          (ARTIFACTS / 'candidate-order.txt').write_text('\n'.join(ordered) + ('\n' if ordered else ''))
          if not ordered:
              (ARTIFACTS / 'summary.txt').write_text('NO_STABLE_CANDIDATE_ABOVE_HISTORICAL_BASELINE=1\n')
              raise SystemExit(43)

          def scan(version: str) -> dict[str, object]:
              tag = f'n8nio/n8n:{version}'
              raw_path = ARTIFACTS / f'{version}.manifest.json'
              raw = run('docker', 'buildx', 'imagetools', 'inspect', '--raw', tag, capture=True)
              raw_path.write_text(raw)
              manifest = json.loads(raw)
              matches = [
                  item for item in manifest.get('manifests', [])
                  if (item.get('platform') or {}).get('os') == 'linux'
                  and (item.get('platform') or {}).get('architecture') == 'amd64'
              ]
              if len(matches) != 1:
                  raise RuntimeError(f'{version}: expected one linux/amd64 manifest, got {len(matches)}')
              digest = matches[0]['digest']
              if not str(digest).startswith('sha256:'):
                  raise RuntimeError(f'{version}: invalid digest {digest}')
              image = f'n8nio/n8n@{digest}'
              run('docker', 'pull', '--platform', 'linux/amd64', image)
              arch = run('docker', 'image', 'inspect', image, '--format', '{{.Architecture}}', capture=True).strip()
              user = run('docker', 'image', 'inspect', image, '--format', '{{.Config.User}}', capture=True).strip()
              if arch != 'amd64' or not user or user in {'0', 'root'}:
                  raise RuntimeError(f'{version}: runtime contract failed arch={arch!r} user={user!r}')
              grype_path = ARTIFACTS / f'{version}.grype.json'
              with grype_path.open('w') as output:
                  subprocess.run(
                      ['docker', 'run', '--rm', '-v', '/var/run/docker.sock:/var/run/docker.sock', GRYPE_IMAGE, image, '-o', 'json'],
                      check=True,
                      text=True,
                      stdout=output,
                  )
              data = json.loads(grype_path.read_text())
              counts = {'CRITICAL': 0, 'HIGH': 0}
              for item in data.get('matches', []):
                  severity = str((item.get('vulnerability') or {}).get('severity', '')).upper()
                  if severity in counts:
                      counts[severity] += 1
              return {
                  'version': version,
                  'digest': digest,
                  'image': image,
                  'user': user,
                  'critical': counts['CRITICAL'],
                  'high': counts['HIGH'],
              }

          results: list[dict[str, object]] = []
          selected: dict[str, object] | None = None
          for start in range(0, len(ordered), BATCH_SIZE):
              batch = ordered[start:start + BATCH_SIZE]
              print('N8N_PROBE_BATCH', ','.join(batch), flush=True)
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(batch)) as executor:
                  batch_results = list(executor.map(scan, batch))
              batch_results.sort(key=lambda item: tuple(map(int, str(item['version']).split('.'))))
              results.extend(batch_results)
              passing = [item for item in batch_results if item['critical'] == 0 and item['high'] == 0]
              if passing:
                  selected = passing[0]
                  break

          with (ARTIFACTS / 'results.tsv').open('w') as output:
              output.write('candidate_version\tamd64_digest\truntime_user\tcritical\thigh\tstatus\n')
              for item in results:
                  status = 'SELECTED' if selected is item else 'REJECTED'
                  output.write(
                      f"{item['version']}\t{item['digest']}\t{item['user']}\t{item['critical']}\t{item['high']}\t{status}\n"
                  )

          if selected is None:
              (ARTIFACTS / 'summary.txt').write_text('NO_ACCEPTABLE_STABLE_CANDIDATE=1\n')
              raise SystemExit(42)

          image = str(selected['image'])
          with (ARTIFACTS / 'selected.spdx.json').open('w') as output:
              subprocess.run(
                  ['docker', 'run', '--rm', '-v', '/var/run/docker.sock:/var/run/docker.sock', SYFT_IMAGE, image, '-o', 'spdx-json'],
                  check=True,
                  text=True,
                  stdout=output,
              )
          runtime_version = run('docker', 'run', '--rm', image, 'n8n', '--version', capture=True).strip().splitlines()[-1]
          (ARTIFACTS / 'runtime-version.txt').write_text(runtime_version + '\n')
          if runtime_version != selected['version']:
              raise SystemExit(f"runtime version mismatch expected={selected['version']} actual={runtime_version}")

          selected_env = (
              f"SELECTED_N8N_VERSION={selected['version']}\n"
              f"SELECTED_N8N_DIGEST={selected['digest']}\n"
              f"SELECTED_N8N_IMAGE={selected['image']}\n"
              f"N8N_CRITICAL={selected['critical']}\n"
              f"N8N_HIGH={selected['high']}\n"
              f"N8N_RUNTIME_USER={selected['user']}\n"
          )
          (ARTIFACTS / 'selected.env').write_text(selected_env)
          (ARTIFACTS / 'summary.txt').write_text(selected_env)
          print(selected_env, end='')
          PY

      - name: Upload candidate probe evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: faz7-7-1-n8n-candidate-probe
          if-no-files-found: error
          retention-days: 14
          path: deploy/containers/artifacts/n8n-candidates/
