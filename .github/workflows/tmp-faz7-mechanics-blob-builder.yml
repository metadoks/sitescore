name: tmp-faz7-mechanics-blob-builder

on:
  push:
    branches:
      - tmp/faz7-7-1-mechanics-patch-20260906

permissions:
  contents: write

jobs:
  build-blob:
    runs-on: ubuntu-24.04
    steps:
      - name: Build corrected permanent CI blob only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 59e442f7aa517e289d4b0bb441c27af8b6528c11
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/faz7-container-ci.yml')
          s=p.read_text()
          old='-e SITESCORE_DATABASE_URL=postgresql://ci:ci@127.0.0.1/ci'
          new='-e SITESCORE_DATABASE_URL=postgresql+psycopg://ci:ci@127.0.0.1/ci'
          if s.count(old)!=1: raise SystemExit(f'expected one API smoke DSN, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          data=Path('.github/workflows/faz7-container-ci.yml').read_bytes()
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'sitescore-faz7-dsn-blob-builder'})
          with urllib.request.urlopen(req,timeout=30) as r: result=json.load(r)
          print('CI_BLOB_SHA='+result['sha'])
          print('CI_SHA256='+hashlib.sha256(data).hexdigest())
          PY
