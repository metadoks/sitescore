name: faz7-7-1-n8n-actionable-triage

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/faz7-7-1-n8n-actionable-triage.yml'

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      HISTORICAL_N8N_VERSION: '2.33.4'
    steps:
      - name: Checkout exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Resolve latest official stable n8n release and exact amd64 digest
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/n8n-triage deploy/containers/artifacts/n8n-actionable-triage
          python - <<'PY' > /tmp/n8n-triage/candidate.env
          import json, os, re, urllib.request
          from urllib.parse import urlencode
          token = os.environ['GH_TOKEN']
          versions = []
          releases = {}
          for page in range(1, 11):
              url = 'https://api.github.com/repos/n8n-io/n8n/releases?' + urlencode({'per_page': 100, 'page': page})
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'sitescore-faz7-actionable-triage',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  batch = json.load(response)
              if not batch:
                  break
              for release in batch:
                  if release.get('draft') or release.get('prerelease'):
                      continue
                  m = re.fullmatch(r'n8n@(\d+)\.(\d+)\.(\d+)', str(release.get('tag_name', '')))
                  if not m:
                      continue
                  version_tuple = tuple(map(int, m.groups()))
                  versions.append(version_tuple)
                  releases[version_tuple] = release
              if len(batch) < 100:
                  break
          if not versions:
              raise SystemExit('no official stable semantic n8n releases found')
          selected = max(versions)
          version = '.'.join(map(str, selected))
          release = releases[selected]
          print(f'SELECTED_N8N_VERSION={version}')
          print(f'SELECTED_N8N_TAG={release["tag_name"]}')
          print(f'SELECTED_N8N_RELEASE_ID={release["id"]}')
          print(f'SELECTED_N8N_PUBLISHED_AT={release.get("published_at", "")}')
          PY
          cat /tmp/n8n-triage/candidate.env
          . /tmp/n8n-triage/candidate.env
          tag="n8nio/n8n:${SELECTED_N8N_VERSION}"
          docker buildx imagetools inspect --raw "$tag" > /tmp/n8n-triage/manifest.json
          digest="$(python - <<'PY'
          import json
          data = json.load(open('/tmp/n8n-triage/manifest.json'))
          matches = [m for m in (data.get('manifests') or []) if (m.get('platform') or {}).get('os') == 'linux' and (m.get('platform') or {}).get('architecture') == 'amd64']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one linux/amd64 manifest, found {len(matches)}')
          print(matches[0]['digest'])
          PY
          )"
          case "$digest" in sha256:*) ;; *) echo "invalid digest: $digest" >&2; exit 1;; esac
          printf 'SELECTED_N8N_DIGEST=%s\nSELECTED_N8N_IMAGE=n8nio/n8n@%s\n' "$digest" "$digest" >> /tmp/n8n-triage/candidate.env
          cat /tmp/n8n-triage/candidate.env
          cp /tmp/n8n-triage/candidate.env deploy/containers/artifacts/n8n-actionable-triage/candidate.env
          cp /tmp/n8n-triage/manifest.json deploy/containers/artifacts/n8n-actionable-triage/manifest.json

      - name: Prove exact runtime identity and loadability
        run: |
          set -euo pipefail
          . /tmp/n8n-triage/candidate.env
          docker pull --platform linux/amd64 "$SELECTED_N8N_IMAGE" >/dev/null
          test "$(docker image inspect "$SELECTED_N8N_IMAGE" --format '{{.Architecture}}')" = amd64
          user="$(docker image inspect "$SELECTED_N8N_IMAGE" --format '{{.Config.User}}')"
          test -n "$user" && test "$user" != 0 && test "$user" != root
          runtime="$(docker run --rm "$SELECTED_N8N_IMAGE" n8n --version | tr -d '\r' | tail -n 1)"
          test "$runtime" = "$SELECTED_N8N_VERSION"
          printf 'N8N_USER=%s\nRUNTIME_VERSION=%s\n' "$user" "$runtime" | tee deploy/containers/artifacts/n8n-actionable-triage/runtime.txt
          cid="$(docker run -d --rm --tmpfs /tmp:rw,nosuid,nodev \
            -e N8N_USER_FOLDER=/tmp/n8n \
            -e N8N_ENCRYPTION_KEY=ci-only-encryption-key-00000000000000000000 \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -p 127.0.0.1:15678:5678 "$SELECTED_N8N_IMAGE")"
          trap 'docker logs "$cid" > deploy/containers/artifacts/n8n-actionable-triage/runtime.log 2>&1 || true; docker stop -t 5 "$cid" >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import socket, time
          for _ in range(60):
              try:
                  with socket.create_connection(('127.0.0.1', 15678), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('n8n runtime did not open port 5678')
          PY
          docker logs "$cid" > deploy/containers/artifacts/n8n-actionable-triage/runtime.log 2>&1 || true
          docker stop -t 5 "$cid" >/dev/null
          trap - EXIT
          test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = "02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1"
          test "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" = "f5409839cec1fa86b6af20f6cd242e71d52dceec8dcdb6cf35fd0b237e4a489c"

      - name: Generate SPDX SBOM and raw Grype evidence
        run: |
          set -euo pipefail
          . /tmp/n8n-triage/candidate.env
          syft_image="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          grype_image="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$syft_image" "$SELECTED_N8N_IMAGE" -o spdx-json > deploy/containers/artifacts/n8n-actionable-triage/n8n.spdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype_image" "$SELECTED_N8N_IMAGE" -o json > deploy/containers/artifacts/n8n-actionable-triage/n8n.grype.json

      - name: Fetch official CISA KEV and exact upstream OpenVEX asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . /tmp/n8n-triage/candidate.env
          curl --fail --location --silent --show-error \
            https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json \
            -o deploy/containers/artifacts/n8n-actionable-triage/cisa-kev.json
          python - <<'PY'
          import json, os, urllib.request
          release_id = os.environ.get('SELECTED_N8N_RELEASE_ID')
          if not release_id:
              values = {}
              for line in open('/tmp/n8n-triage/candidate.env'):
                  k, v = line.rstrip().split('=', 1)
                  values[k] = v
              release_id = values['SELECTED_N8N_RELEASE_ID']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/n8n-io/n8n/releases/{release_id}/assets',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'sitescore-faz7-actionable-triage',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              assets = json.load(response)
          vex = next((a for a in assets if a.get('name') == 'vex.openvex.json'), None)
          if vex is None:
              raise SystemExit('selected stable release has no vex.openvex.json asset')
          out = 'deploy/containers/artifacts/n8n-actionable-triage/openvex-asset-metadata.json'
          json.dump(vex, open(out, 'w'), indent=2, sort_keys=True)
          urllib.request.urlretrieve(vex['browser_download_url'], 'deploy/containers/artifacts/n8n-actionable-triage/upstream.openvex.json')
          PY

      - name: Build per-finding actionable disposition and gate summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('deploy/containers/artifacts/n8n-actionable-triage')
          grype = json.load(open(root/'n8n.grype.json'))
          kev_data = json.load(open(root/'cisa-kev.json'))
          vex_data = json.load(open(root/'upstream.openvex.json'))
          kev = {str(v.get('cveID')) for v in kev_data.get('vulnerabilities', []) if v.get('cveID')}
          vex_by_vuln = {}
          for statement in vex_data.get('statements', []):
              vuln = statement.get('vulnerability') or {}
              name = vuln.get('name') or vuln.get('@id') or vuln.get('id')
              if name:
                  vex_by_vuln.setdefault(str(name), []).append(statement)
          rows = []
          counts = {'CRITICAL': 0, 'HIGH': 0}
          remediable = {'CRITICAL': 0, 'HIGH': 0}
          kev_matches = 0
          undispositioned = {'CRITICAL': 0, 'HIGH': 0}
          for match in grype.get('matches', []):
              v = match.get('vulnerability') or {}
              severity = str(v.get('severity', '')).upper()
              if severity not in counts:
                  continue
              counts[severity] += 1
              a = match.get('artifact') or {}
              fix = v.get('fix') or {}
              fixed_versions = list(fix.get('versions') or [])
              fix_state = str(fix.get('state') or 'unknown').lower()
              advisory_id = str(v.get('id') or '')
              cisa = advisory_id in kev
              exact_vex = []
              for statement in vex_by_vuln.get(advisory_id, []):
                  status = str(statement.get('status') or '')
                  products = [str(p) for p in statement.get('products', [])]
                  exact_vex.append({'status': status, 'products': products, 'statement': statement})
              if cisa:
                  disposition = 'BLOCKED_KEV'
                  rationale = 'CISA KEV catalog exact advisory ID match'
                  kev_matches += 1
              elif fixed_versions or fix_state == 'fixed':
                  disposition = 'BLOCKED_REMEDIABLE'
                  rationale = 'Grype reports a fixed version/fixed state while candidate retains vulnerable package'
                  remediable[severity] += 1
              elif fix_state in {'not-fixed', 'wont-fix'}:
                  disposition = 'UPSTREAM_UNFIXED_NO_KEV'
                  rationale = f'Grype fix state={fix_state}; no fixed version reported; advisory absent from CISA KEV'
              else:
                  disposition = 'UNDISPOSITIONED'
                  rationale = f'fix state={fix_state} is not sufficient evidence for no-fix disposition'
                  undispositioned[severity] += 1
              rows.append({
                  'advisory_id': advisory_id,
                  'severity': severity,
                  'package_name': a.get('name'),
                  'package_type': a.get('type'),
                  'installed_version': a.get('version'),
                  'scanner_namespace': v.get('namespace'),
                  'scanner_data_source': v.get('dataSource'),
                  'fix_state': fix_state,
                  'fixed_versions': fixed_versions,
                  'CISA_KEV_match': cisa,
                  'upstream_VEX_statement_if_exactly_applicable': exact_vex,
                  'disposition': disposition,
                  'rationale_evidence_source': rationale,
              })
          summary = {
              'N8N_RAW_CRITICAL': counts['CRITICAL'],
              'N8N_RAW_HIGH': counts['HIGH'],
              'N8N_REMEDIABLE_CRITICAL': remediable['CRITICAL'],
              'N8N_REMEDIABLE_HIGH': remediable['HIGH'],
              'N8N_CISA_KEV_MATCHES': kev_matches,
              'N8N_UNDISPOSITIONED_CRITICAL': undispositioned['CRITICAL'],
              'N8N_UNDISPOSITIONED_HIGH': undispositioned['HIGH'],
          }
          json.dump(rows, open(root/'n8n.actionable-dispositions.json', 'w'), indent=2, sort_keys=True)
          json.dump(summary, open(root/'n8n.actionable-summary.json', 'w'), indent=2, sort_keys=True)
          for key, value in summary.items():
              print(f'{key}={value}')
          gate = not any([
              remediable['CRITICAL'], remediable['HIGH'], kev_matches,
              undispositioned['CRITICAL'], undispositioned['HIGH'],
          ])
          Path(root/'gate.txt').write_text('PASS\n' if gate else 'FAIL\n')
          print('N8N_ACTIONABLE_GATE=' + ('PASS' if gate else 'FAIL'))
          PY

      - name: Upload n8n actionable triage evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: faz7-n8n-actionable-triage-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 14
          path: deploy/containers/artifacts/n8n-actionable-triage/

      - name: Enforce actionable n8n security gate
        run: |
          set -euo pipefail
          test "$(cat deploy/containers/artifacts/n8n-actionable-triage/gate.txt)" = PASS
