name: faz7-7-1-regression-env-runner

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance

permissions:
  contents: write

jobs:
  run-patcher:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Execute normalized patcher body
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/faz7-7-1-regression-env-patcher.yml').read_text()
          marker='        run: |\n'
          if marker not in text:
              raise SystemExit('patcher run block missing')
          body=text.split(marker,1)[1]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/patcher.sh').write_text('\n'.join(lines)+'\n')
          PY
          cd ..
          bash /tmp/patcher.sh
