name: faz5-5-4-exact-validation

on:
  push:
    branches:
      - faz5/5-4-visual-report-pdf-rendering

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitescore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sitescore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SITESCORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore
      SITESCORE_BROKER_URL: redis://127.0.0.1:6379/0
      SITESCORE_API_KEY_PEPPER: test-only-ci-pepper-0123456789-abcdefghijklmnopqrstuvwxyz
      SITESCORE_ANALYSIS_DEADLINE_SECONDS: "900"
      SITESCORE_WORKER_SOFT_LIMIT_SECONDS: "840"
      SITESCORE_WORKER_HARD_LIMIT_SECONDS: "900"
      MPLCONFIGDIR: /tmp/sitescore-mplconfig

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact runtime and local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "shapely==2.1.2" "pyproj==3.7.2"
          for pkg in sitescore-core sitescore-data sitescore-providers sitescore-spatial sitescore-metrics sitescore-benchmarks sitescore-pipeline sitescore-app; do
            python -m pip install -e "$pkg" --no-deps
          done
          python -m pip install -e "sitescore-api[dev]"
          python -m pip install -e "sitescore-report[dev]"

      - name: Verify exact dependency versions
        run: |
          python - <<'PY'
          import importlib.metadata
          import sys
          import alembic, celery, fastapi, httpx, matplotlib, openai, psycopg, pydantic, pyproj, pytest, redis, shapely, sqlalchemy, weasyprint
          versions = {
              "Python": ".".join(map(str, sys.version_info[:3])),
              "FastAPI": fastapi.__version__,
              "Pydantic": pydantic.__version__,
              "SQLAlchemy": sqlalchemy.__version__,
              "Alembic": alembic.__version__,
              "psycopg": psycopg.__version__,
              "Celery": celery.__version__,
              "redis": redis.__version__,
              "HTTPX": httpx.__version__,
              "pytest": pytest.__version__,
              "Shapely": shapely.__version__,
              "pyproj": pyproj.__version__,
              "OpenAI": openai.__version__,
              "Jinja2": importlib.metadata.version("Jinja2"),
              "matplotlib": matplotlib.__version__,
              "weasyprint": weasyprint.__version__,
              "pypdf": importlib.metadata.version("pypdf"),
              "sitescore-core": importlib.metadata.version("sitescore-core"),
              "sitescore-app": importlib.metadata.version("sitescore-app"),
              "sitescore-api": importlib.metadata.version("sitescore-api"),
              "sitescore-report": importlib.metadata.version("sitescore-report"),
          }
          expected = {
              "FastAPI": "0.140.0",
              "Pydantic": "2.13.4",
              "SQLAlchemy": "2.0.51",
              "Alembic": "1.18.5",
              "psycopg": "3.3.4",
              "Celery": "5.6.3",
              "redis": "7.4.1",
              "HTTPX": "0.28.1",
              "pytest": "8.4.2",
              "Shapely": "2.1.2",
              "pyproj": "3.7.2",
              "OpenAI": "3.2.0",
              "Jinja2": "3.1.6",
              "matplotlib": "3.11.1",
              "weasyprint": "69.0",
              "pypdf": "6.14.2",
              "sitescore-core": "0.1.0",
              "sitescore-app": "0.1.0",
              "sitescore-api": "0.2.0",
              "sitescore-report": "0.3.0",
          }
          for key, value in versions.items():
              print(f"{key}={value}")
          for key, value in expected.items():
              assert versions[key] == value, (key, versions[key], value)
          PY

      - name: Run sitescore-report full suite
        working-directory: sitescore-report
        run: python -m pytest -o addopts='' -q

      - name: Generate representative visual PDF evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, str(Path("sitescore-report/tests").resolve()))
          from test_report_projection_authority import PREFIX

          body = r'''
          from pathlib import Path
          from sitescore_report import (
              NarrativeProviderConfig,
              build_canonical_report_facts,
              build_report_domain_model,
              build_validated_report_narrative,
              render_report_pdf,
          )

          OUT = Path("/tmp/sitescore-visual-fixtures")
          OUT.mkdir(parents=True, exist_ok=True)

          def emit(name, source):
              domain = build_report_domain_model(build_canonical_report_facts(source))
              narrative = build_validated_report_narrative(
                  domain,
                  config=NarrativeProviderConfig(model_id=None),
              )
              payload = render_report_pdf(domain, narrative)
              (OUT / name).write_bytes(payload)
              print(name, len(payload), domain.decision.decision_class, domain.confidence.label, domain.financial.stress_test_failed)

          emit(
              "normal-strong.pdf",
              build_scored(
                  "coffee",
                  score=95.0,
                  monthly_rent=200.0,
                  fixed_labor=200.0,
                  fixed_overhead=100.0,
              ),
          )
          emit(
              "financially-stressed.pdf",
              build_scored(
                  "restaurant",
                  score=5.0,
                  monthly_rent=500000.0,
                  fixed_labor=500000.0,
                  fixed_overhead=250000.0,
              ),
          )
          emit(
              "low-confidence-incomplete.pdf",
              build_scored(
                  "gym",
                  score=72.0,
                  geographic_level=GeographicLevel.UNKNOWN,
                  data_age_years=None,
                  data_coverage={"demand": CoverageLevel.DEGRADED},
                  input_qualities={"rent": InputQuality.DEFAULT},
              ),
          )
          '''
          subprocess.run(
              [sys.executable, "-c", PREFIX + "\n" + body],
              cwd=Path.cwd(),
              check=True,
          )
          PY

      - name: Verify generated PDF evidence structurally
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          expected = {
              "normal-strong.pdf",
              "financially-stressed.pdf",
              "low-confidence-incomplete.pdf",
          }
          root = Path("/tmp/sitescore-visual-fixtures")
          assert {path.name for path in root.glob("*.pdf")} == expected
          for path in sorted(root.glob("*.pdf")):
              payload = path.read_bytes()
              assert payload.startswith(b"%PDF-")
              reader = PdfReader(path)
              assert len(reader.pages) >= 3
              text = "\n".join(page.extract_text() or "" for page in reader.pages)
              assert "SiteScore AI" in text
              assert "empirical validation pending" in text.lower()
              print(path.name, len(payload), len(reader.pages))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: faz5-5-4-visual-pdf-evidence
          path: /tmp/sitescore-visual-fixtures/*.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Re-prove locked FAZ 5.1 PostgreSQL migration
        working-directory: sitescore-api
        run: alembic upgrade head

      - name: Run locked sitescore-api regression
        working-directory: sitescore-api
        run: python -m pytest -o addopts='' -q

      - name: Re-prove locked Redis broker and Celery worker transport
        run: |
          python -m celery -A sitescore_api.tasks:celery_app worker --loglevel=INFO --concurrency=1 --hostname=faz54@%h > /tmp/faz54-celery.log 2>&1 &
          echo $! > /tmp/faz54-celery.pid
          ready=0
          for i in $(seq 1 20); do
            if python -m celery -A sitescore_api.tasks:celery_app inspect ping -t 1 > /tmp/faz54-ping.log 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          cat /tmp/faz54-ping.log
          test "$ready" = "1"
          python - <<'PY'
          from uuid import uuid4
          from sitescore_api.runtime import build_runtime
          runtime = build_runtime()
          assert runtime.celery_app.conf.task_ignore_result is True
          assert runtime.celery_app.backend.__class__.__name__ == "DisabledBackend"
          runtime.celery_app.send_task("sitescore_api.reconcile_timeouts", task_id=str(uuid4()))
          PY
          sleep 3
          grep -q "sitescore_api.reconcile_timeouts" /tmp/faz54-celery.log
          kill "$(cat /tmp/faz54-celery.pid)" || true
          cat /tmp/faz54-celery.log

      - name: Frozen sitescore-app regression
        working-directory: sitescore-app
        run: python -m pytest -o addopts='' -q

      - name: Frozen sitescore-pipeline regression
        working-directory: sitescore-pipeline
        run: python -m pytest -o addopts='' -q

      - name: Frozen sitescore-benchmarks regression
        working-directory: sitescore-benchmarks
        run: python -m pytest -o addopts='' -q

      - name: Frozen sitescore-metrics regression
        working-directory: sitescore-metrics
        run: python -m pytest -o addopts='' -q

      - name: Frozen sitescore-spatial regression
        working-directory: sitescore-spatial
        run: python -m pytest -o addopts='' -q

      - name: Frozen sitescore-providers regression
        working-directory: sitescore-providers
        run: python -m pytest -o addopts='' -q

      - name: Frozen sitescore-data regression
        working-directory: sitescore-data
        run: python -m pytest -o addopts='' -q

      - name: Frozen sitescore-core regression
        working-directory: sitescore-core
        run: python -m pytest -o addopts='' -q
