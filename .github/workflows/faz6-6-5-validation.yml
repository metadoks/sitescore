name: faz6-6-5-exact-head-validation
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitescore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sitescore" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0
      - name: Verify exact head and base ancestry
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git merge-base --is-ancestor bdf43a891ca14941ba2f2c4f115e4a15bec0015a HEAD
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Configure test database
        run: echo 'SITESCORE_COMMERCE_DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore' >> "$GITHUB_ENV"
      - name: Install frozen graph and commerce
        run: |
          python -m pip install --upgrade pip
          python -m pip install "shapely==2.1.2" "pyproj==3.7.2"
          for pkg in sitescore-core sitescore-data sitescore-providers sitescore-spatial sitescore-metrics sitescore-benchmarks sitescore-pipeline sitescore-app; do python -m pip install -e "$pkg" --no-deps; done
          python -m pip install -e "sitescore-report[dev]"
          python -m pip install -e "sitescore-api[dev]"
          python -m pip install -e "sitescore-commerce[test]"
          python -m pip check
          python -m compileall -q sitescore-commerce/src sitescore-commerce/tests automation/n8n/tests
      - name: Verify package version
        run: python -c "import importlib.metadata as m; assert m.version('sitescore-commerce')=='0.6.0'"
      - name: Commerce migration cycle and full suite
        working-directory: sitescore-commerce
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python -m pytest -o addopts='' -q --tb=short
      - name: Verify migration head
        run: |
          python - <<'PY'
          import os, sqlalchemy as sa
          e=sa.create_engine(os.environ['SITESCORE_COMMERCE_DATABASE_URL']); i=sa.inspect(e)
          required={'recovery_runs','recovery_state','payment_poll_receipts','outbox_replay_audit','recovery_findings'}
          assert required <= set(i.get_table_names(schema='commerce'))
          cols={c['name'] for c in i.get_columns('stripe_event_inbox',schema='commerce')}
          assert 'candidate_order_id' in cols
          with e.connect() as c: assert c.execute(sa.text('SELECT version_num FROM commerce.alembic_version')).scalar_one()=='0005_recovery_reconciliation'
          print('RECOVERY_0005=PASS')
          PY
      - name: n8n static contracts
        run: python -m pytest -q automation/n8n/tests/test_workflow_static.py automation/n8n/tests/test_recovery_schedule_static.py
      - name: Prove locked order workflow artifact unchanged
        run: test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = '02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1'
      - name: Pinned n8n 2.33.4 locked order runtime regression
        shell: bash
        run: |
          status=1
          for attempt in 1 2; do
            echo "LOCKED_N8N_RUNTIME_ATTEMPT=$attempt"
            set +e
            bash automation/n8n/tests/runtime_smoke.sh > "/tmp/n8n65-locked-runtime-$attempt.log" 2>&1
            status=$?
            set -e
            cat "/tmp/n8n65-locked-runtime-$attempt.log"
            if [ "$status" -eq 0 ]; then
              break
            fi
            echo '--- LOCKED RUNTIME FAILURE MARKERS ---'
            grep -E 'N8N_|PASS|FAIL|Assertion|assert|ERROR|Error|error|failed|timed|timeout' "/tmp/n8n65-locked-runtime-$attempt.log" | tail -n 160 || true
            docker ps -aq --filter 'name=sitescore-n8n64-' | xargs -r docker rm -f >/dev/null 2>&1 || true
          done
          exit "$status"
      - name: Pinned n8n 2.33.4 recovery scheduler runtime
        run: bash automation/n8n/tests/recovery_schedule_runtime_smoke.sh
      - name: Pinned n8n 2.33.4 stuck-state recovery replay convergence
        run: bash automation/n8n/tests/recovery_replay_runtime_smoke.sh
