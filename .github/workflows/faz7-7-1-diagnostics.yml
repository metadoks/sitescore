name: faz7-7-1-diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/faz7-7-1-diagnostics.yml'

permissions:
  contents: read

env:
  BASE_SHA: fff9cb2b2f7fd142f1bdba436acf66f2948bc9b7
  FAZ6_COMMERCE_SHA: ee45e4fdd3d805137387a0fc1198eedf8d461fb2
  PYTHON_IMAGE: python:3.11.16-slim-bookworm@sha256:2e32f7d302adc1c37428355c1e646897c0c53f4fd60b6a551245fb90ee129f91

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact head with ancestry and prove merge base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git fetch --no-tags origin "${BASE_SHA}"
          git merge-base --is-ancestor "${BASE_SHA}" "${SOURCE_SHA}"
          git diff --check "${BASE_SHA}...${SOURCE_SHA}"
          git diff --name-only "${BASE_SHA}...${SOURCE_SHA}"
          echo 'DIAG_MERGE_BASE=PASS'

      - name: Build exact test images
        run: |
          set -euo pipefail
          version="diag-${SOURCE_SHA}"
          docker buildx build --platform linux/amd64 --load --target test \
            --build-arg "SOURCE_REVISION=${SOURCE_SHA}" --build-arg "SOURCE_VERSION=${version}" \
            -f deploy/containers/api/Dockerfile -t sitescore-api:diag .
          docker buildx build --platform linux/amd64 --load --target test \
            --build-arg "SOURCE_REVISION=${SOURCE_SHA}" --build-arg "SOURCE_VERSION=${version}" \
            -f deploy/containers/commerce/Dockerfile -t sitescore-commerce:diag .

      - name: Diagnose current API Report Commerce regressions
        run: |
          set -euo pipefail
          run_test() {
            label="$1"; shift
            set +e
            output="$($@ 2>&1)"
            rc=$?
            set -e
            printf '\n===== %s rc=%s =====\n%s\n' "$label" "$rc" "$output"
            return "$rc"
          }
          rc=0
          run_test API docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-api:diag python -m pytest -q /testsrc/sitescore-api/tests || rc=1
          run_test REPORT docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-api:diag python -m pytest -q /testsrc/sitescore-report/tests || rc=1
          run_test COMMERCE docker run --rm --tmpfs /tmp:rw,nosuid,nodev sitescore-commerce:diag python -m pytest -q tests --deselect tests/test_faz6_final_freeze_gate.py::test_final_candidate_is_based_on_corrective_locked_main_and_permanent_diff_is_audit_only || rc=1
          exit "$rc"

  faz6-replay-diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen FAZ6 Commerce base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${FAZ6_COMMERCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${FAZ6_COMMERCE_SHA}"

      - name: Diagnose frozen FAZ6 Commerce replay
        run: |
          set -euo pipefail
          set +e
          output="$(docker run --rm -v "$PWD:/repo" -w /repo "$PYTHON_IMAGE" sh -euc '
            python -m venv /tmp/faz6-commerce
            /tmp/faz6-commerce/bin/pip install "./sitescore-commerce[test]" >/dev/null
            /tmp/faz6-commerce/bin/python -m pytest sitescore-commerce/tests -q
          ' 2>&1)"
          rc=$?
          set -e
          printf '===== FAZ6_REPLAY rc=%s =====\n%s\n' "$rc" "$output"
          exit "$rc"
