name: faz6-6-2-exact-head-validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: sitescore}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sitescore" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SITESCORE_COMMERCE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore
      COMMERCE_ENV: test
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      STRIPE_PRICE_LOCATION_REPORT_V1: price_1234567890
      STRIPE_API_VERSION: 2026-07-29.dahlia
      STRIPE_WEBHOOK_SECRET: test_signing_secret_not_real
      STRIPE_EXPECTED_LIVEMODE: "false"
      COMMERCE_SUCCESS_URL_BASE: https://commerce.example.test/success
      COMMERCE_CANCEL_URL_BASE: https://commerce.example.test/cancel
      SITESCORE_API_BASE_URL: https://sitescore-api.example.test
      SITESCORE_API_SERVICE_KEY: ssk1_ci-key-id.ci-service-secret-not-real-0123456789
      SITESCORE_API_TARGET_ID: ci-frozen-api-v1
      SITESCORE_API_TIMEOUT_SECONDS: "10"
      COMMERCE_AUTOMATION_API_KEY: test-automation-key-not-real-0123456789
      SITESCORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore
      SITESCORE_BROKER_URL: redis://127.0.0.1:6379/0
      SITESCORE_API_KEY_PEPPER: test-only-ci-pepper-0123456789-abcdefghijklmnopqrstuvwxyz
      SITESCORE_ANALYSIS_DEADLINE_SECONDS: "900"
      SITESCORE_WORKER_SOFT_LIMIT_SECONDS: "840"
      SITESCORE_WORKER_HARD_LIMIT_SECONDS: "900"
      SITESCORE_REPORT_STORAGE_BUCKET: sitescore-reports
      SITESCORE_REPORT_STORAGE_REGION: us-east-1
      SITESCORE_REPORT_STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      SITESCORE_REPORT_MAX_BYTES: "10485760"
      AWS_EC2_METADATA_DISABLED: "true"
      MPLCONFIGDIR: /tmp/sitescore-mplconfig
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0}
      - name: Verify exact PR head and frozen base ancestry
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git merge-base --is-ancestor 8027239b4b168e98e8ee16e15787366632017156 HEAD
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install exact runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "shapely==2.1.2" "pyproj==3.7.2"
          for pkg in sitescore-core sitescore-data sitescore-providers sitescore-spatial sitescore-metrics sitescore-benchmarks sitescore-pipeline sitescore-app; do python -m pip install -e "$pkg" --no-deps; done
          python -m pip install -e "sitescore-report[dev]"
          python -m pip install -e "sitescore-api[dev]"
          python -m pip install -e "sitescore-commerce[test]"
          python -m pip check
      - name: Verify commerce exact pins
        run: |
          python - <<'PY'
          import importlib.metadata
          expected={"fastapi":"0.140.0","pydantic":"2.13.4","SQLAlchemy":"2.0.51","alembic":"1.18.5","psycopg":"3.3.4","stripe":"15.4.0","httpx":"0.28.1","pytest":"8.4.2","sitescore-commerce":"0.3.0"}
          for name,version in expected.items(): assert importlib.metadata.version(name)==version,(name,importlib.metadata.version(name),version)
          PY
      - name: Commerce PostgreSQL 16 rollback cycle and full suite
        working-directory: sitescore-commerce
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python -m pytest -o addopts='' -q
      - name: Prove commerce 6.2 migration namespace
        run: |
          python - <<'PY'
          import os, sqlalchemy as sa
          engine=sa.create_engine(os.environ["SITESCORE_COMMERCE_DATABASE_URL"]); insp=sa.inspect(engine)
          assert {"orders","order_idempotency","checkout_sessions","stripe_event_inbox","outbox_events","fulfillment_bindings","refund_eligibility","refund_operations","alembic_version"}<=set(insp.get_table_names(schema="commerce"))
          assert "alembic_version" not in set(insp.get_table_names(schema="public"))
          with engine.connect() as c:
            assert c.execute(sa.text("SELECT version_num FROM commerce.alembic_version")).scalar_one()=="0003_fulfillment_refund"
            print(c.execute(sa.text("SELECT version()")).scalar_one())
          PY
      - name: Secret and frozen-scope scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          changed=subprocess.check_output(["git","diff","--name-only","8027239b4b168e98e8ee16e15787366632017156...HEAD"],text=True).splitlines()
          frozen=("sitescore-core/","sitescore-data/","sitescore-providers/","sitescore-spatial/","sitescore-metrics/","sitescore-benchmarks/","sitescore-pipeline/","sitescore-app/","sitescore-report/","sitescore-api/")
          assert not [p for p in changed if p.startswith(frozen)]
          assert all(".env" not in Path(p).name for p in changed)
          for f in changed:
            p=Path(f)
            if p.is_file():
              t=p.read_text(errors="ignore")
              for pat in [r"sk_live_[A-Za-z0-9]+",r"whsec_[A-Za-z0-9]+",r"AKIA[0-9A-Z]{16}"]: assert re.search(pat,t) is None,(f,pat)
          print("SECRET_SCAN=PASS", "FROZEN_SCOPE_SCAN=PASS")
          PY
      - name: Start pinned private MinIO integration service
        run: |
          ACCESS=$(python -c 'import secrets; print("ci"+secrets.token_hex(8))'); SECRET=$(python -c 'import secrets; print(secrets.token_hex(24))'); echo "::add-mask::$ACCESS"; echo "::add-mask::$SECRET"; echo "AWS_ACCESS_KEY_ID=$ACCESS" >> "$GITHUB_ENV"; echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"
          docker run -d --name sitescore-minio -p 9000:9000 -e MINIO_ROOT_USER="$ACCESS" -e MINIO_ROOT_PASSWORD="$SECRET" minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --address :9000
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null
      - name: Upgrade PostgreSQL through frozen FAZ 5 migrations
        working-directory: sitescore-api
        run: alembic upgrade head
      - name: Prove frozen private S3-compatible storage
        run: |
          python - <<'PY'
          import boto3,os
          from sitescore_api.report_artifacts import S3CompatibleObjectStorage
          endpoint=os.environ["SITESCORE_REPORT_STORAGE_ENDPOINT_URL"]; bucket=os.environ["SITESCORE_REPORT_STORAGE_BUCKET"]; region=os.environ["SITESCORE_REPORT_STORAGE_REGION"]
          client=boto3.client("s3",endpoint_url=endpoint,region_name=region); client.create_bucket(Bucket=bucket); storage=S3CompatibleObjectStorage(bucket=bucket,region=region,endpoint_url=endpoint); payload=b"%PDF-1.7\n6.2 regression\n%%EOF\n"; key="integration/private/report.pdf"; storage.put(key,payload,content_type="application/pdf"); assert storage.get(key,max_bytes=1024)==payload; storage.delete(key)
          PY
      - {name: Locked sitescore-report suite, working-directory: sitescore-report, run: "python -m pytest -o addopts='' -q"}
      - {name: Locked sitescore-api suite, working-directory: sitescore-api, run: "python -m pytest -o addopts='' -q"}
      - name: Re-prove Redis/Celery execution transport
        run: |
          python -m celery -A sitescore_api.tasks:celery_app worker --loglevel=INFO --concurrency=1 --hostname=faz62@%h > /tmp/faz62-celery.log 2>&1 & echo $! > /tmp/faz62-celery.pid
          ready=0; for i in $(seq 1 20); do if python -m celery -A sitescore_api.tasks:celery_app inspect ping -t 1 >/tmp/faz62-ping.log 2>&1; then ready=1; break; fi; sleep 1; done; test "$ready" = "1"
          python - <<'PY'
          from uuid import uuid4
          from sitescore_api.runtime import build_runtime
          r=build_runtime(); assert r.celery_app.conf.task_ignore_result is True; assert r.celery_app.conf.task_acks_late is True; assert r.celery_app.conf.task_reject_on_worker_lost is True; r.celery_app.send_task("sitescore_api.reconcile_timeouts",task_id=str(uuid4()))
          PY
          sleep 3; grep -q "sitescore_api.reconcile_timeouts" /tmp/faz62-celery.log; kill "$(cat /tmp/faz62-celery.pid)" || true
      - {name: Frozen sitescore-app regression, working-directory: sitescore-app, run: "python -m pytest -o addopts='' -q"}
      - {name: Frozen sitescore-pipeline regression, working-directory: sitescore-pipeline, run: "python -m pytest -o addopts='' -q"}
      - {name: Frozen sitescore-benchmarks regression, working-directory: sitescore-benchmarks, run: "python -m pytest -o addopts='' -q"}
      - {name: Frozen sitescore-metrics regression, working-directory: sitescore-metrics, run: "python -m pytest -o addopts='' -q"}
      - {name: Frozen sitescore-spatial regression, working-directory: sitescore-spatial, run: "python -m pytest -o addopts='' -q"}
      - {name: Frozen sitescore-providers regression, working-directory: sitescore-providers, run: "python -m pytest -o addopts='' -q"}
      - {name: Frozen sitescore-data regression, working-directory: sitescore-data, run: "python -m pytest -o addopts='' -q"}
      - {name: Frozen sitescore-core regression, working-directory: sitescore-core, run: "python -m pytest -o addopts='' -q"}
