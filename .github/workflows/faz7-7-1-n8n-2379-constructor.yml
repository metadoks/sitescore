name: faz7-7-1-n8n-2379-constructor

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - name: Emit n8n 2.37.9 hardened probe and CI evidence blobs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, urllib.request

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, got {count}')
              return text.replace(old, new, 1)

          template = Path('deploy/containers/_n8n-2379-solver-template.yml').read_text()
          s = template
          s = one(s, 'name: faz7-7-1-n8n-apk-solver-probe', 'name: faz7-7-1-n8n-2379-hardened-probe', 'workflow name')
          s = one(s, "UPSTREAM_STABLE_VERSION: '2.37.7'", "UPSTREAM_STABLE_VERSION: '2.37.9'", 'stable version')
          s = one(s, "UPSTREAM_STABLE_COMMIT: '2a4ca7868dc75edca4c575d6507021e1e6b0ec90'", "UPSTREAM_STABLE_COMMIT: '073ec4552a6675a10f5b212d55bdc00c91d4829b'", 'stable commit')
          s = one(s, "UPSTREAM_STABLE_TREE: '40ff00093dbc474f82b4a133eb8ca51a3c76734a'", "UPSTREAM_STABLE_TREE: 'e825fca3c49cca4c0dddf23a9fc426a289118ed1'", 'stable tree')
          s = one(s, "OFFICIAL_IMAGE: 'n8nio/n8n@sha256:869500232f49760d6a422d320d3ead3cb28ee93a00e6f67c89eb3d6b81acd6be'", "OFFICIAL_IMAGE: 'n8nio/n8n@sha256:ed6bbab565eddbb688f394594cb2932d2b3b24f02240299a8fcce78bfe4201db'", 'official image')
          s = one(s, "UPSTREAM_MASTER_COMMIT: 'efd3ec9e260ef9ac7d9cbc134952590bedd33acb'", "UPSTREAM_MASTER_COMMIT: 'fd105a6dc2cd51b5e5fd64c2efad57e6801d2325'\n      UPSTREAM_DEP_EVIDENCE_COMMIT: '64de0e71db286afb7537324aa4367a3f97cd6d19'", 'master/evidence commit')
          s = s.replace('n8n-apk-solver-probe', 'n8n-2379-hardened-probe')
          s = s.replace('2.37.7', '2.37.9')

          s = one(
              s,
              'git -C /tmp/n8n-src fetch --depth=1 origin "$UPSTREAM_STABLE_COMMIT" "$UPSTREAM_MASTER_COMMIT"',
              'git -C /tmp/n8n-src fetch --depth=1 origin "$UPSTREAM_STABLE_COMMIT" "$UPSTREAM_MASTER_COMMIT" "$UPSTREAM_DEP_EVIDENCE_COMMIT"',
              'upstream fetch')

          s = one(
              s,
              "              'master_build_commit':os.environ['UPSTREAM_MASTER_COMMIT'],\n",
              "              'master_build_commit':os.environ['UPSTREAM_MASTER_COMMIT'],\n              'dependency_security_evidence_commit':os.environ['UPSTREAM_DEP_EVIDENCE_COMMIT'],\n",
              'source context evidence')

          dep_anchor = "          grep -F 'brace-expansion@5: 5.0.9' /tmp/n8n-src/pnpm-workspace.yaml\n          git -C /tmp/n8n-src diff --exit-code\n"
          dep_block = r'''          grep -F 'brace-expansion@5: 5.0.9' /tmp/n8n-src/pnpm-workspace.yaml
          grep -F 'fast-uri: 3.1.5' /tmp/n8n-src/pnpm-workspace.yaml
          git -C /tmp/n8n-src diff --exit-code
          git -C /tmp/n8n-src show "$UPSTREAM_DEP_EVIDENCE_COMMIT:pnpm-workspace.yaml" > "$GITHUB_WORKSPACE/$OUT/upstream-security-overrides-evidence.yaml"
          grep -F 'fast-uri: 3.1.6' "$GITHUB_WORKSPACE/$OUT/upstream-security-overrides-evidence.yaml"
          grep -F 'ip-address@10: 10.3.1' "$GITHUB_WORKSPACE/$OUT/upstream-security-overrides-evidence.yaml"
          grep -F 'brace-expansion@5: 5.0.9' "$GITHUB_WORKSPACE/$OUT/upstream-security-overrides-evidence.yaml"
          cp /tmp/n8n-src/pnpm-workspace.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-workspace.pre.yaml"
          cp /tmp/n8n-src/pnpm-lock.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-lock.pre.yaml"
          python - <<'PYDEP'
          from pathlib import Path
          p=Path('/tmp/n8n-src/pnpm-workspace.yaml'); text=p.read_text()
          old='  fast-uri: 3.1.5\n'; new='  fast-uri: 3.1.6\n'
          if text.count(old)!=1: raise SystemExit(f'expected one stable fast-uri override, got {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PYDEP
          (cd /tmp/n8n-src && pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts)
          cp /tmp/n8n-src/pnpm-workspace.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-workspace.post.yaml"
          cp /tmp/n8n-src/pnpm-lock.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-lock.post.yaml"
          git -C /tmp/n8n-src diff -- pnpm-workspace.yaml pnpm-lock.yaml > "$GITHUB_WORKSPACE/$OUT/dependency-security-delta.patch"
          python - <<'PYLOCK'
          from pathlib import Path
          import difflib
          pre=Path('/tmp/n8n-src').joinpath('pnpm-lock.yaml')
          before=Path(Path.cwd() / __import__('os').environ['OUT'] / 'pnpm-lock.pre.yaml').read_text().splitlines(True)
          after=pre.read_text().splitlines(True)
          diff=list(difflib.unified_diff(before,after,n=4))
          hunks=[]; current=[]
          for line in diff:
              if line.startswith('@@'):
                  if current: hunks.append(current)
                  current=[line]
              elif current:
                  current.append(line)
          if current: hunks.append(current)
          allowed=('fast-uri','ip-address','brace-expansion')
          bad=[h for h in hunks if not any(tok in ''.join(h) for tok in allowed)]
          if bad:
              raise SystemExit('pnpm lock delta contains non-authorized hunk: '+''.join(bad[0])[:2000])
          workspace=Path('/tmp/n8n-src/pnpm-workspace.yaml').read_text()
          if '  fast-uri: 3.1.6\n' not in workspace or '  fast-uri: 3.1.5\n' in workspace:
              raise SystemExit('fast-uri workspace override delta invalid')
          lock=''.join(after)
          required=('fast-uri@3.1.6','ip-address@10.3.1','brace-expansion@5.0.9')
          for token in required:
              if token not in lock: raise SystemExit(f'fixed lock token missing: {token}')
          for token in ('fast-uri@3.1.5','ip-address@10.2.0','brace-expansion@5.0.8'):
              if token in lock: raise SystemExit(f'vulnerable lock token remains: {token}')
          print('DEPENDENCY_SECURITY_LOCK_DELTA=AUTHORIZED_ONLY')
          PYLOCK
'''
          s = one(s, dep_anchor, dep_block, 'dependency backport block')

          s = one(
              s,
              "test \"$(git -C /tmp/n8n-src diff --name-only)\" = 'docker/images/n8n/Dockerfile'",
              "test \"$(git -C /tmp/n8n-src diff --name-only)\" = $'docker/images/n8n/Dockerfile\\npnpm-lock.yaml\\npnpm-workspace.yaml'",
              'allowed stable source diff')
          s = one(
              s,
              '          MASTER_BUILD_COMMIT=$UPSTREAM_MASTER_COMMIT\n',
              '          MASTER_BUILD_COMMIT=$UPSTREAM_MASTER_COMMIT\n          DEPENDENCY_SECURITY_EVIDENCE_COMMIT=$UPSTREAM_DEP_EVIDENCE_COMMIT\n',
              'source identities evidence')

          base_anchor = "              hard=hard.replace(line,'')\n          solver=src\n"
          base_replacement = r'''              hard=hard.replace(line,'')
          pin_marker='    # Cleanup\n'
          pin_block=(
              "    apk add --no-cache --upgrade \\\n"
              "        'libcrypto3=3.5.8-r0' \\\n"
              "        'libssl3=3.5.8-r0' \\\n"
              "        'libexpat=2.8.4-r0' && \\\n"
          )
          if hard.count(pin_marker)!=1: raise SystemExit('exact runtime pin insertion marker missing')
          hard=hard.replace(pin_marker,pin_block+pin_marker,1)
          solver=src
'''
          s = one(s, base_anchor, base_replacement, 'hardened base pin insertion')
          s = one(
              s,
              "                     'evidence_only_delta':'defer final apk del apk-tools until solver proof'},",
              "                     'runtime_security_delta':{'libcrypto3':'3.5.8-r0','libssl3':'3.5.8-r0','libexpat':'2.8.4-r0'},\n                     'evidence_only_delta':'defer final apk del apk-tools until solver proof'},",
              'base construction evidence')

          solver_old = r'''              { echo "COMMAND=apk del openssh graphicsmagick"; apk del openssh graphicsmagick; } > /evidence/solver-transaction.log 2>&1
              cat /etc/apk/world > /evidence/solver-post-world.txt
              cat /lib/apk/db/installed > /evidence/solver-post-installed.raw
'''
          solver_new = r'''              apk policy libcrypto3 libssl3 libexpat > /evidence/runtime-pin-policy.txt
              { echo "COMMAND=apk del openssh graphicsmagick"; apk del openssh graphicsmagick; \
                echo "COMMAND=apk add --no-cache --upgrade libcrypto3=3.5.8-r0 libssl3=3.5.8-r0 libexpat=2.8.4-r0"; \
                apk add --no-cache --upgrade 'libcrypto3=3.5.8-r0' 'libssl3=3.5.8-r0' 'libexpat=2.8.4-r0'; \
              } > /evidence/solver-transaction.log 2>&1
              cat /etc/apk/world > /evidence/solver-post-world.txt
              cat /lib/apk/db/installed > /evidence/solver-post-installed.raw
'''
          s = one(s, solver_old, solver_new, 'solver transaction')
          s = one(
              s,
              "          grep -F 'COMMAND=apk del apk-tools' \"$OUT/solver-transaction.log\"\n",
              "          grep -F 'COMMAND=apk del apk-tools' \"$OUT/solver-transaction.log\"\n          grep -F 'COMMAND=apk add --no-cache --upgrade libcrypto3=3.5.8-r0 libssl3=3.5.8-r0 libexpat=2.8.4-r0' \"$OUT/solver-transaction.log\"\n          grep -F 'libcrypto3' \"$OUT/runtime-pin-policy.txt\"\n          grep -F 'libssl3' \"$OUT/runtime-pin-policy.txt\"\n          grep -F 'libexpat' \"$OUT/runtime-pin-policy.txt\"\n",
              'solver pin evidence checks')

          solver_step = s.index('      - name: Prove package closure with APK solver authority')
          verifier_start = s.index("          python - <<'PY'\n          import json, os\n          out=os.environ['OUT']\n          def read(path):", solver_step)
          verifier_end = s.index('          test "$(docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE"', verifier_start)
          verifier = r'''          python - <<'PY'
          import json, os
          out=os.environ['OUT']
          def read(path):
              result={}
              for line in open(path,encoding='utf-8'):
                  line=line.rstrip('\n')
                  if not line: continue
                  p,v=line.split('\t',1); result[p]=v
              return result
          ref=read(out+'/reference-packages.tsv'); hard=read(out+'/hardened-packages.tsv')
          pre=read(out+'/solver-pre-packages.tsv'); post=read(out+'/solver-post-packages.tsv'); final=read(out+'/solver-final-packages.tsv')
          apk_version=pre.get('apk-tools')
          if not apk_version: raise SystemExit('solver pre-state missing apk-tools')
          pre_wo=dict(pre); pre_wo.pop('apk-tools')
          if pre_wo != ref: raise SystemExit('solver pre-state excluding apk-tools is not exact reference inventory')
          post_wo=dict(post); post_wo.pop('apk-tools',None)
          if post_wo != hard: raise SystemExit('solver post-state excluding apk-tools != hardened final inventory')
          if final != hard: raise SystemExit('solver final inventory != hardened final inventory')
          expected_pins={'libcrypto3':'3.5.8-r0','libssl3':'3.5.8-r0','libexpat':'2.8.4-r0'}
          changed={p:(ref[p],hard[p]) for p in sorted(set(ref)&set(hard)) if ref[p]!=hard[p]}
          if set(changed)!=set(expected_pins): raise SystemExit(f'unexpected package version delta: {changed}')
          for p,v in expected_pins.items():
              if hard.get(p)!=v: raise SystemExit(f'exact runtime pin missing: {p}={hard.get(p)} expected {v}')
          added=sorted(set(hard)-set(ref))
          allowed_world_pin_names=set(expected_pins)
          if added: raise SystemExit(f'unexpected added installed packages: {added}')
          removed=sorted(set(ref)-set(hard))
          if not {'openssh','graphicsmagick'} <= set(removed): raise SystemExit(f'authorized removal roots missing: {removed}')
          for forbidden in ('apk-tools','openssh','graphicsmagick'):
              if forbidden in hard: raise SystemExit(f'forbidden package remains: {forbidden}')
          required={'tini','tzdata','ca-certificates','librdkafka','libssl3','libcrypto3','libexpat','gcompat'}
          missing=sorted(required-set(hard))
          if missing: raise SystemExit(f'required retained packages missing: {missing}')
          if hard.get('gcompat')!='1.1.0-r4': raise SystemExit(f'unexpected libc6 provider: {hard.get("gcompat")}')
          world={x.strip() for x in open(out+'/hardened-world.txt') if x.strip()}
          if 'libc6-compat' not in world: raise SystemExit('APK world lost libc6-compat capability requirement')
          raw=open(out+'/hardened-installed.raw').read(); gcompat=None
          for rec in raw.strip().split('\n\n'):
              lines=rec.splitlines()
              if 'P:gcompat' in lines: gcompat=lines; break
          if not gcompat: raise SystemExit('gcompat installed record missing')
          provides=' '.join(x[2:] for x in gcompat if x.startswith('p:'))
          replaces=' '.join(x[2:] for x in gcompat if x.startswith('r:'))
          if 'libc6-compat=1.1.0-r4' not in provides or 'libc6-compat' not in replaces:
              raise SystemExit(f'gcompat does not prove libc6-compat relation: provides={provides} replaces={replaces}')
          ref_world={x.strip() for x in open(out+'/reference-world.txt') if x.strip()}
          added_world=sorted(world-ref_world); removed_world=sorted(ref_world-world)
          allowed_added={'libcrypto3=3.5.8-r0','libssl3=3.5.8-r0','libexpat=2.8.4-r0'}
          if set(added_world)-allowed_added: raise SystemExit(f'unexpected top-level world additions: {added_world}')
          if not {'openssh','graphicsmagick'} <= set(removed_world): raise SystemExit(f'world removal roots missing: {removed_world}')
          summary={
              'REFERENCE_BASE_BUILD':'PASS','HARDENED_BASE_BUILD':'PASS','SOLVER_EVIDENCE_BASE_BUILD':'PASS',
              'APK_SOLVER_TRANSACTION':'PASS','APK_SOLVER_FINAL_INVENTORY_EQUALS_HARDENED':'PASS',
              'APK_RUNTIME_PIN_DELTA':'PASS','LIBC6_COMPAT_CAPABILITY':'SATISFIED_BY_GCOMPAT_1.1.0-r4',
              'reference_count':len(ref),'hardened_count':len(hard),'solver_pre_count':len(pre),'solver_post_count':len(post),'solver_final_count':len(final),
              'removed_package_names':removed,'changed_versions':changed,'world_added':added_world,'world_removed':removed_world,
              'required_retained_versions':{p:hard[p] for p in sorted(required)},
          }
          json.dump(summary,open(out+'/apk-solver-proof.json','w'),indent=2,sort_keys=True)
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
'''
          s = s[:verifier_start] + verifier + s[verifier_end:]

          build_anchor = "          grep -R '\"version\": \"5.0.9\"' compiled/node_modules/.pnpm/brace-expansion@5.0.9*/node_modules/brace-expansion/package.json\n"
          build_extra = build_anchor + r'''          grep -R '"version": "3.1.6"' compiled/node_modules/.pnpm/fast-uri@3.1.6*/node_modules/fast-uri/package.json
          ! find compiled/node_modules/.pnpm -maxdepth 1 -type d -name 'fast-uri@3.1.5*' -print -quit | grep -q .
          ! find compiled/node_modules/.pnpm -maxdepth 1 -type d -name 'ip-address@10.2.0*' -print -quit | grep -q .
          ! find compiled/node_modules/.pnpm -maxdepth 1 -type d -name 'brace-expansion@5.0.8*' -print -quit | grep -q .
'''
          s = one(s, build_anchor, build_extra, 'compiled dependency proof')

          sec_anchor = "          ip=[r for r in high if r.get('package_name')=='ip-address']; brace=[r for r in high if r.get('package_name')=='brace-expansion']\n"
          s = one(s, sec_anchor, sec_anchor + "          fast_uri=[r for r in high if r.get('package_name')=='fast-uri']\n", 'fast-uri security family')
          s = one(
              s,
              "              'BRACE_EXPANSION_HIGH_BLOCKING':len(brace),'NEW_HIGH_INTRODUCED':len(new_high),",
              "              'BRACE_EXPANSION_HIGH_BLOCKING':len(brace),'FAST_URI_HIGH_BLOCKING':len(fast_uri),'NEW_HIGH_INTRODUCED':len(new_high),",
              'fast-uri security summary')
          s = one(
              s,
              "summary['OS_HIGH_BLOCKING']==0 and summary['IP_ADDRESS_HIGH_BLOCKING']==0 and summary['BRACE_EXPANSION_HIGH_BLOCKING']==0 and\n              summary['NEW_HIGH_INTRODUCED']==0",
              "summary['OS_HIGH_BLOCKING']==0 and summary['IP_ADDRESS_HIGH_BLOCKING']==0 and summary['BRACE_EXPANSION_HIGH_BLOCKING']==0 and summary['FAST_URI_HIGH_BLOCKING']==0 and\n              summary['NEW_HIGH_INTRODUCED']==0",
              'fast-uri preliminary gate')

          s = s.replace("if: steps.security.outputs.prelim == 'pass'", "if: steps.solver.outputs.pass == 'pass'")
          reach_step = s.index('      - name: Prove nodemailer reachability containment and runtime surface')
          reach_set = s.index('          set -euo pipefail\n', reach_step) + len('          set -euo pipefail\n')
          reach_assert = r'''          python - <<'PYELIG'
          import json,os
          q=json.load(open(os.environ['OUT']+'/hardened-security-summary.json'))
          zero=['BLOCKING_CRITICAL','CISA_KEV','OS_HIGH_BLOCKING','IP_ADDRESS_HIGH_BLOCKING','BRACE_EXPANSION_HIGH_BLOCKING','FAST_URI_HIGH_BLOCKING','NEW_HIGH_INTRODUCED','OTHER_HIGH']
          bad={k:q.get(k) for k in zero if q.get(k)!=0}
          if bad: raise SystemExit(f'nodemailer exception ineligible; blockers remain: {bad}')
          if q.get('NODEMAILER_EXCEPTION_CANDIDATES') not in (0,1): raise SystemExit('nodemailer exception candidate count invalid')
          print('NODEMAILER_EXCEPTION_ELIGIBILITY=PASS')
          PYELIG
'''
          s = s[:reach_set] + reach_assert + s[reach_set:]

          final_start = s.index('      - name: Final probe decision')
          final_run = s.index('        run: |\n', final_start) + len('        run: |\n')
          final_end = s.index('\n      - name: Upload APK solver hardened probe evidence', final_run)
          final_body = r'''          set -euo pipefail
          solver='${{ steps.solver.outputs.pass }}'
          echo "SOLVER=$solver"
          test "$solver" = pass || { echo 'APK_SOLVER_PROOF=FAIL_OR_NOT_REACHED' | tee "$OUT/final-gate.txt"; exit 1; }
          python - <<'PYFINAL'
          import json,os
          q=json.load(open(os.environ['OUT']+'/hardened-security-summary.json'))
          zero=['BLOCKING_CRITICAL','CISA_KEV','OS_HIGH_BLOCKING','IP_ADDRESS_HIGH_BLOCKING','BRACE_EXPANSION_HIGH_BLOCKING','FAST_URI_HIGH_BLOCKING','NEW_HIGH_INTRODUCED','OTHER_HIGH']
          bad={k:q.get(k) for k in zero if q.get(k)!=0}
          if bad or q.get('NODEMAILER_EXCEPTION_CANDIDATES') not in (0,1):
              raise SystemExit(f'HARDENED_SECURITY_GATE=FAIL {bad} nodemailer={q.get("NODEMAILER_EXCEPTION_CANDIDATES")}')
          print('HARDENED_SECURITY_GATE=PASS')
          PYFINAL
          test -f "$OUT/nodemailer-reachability.txt" && grep -F 'NODEMAILER_REACHABILITY_CONTROLS=PASS' "$OUT/nodemailer-reachability.txt"
          test -f "$OUT/static-tests.txt"
          test -f "$OUT/order-paid-runtime-smoke.txt"
          test -f "$OUT/recovery-schedule-runtime-smoke.txt"
          test -f "$OUT/recovery-replay-runtime-smoke.txt"
          echo 'APK_SOLVER_HARDENED_SECURITY_RUNTIME_WORKFLOW_GATE=PASS' | tee "$OUT/final-gate.txt"
'''
          s = s[:final_run] + final_body + s[final_end:]

          # Require current master commit binding, while deriving base/workflow blobs from that exact immutable commit.
          s = s.replace("          test \"$(git -C /tmp/n8n-src rev-parse \"$UPSTREAM_MASTER_COMMIT:docker/images/n8n-base/Dockerfile\")\" = \"$MASTER_BASE_DOCKERFILE_BLOB\"\n", "          actual_base_blob=\"$(git -C /tmp/n8n-src rev-parse \"$UPSTREAM_MASTER_COMMIT:docker/images/n8n-base/Dockerfile\")\"\n          printf 'ACTUAL_MASTER_BASE_DOCKERFILE_BLOB=%s\\n' \"$actual_base_blob\" >> \"$GITHUB_WORKSPACE/$OUT/upstream-derived-blobs.txt\"\n")
          s = s.replace("          test \"$(git -C /tmp/n8n-src rev-parse \"$UPSTREAM_MASTER_COMMIT:.github/workflows/build-base-image.yml\")\" = \"$MASTER_BASE_WORKFLOW_BLOB\"\n", "          actual_base_workflow_blob=\"$(git -C /tmp/n8n-src rev-parse \"$UPSTREAM_MASTER_COMMIT:.github/workflows/build-base-image.yml\")\"\n          printf 'ACTUAL_MASTER_BASE_WORKFLOW_BLOB=%s\\n' \"$actual_base_workflow_blob\" >> \"$GITHUB_WORKSPACE/$OUT/upstream-derived-blobs.txt\"\n")

          if '2.37.7' in s:
              raise SystemExit('superseded n8n 2.37.7 literal remains in generated probe')
          if "fast-uri: 3.1.6" not in s or 'FAST_URI_HIGH_BLOCKING' not in s:
              raise SystemExit('2.37.9 dependency security controls missing')

          ci = Path('.github/workflows/faz7-container-ci.yml').read_text()
          old='python -m pytest -q -p no:cacheprovider'
          new="python -m pytest -o addopts='' -q -p no:cacheprovider"
          if ci.count(old) < 3:
              raise SystemExit(f'expected current regression quiet-mode anchors, got {ci.count(old)}')
          ci=ci.replace(old,new)
          pdf_old='sitescore-api:test python -m pytest -q /testsrc/sitescore-report/tests/test_visual_report_rendering.py'
          pdf_new="sitescore-api:test python -m pytest -o addopts='' -q /testsrc/sitescore-report/tests/test_visual_report_rendering.py"
          if ci.count(pdf_old)!=1: raise SystemExit('PDF quiet-mode anchor missing')
          ci=ci.replace(pdf_old,pdf_new,1)

          def emit(name,data):
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',data=payload,method='POST',
                  headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'sitescore-faz7-2379-constructor'})
              with urllib.request.urlopen(req,timeout=30) as r: result=json.load(r)
              print(f'{name}_BLOB_SHA='+result['sha'])
              print(f'{name}_SHA256='+hashlib.sha256(data).hexdigest())

          emit('N8N_PROBE',s.encode())
          emit('PERMANENT_CI',ci.encode())
          PY
