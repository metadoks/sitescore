name: faz7-7-1-n8n-latest-official-probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OUT: deploy/containers/artifacts/n8n-latest-official-probe
    steps:
      - name: Checkout SiteScore exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Free runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Enumerate exact latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python - <<'PY'
          import json,os,re,urllib.request
          from urllib.parse import urlencode
          headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-official-probe'}
          rels=[]
          for page in range(1,11):
              req=urllib.request.Request('https://api.github.com/repos/n8n-io/n8n/releases?'+urlencode({'per_page':100,'page':page}),headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: batch=json.load(r)
              if not batch: break
              for rel in batch:
                  if rel.get('draft') or rel.get('prerelease'): continue
                  m=re.fullmatch(r'n8n@(\d+)\.(\d+)\.(\d+)',str(rel.get('tag_name','')))
                  if m and int(m.group(1))==2: rels.append((tuple(map(int,m.groups())),rel))
              if len(batch)<100: break
          vt,rel=max(rels,key=lambda x:x[0]); version='.'.join(map(str,vt))
          if version != '2.37.9': raise SystemExit(f'latest stable changed again: {version}')
          ctx={'selected_version':version,'release_id':rel['id'],'release_tag':rel['tag_name'],'published_at':rel.get('published_at')}
          json.dump(ctx,open(os.environ['OUT']+'/source-context.json','w'),indent=2,sort_keys=True)
          print(json.dumps(ctx,indent=2,sort_keys=True))
          PY
          test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = '02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1'
          test "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" = 'f5409839cec1fa86b6af20f6cd242e71d52dceec8dcdb6cf35fd0b237e4a489c'

      - name: Pull official linux amd64 image and bind immutable digest
        run: |
          set -euo pipefail
          version="$(python -c 'import json,os; print(json.load(open(os.environ["OUT"]+"/source-context.json"))["selected_version"])')"
          image="n8nio/n8n:${version}"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
          runtime_version="$(docker run --rm "$image" n8n --version | tr -d '\r' | tail -n1)"
          test "$runtime_version" = "$version"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          case "$digest" in n8nio/n8n@sha256:*) ;; *) echo "unexpected RepoDigest: $digest" >&2; exit 1;; esac
          printf '%s\n' "$digest" > "$OUT/official-image-digest.txt"
          printf 'ARCH=amd64\nVERSION=%s\nDIGEST=%s\n' "$runtime_version" "$digest" > "$OUT/runtime-identity.txt"
          docker image inspect "$image" > "$OUT/official-image-inspect.json"

      - name: Prove official image loadability and frozen workflow imports
        run: |
          set -euo pipefail
          version="$(python -c 'import json,os; print(json.load(open(os.environ["OUT"]+"/source-context.json"))["selected_version"])')"
          image="n8nio/n8n:${version}"
          cid="$(docker run -d --rm --tmpfs /tmp:rw,nosuid,nodev -e N8N_USER_FOLDER=/tmp/n8n -e N8N_ENCRYPTION_KEY=ci-only-official-probe-encryption-key-000000000000 -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false -p 127.0.0.1:15677:5678 "$image")"
          trap 'docker logs "$cid" > "$OUT/startup-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 120); do curl -fsS http://127.0.0.1:15677/healthz >/dev/null 2>&1 && break; sleep .5; done
          curl -fsS http://127.0.0.1:15677/healthz >/dev/null
          docker logs "$cid" > "$OUT/startup-runtime.log" 2>&1 || true
          docker stop -t 5 "$cid" >/dev/null; trap - EXIT
          vol="sitescore-official-import-${GITHUB_RUN_ID}"; docker volume create "$vol" >/dev/null
          trap 'docker volume rm -f "$vol" >/dev/null 2>&1 || true' EXIT
          for wf in sitescore-order-paid-v1.json sitescore-recovery-schedule-v1.json; do
            docker run --rm -e N8N_ENCRYPTION_KEY=ci-only-official-probe-encryption-key-000000000000 -e N8N_DIAGNOSTICS_ENABLED=false -v "$vol:/home/node/.n8n" -v "$GITHUB_WORKSPACE/automation/n8n/workflows:/workflows:ro" "$image" import:workflow --input="/workflows/$wf"
          done
          docker volume rm -f "$vol" >/dev/null; trap - EXIT

      - name: Generate SPDX and raw Grype evidence
        run: |
          set -euo pipefail
          version="$(python -c 'import json,os; print(json.load(open(os.environ["OUT"]+"/source-context.json"))["selected_version"])')"
          image="n8nio/n8n:${version}"
          syft="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          grype="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$syft" "$image" -o spdx-json > "$OUT/n8n.spdx.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype" "$image" -o json > "$OUT/n8n.grype.json"

      - name: Verify exact release OpenVEX and CISA KEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o "$OUT/cisa-kev.json"
          python - <<'PY'
          import hashlib,json,os,urllib.request
          out=os.environ['OUT']; ctx=json.load(open(out+'/source-context.json')); token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/n8n-io/n8n/releases/{ctx["release_id"]}/assets',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-official-probe'})
          with urllib.request.urlopen(req,timeout=30) as r: assets=json.load(r)
          asset=next((a for a in assets if a.get('name')=='vex.openvex.json'),None)
          if not asset: raise SystemExit('exact stable OpenVEX asset missing')
          urllib.request.urlretrieve(asset['browser_download_url'],out+'/upstream.openvex.json')
          computed='sha256:'+hashlib.sha256(open(out+'/upstream.openvex.json','rb').read()).hexdigest(); recorded=asset.get('digest')
          verified=bool(recorded and recorded==computed)
          json.dump(asset,open(out+'/openvex-asset-metadata.json','w'),indent=2,sort_keys=True)
          json.dump({'metadata_digest':recorded,'computed_digest':computed,'verified':verified},open(out+'/openvex-asset-verification.json','w'),indent=2,sort_keys=True)
          if not verified: raise SystemExit('OpenVEX digest verification failed')
          ctx['selected_digest']=open(out+'/official-image-digest.txt').read().strip()
          json.dump(ctx,open(out+'/release-context.json','w'),indent=2,sort_keys=True)
          PY
          git show d008f7b9689a936afd09ac55397c82647477b644:deploy/containers/n8n_openvex_reconcile.py > /tmp/n8n_openvex_reconcile.py
          python /tmp/n8n_openvex_reconcile.py "$OUT"

      - name: Evaluate official latest security gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          out=os.environ['OUT']; rows=json.load(open(out+'/n8n.vendor-openvex-reconciliation.json'))
          critical=[r for r in rows if r['severity']=='CRITICAL' and r.get('final_disposition')!='VEX_NOT_AFFECTED_ALLOWED']
          high=[r for r in rows if r['severity']=='HIGH' and r.get('final_disposition')!='VEX_NOT_AFFECTED_ALLOWED']
          kev=[r for r in rows if r.get('CISA_KEV_alias_matches')]
          summary={'RAW_CRITICAL':sum(1 for r in rows if r['severity']=='CRITICAL'),'RAW_HIGH':sum(1 for r in rows if r['severity']=='HIGH'),'BLOCKING_CRITICAL':len(critical),'BLOCKING_HIGH':len(high),'CISA_KEV':len(kev),'OFFICIAL_LATEST_SECURITY_PASS':not critical and not high and not kev}
          bypkg={}
          for r in critical+high: bypkg[r.get('package_name')]=bypkg.get(r.get('package_name'),0)+1
          summary['BLOCKING_BY_PACKAGE']=dict(sorted(bypkg.items()))
          json.dump(summary,open(out+'/official-security-summary.json','w'),indent=2,sort_keys=True)
          print(json.dumps(summary,indent=2,sort_keys=True))
          if summary['OFFICIAL_LATEST_SECURITY_PASS']:
              open(out+'/official-security-gate.txt','w').write('OFFICIAL_LATEST_SECURITY_GATE=PASS\n')
          else:
              open(out+'/official-security-gate.txt','w').write('OFFICIAL_LATEST_SECURITY_GATE=FAIL\n')
              raise SystemExit('official latest stable fails security gate')
          PY

      - name: Upload official latest probe evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.2
        with:
          name: faz7-n8n-latest-official-${{ github.sha }}
          path: deploy/containers/artifacts/n8n-latest-official-probe/
          if-no-files-found: error
          retention-days: 14
