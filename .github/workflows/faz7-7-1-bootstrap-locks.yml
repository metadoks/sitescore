name: faz7-7-1-bootstrap-locks

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-locks:
    runs-on: ubuntu-24.04
    env:
      TARGET_BRANCH: faz7/7-1-reproducible-containers-supply-chain-governance
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHON_IMAGE_TAG: python:3.11.16-slim-bookworm
      DEBIAN_SNAPSHOT: '20260821T000000Z'
      SYFT_TAG: anchore/syft:v1.44.0
      GRYPE_TAG: anchore/grype:v0.116.1
      COSIGN_TAG: sigstore/cosign:v3.1.2
      N8N_IMAGE: n8nio/n8n@sha256:f9a15cc65378e4e5b6c3b1445c83985131938db8d8b5b1ab891d7d50196b2162
    steps:
      - name: Checkout exact source head without third-party action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          git switch -C "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Resolve immutable container tool identities
        run: |
          set -euo pipefail
          mkdir -p deploy/containers /tmp/faz7-digests
          resolve_digest() {
            local image key output digest
            image="$1"
            key="$2"
            output="/tmp/faz7-digests/${key}.txt"
            docker buildx imagetools inspect "$image" > "$output"
            digest="$(awk '/^Digest:/ {print $2; found=1} found {exit}' "$output")"
            test -n "$digest"
            printf '%s' "$digest"
          }
          python_digest="$(resolve_digest "${PYTHON_IMAGE_TAG}" python)"
          syft_digest="$(resolve_digest "${SYFT_TAG}" syft)"
          grype_digest="$(resolve_digest "${GRYPE_TAG}" grype)"
          cosign_digest="$(resolve_digest "${COSIGN_TAG}" cosign)"
          for d in "$python_digest" "$syft_digest" "$grype_digest" "$cosign_digest"; do
            case "$d" in sha256:*) ;; *) echo "invalid digest: $d" >&2; exit 1;; esac
          done
          cat > deploy/containers/base-image.lock <<EOF
          # FAZ 7.1 immutable base-image authority
          PYTHON_IMAGE_TAG=${PYTHON_IMAGE_TAG}
          PYTHON_IMAGE_DIGEST=${python_digest}
          PYTHON_IMAGE=${PYTHON_IMAGE_TAG}@${python_digest}
          TARGET_PLATFORM=linux/amd64
          DEBIAN_SNAPSHOT=${DEBIAN_SNAPSHOT}
          EOF
          cat > deploy/containers/supply-chain-tools.lock <<EOF
          SYFT_TAG=${SYFT_TAG}
          SYFT_DIGEST=${syft_digest}
          SYFT_IMAGE=${SYFT_TAG}@${syft_digest}
          GRYPE_TAG=${GRYPE_TAG}
          GRYPE_DIGEST=${grype_digest}
          GRYPE_IMAGE=${GRYPE_TAG}@${grype_digest}
          COSIGN_TAG=${COSIGN_TAG}
          COSIGN_DIGEST=${cosign_digest}
          COSIGN_IMAGE=${COSIGN_TAG}@${cosign_digest}
          SBOM_FORMAT=spdx-json
          PROVENANCE_MODE=cosign-keyless-github-oidc
          EOF
          cat deploy/containers/base-image.lock
          cat deploy/containers/supply-chain-tools.lock

      - name: Generate direct runtime and test inputs from frozen pyprojects
        run: |
          set -euo pipefail
          cat > /tmp/generate_inputs.py <<'PY'
          from __future__ import annotations
          import pathlib, re, tomllib
          projects = {}
          for path in sorted(pathlib.Path('.').glob('sitescore-*/pyproject.toml')):
              project = tomllib.loads(path.read_text()).get('project', {})
              if project.get('name'):
                  projects[project['name'].lower().replace('_','-')] = project
          def dep_name(spec):
              m=re.match(r'([A-Za-z0-9_.-]+)', spec.split(';',1)[0].strip())
              if not m: raise ValueError(spec)
              return m.group(1).lower().replace('_','-')
          def closure(start):
              seen=set(); external={}
              def visit(name):
                  key=name.lower().replace('_','-')
                  if key in seen: return
                  seen.add(key)
                  for spec in projects[key].get('dependencies',[]):
                      child=dep_name(spec)
                      if child in projects: visit(child)
                      else:
                          prior=external.get(child)
                          if prior is not None and prior != spec: raise RuntimeError((child, prior, spec))
                          external[child]=spec
              visit(start)
              return [external[k] for k in sorted(external)]
          pathlib.Path('.faz7-api.in').write_text('\n'.join(closure('sitescore-api')+['uvicorn==0.52.1'])+'\n')
          pathlib.Path('.faz7-commerce.in').write_text('\n'.join(closure('sitescore-commerce')+['uvicorn==0.52.1'])+'\n')
          pathlib.Path('.faz7-build-tools.in').write_text('setuptools==80.9.0\nwheel==0.45.1\n')
          pathlib.Path('.faz7-test-tools.in').write_text('pytest==8.4.2\npypdf==6.14.2\n')
          PY
          python /tmp/generate_inputs.py

      - name: Generate hashed Python locks under exact CPython tag
        run: |
          set -euo pipefail
          mkdir -p deploy/containers/api deploy/containers/commerce
          docker run --rm -v "$PWD:/repo" -w /repo "${PYTHON_IMAGE_TAG}" sh -euxc '
            python -m pip install --disable-pip-version-check pip-tools==7.6.0
            pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file deploy/containers/api/requirements.lock .faz7-api.in
            pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file deploy/containers/commerce/requirements.lock .faz7-commerce.in
            pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file deploy/containers/build-tools.lock .faz7-build-tools.in
            pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file deploy/containers/test-tools.lock .faz7-test-tools.in
          '
          rm -f .faz7-api.in .faz7-commerce.in .faz7-build-tools.in .faz7-test-tools.in
          for f in deploy/containers/api/requirements.lock deploy/containers/commerce/requirements.lock deploy/containers/build-tools.lock deploy/containers/test-tools.lock; do
            grep -q -- '--hash=sha256:' "$f"
          done

      - name: Resolve API native package versions from fixed Debian snapshot
        run: |
          set -euo pipefail
          image="$(awk -F= '$1=="PYTHON_IMAGE" {print $2}' deploy/containers/base-image.lock)"
          docker run --rm -e SNAPSHOT="${DEBIAN_SNAPSHOT}" "$image" sh -c '
            set -eu
            rm -f /etc/apt/sources.list.d/debian.sources
            cat > /etc/apt/sources.list <<EOF
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/${SNAPSHOT}/ bookworm main
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/${SNAPSHOT}/ bookworm-security main
          EOF
            apt-get -o Acquire::Check-Valid-Until=false update >/dev/null 2>&1
            for p in fontconfig fonts-dejavu-core libffi8 libjpeg62-turbo libopenjp2-7 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 shared-mime-info; do
              v="$(apt-cache policy "$p" | awk "/Candidate:/ {print \$2}")"
              test -n "$v" && test "$v" != "(none)"
              printf "%s=%s\n" "$p" "$v"
            done
          ' > deploy/containers/api/apt-runtime.lock
          test "$(grep -c '^[a-z0-9]' deploy/containers/api/apt-runtime.lock)" -eq 9
          cat deploy/containers/api/apt-runtime.lock

      - name: Commit generated immutable lock inputs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          git config user.name 'sitescore-ci'
          git config user.email 'sitescore-ci@users.noreply.github.com'
          git add deploy/containers/base-image.lock deploy/containers/supply-chain-tools.lock deploy/containers/build-tools.lock deploy/containers/test-tools.lock deploy/containers/api/requirements.lock deploy/containers/api/apt-runtime.lock deploy/containers/commerce/requirements.lock
          if ! git diff --cached --quiet; then
            git commit -m 'FAZ 7.1 resolve immutable supply-chain inputs'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Probe frozen n8n platform user SBOM and vulnerability policy
        run: |
          set -euo pipefail
          syft_image="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          grype_image="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          docker pull --platform linux/amd64 "${N8N_IMAGE}"
          arch="$(docker image inspect "${N8N_IMAGE}" --format '{{.Architecture}}')"
          user="$(docker image inspect "${N8N_IMAGE}" --format '{{.Config.User}}')"
          echo "N8N_ARCH=${arch}"
          echo "N8N_USER=${user}"
          test "$arch" = amd64
          test -n "$user" && test "$user" != 0 && test "$user" != root
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$syft_image" "${N8N_IMAGE}" -o spdx-json > /tmp/n8n.spdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype_image" "${N8N_IMAGE}" -o json > /tmp/n8n.grype.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/n8n.grype.json'))
          blockers=[]
          for match in data.get('matches',[]):
              v=match.get('vulnerability',{}); sev=str(v.get('severity','')).upper(); fix=v.get('fix') or {}; versions=fix.get('versions') or []
              if sev=='CRITICAL' or (sev=='HIGH' and versions):
                  a=match.get('artifact',{}); blockers.append((v.get('id'),sev,a.get('name'),a.get('version'),versions))
          print(f'N8N_POLICY_BLOCKERS={len(blockers)}')
          for b in blockers[:100]: print('N8N_BLOCKER',b)
          if blockers: raise SystemExit(42)
          PY
