name: faz7-7-1-n8n-patched-final-probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UPSTREAM_STABLE_VERSION: '2.37.7'
      UPSTREAM_STABLE_COMMIT: '2a4ca7868dc75edca4c575d6507021e1e6b0ec90'
      UPSTREAM_STABLE_TREE: '40ff00093dbc474f82b4a133eb8ca51a3c76734a'
      OFFICIAL_IMAGE: 'n8nio/n8n@sha256:869500232f49760d6a422d320d3ead3cb28ee93a00e6f67c89eb3d6b81acd6be'
      UPSTREAM_MASTER_COMMIT: 'efd3ec9e260ef9ac7d9cbc134952590bedd33acb'
      MASTER_DOCKERFILE_BLOB: 'f72e1a3f3aae40319e58989e5fc2a71e687a1b59'
      MASTER_BASE_DOCKERFILE_BLOB: '1f2a82aa961a389750d774c88735fb11c5ae7c45'
      MASTER_BASE_WORKFLOW_BLOB: 'dd9e3badecd4fc1c5e4a51668824f5f214becaae'
      DHI_REF: 'dhi.io/node:26.7.0-alpine3.24-dev@sha256:4b494d89fb26c950ce97865acf45b480dc7a6868fdc2b81c2d66599702eeac3f'
      BUILDER_IMAGE: 'node:26.7.0-alpine3.24@sha256:aadf416b2cdce311a8811ba3f0608a61b77dbf997500e2eafe781b51f6a0b019'
      HARDENED_BASE_IMAGE: 'sitescore-n8n-base-patched:26.7.0'
      PROBE_IMAGE: 'sitescore-n8n-patched:probe'
      OUT: 'deploy/containers/artifacts/n8n-patched-final-probe'

    steps:
      - name: Checkout SiteScore exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Free runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # pinned v2.0.2
        with:
          install: false
          version: 11.22.0

      - name: Setup Node 26.7.0
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '26.7.0'

      - name: Re-enumerate stable and bind frozen bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python - <<'PY'
          import json,os,re,urllib.request
          from urllib.parse import urlencode
          headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-patched'}
          rels=[]
          for page in range(1,11):
              req=urllib.request.Request('https://api.github.com/repos/n8n-io/n8n/releases?'+urlencode({'per_page':100,'page':page}),headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: batch=json.load(r)
              if not batch: break
              for rel in batch:
                  if rel.get('draft') or rel.get('prerelease'): continue
                  m=re.fullmatch(r'n8n@(\d+)\.(\d+)\.(\d+)',str(rel.get('tag_name','')))
                  if m and int(m.group(1))==2: rels.append((tuple(map(int,m.groups())),rel))
              if len(batch)<100: break
          version_tuple,rel=max(rels,key=lambda x:x[0]); version='.'.join(map(str,version_tuple))
          if version != os.environ['UPSTREAM_STABLE_VERSION']: raise SystemExit(f'new official stable {version}; official-first revalidation required')
          ctx={'selected_version':version,'release_id':rel['id'],'release_tag':rel['tag_name'],'published_at':rel.get('published_at'),'stable_source_commit':os.environ['UPSTREAM_STABLE_COMMIT'],'stable_source_tree':os.environ['UPSTREAM_STABLE_TREE'],'official_image':os.environ['OFFICIAL_IMAGE'],'master_build_commit':os.environ['UPSTREAM_MASTER_COMMIT'],'dhi_ref':os.environ['DHI_REF'],'builder_image':os.environ['BUILDER_IMAGE'],'runtime_base_characterization':'UPSTREAM_DERIVED_SITE_SCORE_HARDENED','runtime_security_delta':'EXACT_PINNED_3_PACKAGE_PATCH'}
          json.dump(ctx,open(os.environ['OUT']+'/source-context.json','w'),indent=2,sort_keys=True)
          print(json.dumps(ctx,indent=2,sort_keys=True))
          PY
          test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = '02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1'
          test "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" = 'f5409839cec1fa86b6af20f6cd242e71d52dceec8dcdb6cf35fd0b237e4a489c'

      - name: Bind exact upstream source and recipes
        run: |
          set -euo pipefail
          rm -rf /tmp/n8n-src
          git clone --filter=blob:none --no-checkout https://github.com/n8n-io/n8n.git /tmp/n8n-src
          git -C /tmp/n8n-src fetch --depth=1 origin "$UPSTREAM_STABLE_COMMIT" "$UPSTREAM_MASTER_COMMIT"
          git -C /tmp/n8n-src checkout --detach "$UPSTREAM_STABLE_COMMIT"
          test "$(git -C /tmp/n8n-src rev-parse HEAD)" = "$UPSTREAM_STABLE_COMMIT"
          test "$(git -C /tmp/n8n-src rev-parse HEAD^{tree})" = "$UPSTREAM_STABLE_TREE"
          test "$(git -C /tmp/n8n-src rev-parse "$UPSTREAM_MASTER_COMMIT:docker/images/n8n/Dockerfile")" = "$MASTER_DOCKERFILE_BLOB"
          test "$(git -C /tmp/n8n-src rev-parse "$UPSTREAM_MASTER_COMMIT:docker/images/n8n-base/Dockerfile")" = "$MASTER_BASE_DOCKERFILE_BLOB"
          test "$(git -C /tmp/n8n-src rev-parse "$UPSTREAM_MASTER_COMMIT:.github/workflows/build-base-image.yml")" = "$MASTER_BASE_WORKFLOW_BLOB"
          git -C /tmp/n8n-src show "$UPSTREAM_MASTER_COMMIT:docker/images/n8n/Dockerfile" > /tmp/n8n-src/docker/images/n8n/Dockerfile
          git -C /tmp/n8n-src show "$UPSTREAM_MASTER_COMMIT:docker/images/n8n-base/Dockerfile" > "$OUT/upstream-base-Dockerfile"
          git -C /tmp/n8n-src show "$UPSTREAM_MASTER_COMMIT:.github/workflows/build-base-image.yml" > "$OUT/upstream-build-base-image.yml"
          grep -F "node_version: '26.7.0'" "$OUT/upstream-build-base-image.yml"
          grep -F "$DHI_REF" "$OUT/upstream-build-base-image.yml"
          grep -F 'ip-address@10: 10.3.1' /tmp/n8n-src/pnpm-workspace.yaml
          grep -F 'brace-expansion@5: 5.0.9' /tmp/n8n-src/pnpm-workspace.yaml

      - name: Build patched runtime base and capture exact APK delta
        id: base
        run: |
          set -euo pipefail
          cat > /tmp/Dockerfile.base.patched <<'EOF'
          ARG DHI_REF
          FROM ${DHI_REF} AS evidence
          RUN apk add --no-cache busybox-binsh && \
              apk --no-cache add --virtual .build-deps-fonts msttcorefonts-installer fontconfig && \
              update-ms-fonts && fc-cache -f && apk del .build-deps-fonts && \
              find /usr/share/fonts/truetype/msttcorefonts/ -type l -exec unlink {} \; && \
              apk add --no-cache tini tzdata ca-certificates libc6-compat librdkafka && \
              mkdir -p /security-evidence && \
              cp /etc/apk/repositories /security-evidence/repositories.before && \
              cp /etc/apk/world /security-evidence/world.before && \
              cp /lib/apk/db/installed /security-evidence/installed.before && \
              apk policy libcrypto3 libssl3 libexpat > /security-evidence/policy.before.txt && \
              (apk add --no-cache --upgrade 'libcrypto3=3.5.8-r0' 'libssl3=3.5.8-r0' 'libexpat=2.8.4-r0' 2>&1 | tee /security-evidence/transaction.log) && \
              cp /etc/apk/repositories /security-evidence/repositories.after && \
              cp /etc/apk/world /security-evidence/world.after && \
              cp /lib/apk/db/installed /security-evidence/installed.after && \
              apk policy libcrypto3 libssl3 libexpat > /security-evidence/policy.after.txt && \
              rm -rf /tmp/* /root/.npm /root/.cache/node /opt/yarn*
          FROM evidence AS final
          RUN apk del apk-tools && rm -rf /security-evidence
          RUN mkdir -p /usr/local/bin && ln -sf /usr/bin/node /usr/local/bin/node
          WORKDIR /home/node
          ENV NODE_PATH=/usr/local/lib/node_modules
          EXPOSE 5678/tcp
          EOF
          docker build --platform linux/amd64 --no-cache --target evidence --build-arg DHI_REF="$DHI_REF" -f /tmp/Dockerfile.base.patched -t sitescore-n8n-base-patched:evidence /tmp/n8n-src
          eid="$(docker create sitescore-n8n-base-patched:evidence)"; docker cp "$eid:/security-evidence/." "$OUT/"; docker rm "$eid" >/dev/null
          docker build --platform linux/amd64 --no-cache --target final --build-arg DHI_REF="$DHI_REF" -f /tmp/Dockerfile.base.patched -t "$HARDENED_BASE_IMAGE" /tmp/n8n-src
          docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'cat /etc/apk/world' > "$OUT/final-world.txt"
          docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'cat /lib/apk/db/installed' > "$OUT/final-installed.raw"
          test "$(docker image inspect "$HARDENED_BASE_IMAGE" --format '{{.Architecture}}')" = amd64
          test "$(docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'node --version')" = 'v26.7.0'
          ! docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'command -v apk >/dev/null'
          python - <<'PY'
          import json,os
          out=os.environ['OUT']
          def parse(path):
              raw=open(path).read(); rows={}
              for rec in raw.strip().split('\n\n'):
                  d={}
                  for line in rec.splitlines():
                      if len(line)>2 and line[1]==':': d.setdefault(line[0],[]).append(line[2:])
                  if d.get('P'): rows[d['P'][0]]=d
              return rows
          pre=parse(out+'/installed.before'); post=parse(out+'/installed.after'); final=parse(out+'/final-installed.raw')
          changes=[]
          for name in sorted(set(pre)|set(post)):
              a=pre.get(name,{}).get('V',[None])[0]; b=post.get(name,{}).get('V',[None])[0]
              if a!=b: changes.append({'package':name,'before':a,'after':b})
          expected=[{'package':'libcrypto3','before':'3.5.7-r1','after':'3.5.8-r0'},{'package':'libexpat','before':'2.8.3-r1','after':'2.8.4-r0'},{'package':'libssl3','before':'3.5.7-r1','after':'3.5.8-r0'}]
          if changes != expected: raise SystemExit(f'unexpected APK version delta: {changes}')
          if open(out+'/repositories.before').read()!=open(out+'/repositories.after').read(): raise SystemExit('repository config changed during pin transaction')
          before_world={x.strip() for x in open(out+'/world.before') if x.strip()}
          after_world={x.strip() for x in open(out+'/world.after') if x.strip()}
          removed=sorted(before_world-after_world); added=sorted(after_world-before_world)
          expected_removed=sorted({
              'libcrypto3><Q1U7lylpTkDql8zqLVx0CGjyz27ko=',
              'libexpat><Q1iKeTX2sGE4ri2YFOmGbYnPc0LfM=',
              'libssl3><Q1D+dDwotWSgFk8Db36y7gmNRZA/E=',
          })
          expected_added=sorted({'libcrypto3=3.5.8-r0','libexpat=2.8.4-r0','libssl3=3.5.8-r0'})
          if removed!=expected_removed or added!=expected_added:
              raise SystemExit(f'unexpected APK world delta: removed={removed} added={added}')
          for p,v in {'libcrypto3':'3.5.8-r0','libssl3':'3.5.8-r0','libexpat':'2.8.4-r0'}.items():
              if final.get(p,{}).get('V',[None])[0]!=v: raise SystemExit(f'final exact pin missing: {p}')
          for forbidden in ('apk-tools','openssh','graphicsmagick'):
              if forbidden in final: raise SystemExit(f'forbidden final package: {forbidden}')
          world={x.strip() for x in open(out+'/final-world.txt') if x.strip()}
          if 'libc6-compat' not in world: raise SystemExit('libc6-compat capability requirement missing')
          for pin in expected_added:
              if pin not in world: raise SystemExit(f'final apk world exact pin missing: {pin}')
          g=final.get('gcompat')
          if not g or g.get('V',[''])[0]!='1.1.0-r4' or 'libc6-compat=1.1.0-r4' not in ' '.join(g.get('p',[])): raise SystemExit('gcompat provider proof failed')
          for req in ('tini','tzdata','ca-certificates','librdkafka'):
              if req not in final: raise SystemExit(f'required runtime package missing: {req}')
          record={'intentional_version_changes':changes,'repositories_unchanged':True,'world_delta':{'removed':removed,'added':added},'world_delta_matches_exact_authorized_pins':True,'libc6_provider':'gcompat==1.1.0-r4','final_forbidden_absent':['apk-tools','openssh','graphicsmagick']}
          json.dump(record,open(out+'/package-delta.json','w'),indent=2,sort_keys=True)
          print(json.dumps(record,indent=2,sort_keys=True))
          PY
          echo 'pass=pass' >> "$GITHUB_OUTPUT"

      - name: Build exact stable production closure
        if: steps.base.outputs.pass == 'pass'
        working-directory: /tmp/n8n-src
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=7168'
          RELEASE: '2.37.7'
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v26.7.0'
          test "$(pnpm --version)" = '11.22.0'
          pnpm build:n8n
          test -d compiled
          grep -R '"version": "10.3.1"' compiled/node_modules/.pnpm/ip-address@10.3.1*/node_modules/ip-address/package.json
          grep -R '"version": "5.0.9"' compiled/node_modules/.pnpm/brace-expansion@5.0.9*/node_modules/brace-expansion/package.json
          grep -R '"version": "8.0.10"' compiled/node_modules/.pnpm/nodemailer@8.0.10*/node_modules/nodemailer/package.json

      - name: Build final patched n8n image
        if: steps.base.outputs.pass == 'pass'
        working-directory: /tmp/n8n-src
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg BUILDER_IMAGE="$BUILDER_IMAGE" --build-arg RUNTIME_IMAGE="$HARDENED_BASE_IMAGE" --build-arg N8N_VERSION="$UPSTREAM_STABLE_VERSION" --build-arg N8N_RELEASE_TYPE=stable -f docker/images/n8n/Dockerfile -t sitescore-n8n-patched-core:probe .
          cat > /tmp/Dockerfile.n8n-contract <<'EOF'
          FROM sitescore-n8n-patched-core:probe
          ENV NODES_EXCLUDE='["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.emailSend"]'
          EOF
          docker build --network=none --platform linux/amd64 -f /tmp/Dockerfile.n8n-contract -t "$PROBE_IMAGE" /tmp
          test "$(docker image inspect "$PROBE_IMAGE" --format '{{.Architecture}}')" = amd64
          docker image inspect "$PROBE_IMAGE" > "$GITHUB_WORKSPACE/$OUT/final-image-inspect.json"
          docker image inspect "$PROBE_IMAGE" --format '{{.Id}}' > "$GITHUB_WORKSPACE/$OUT/final-image-id.txt"

      - name: Prove non-root runtime and imports
        if: steps.base.outputs.pass == 'pass'
        run: |
          set -euo pipefail
          user="$(docker image inspect "$PROBE_IMAGE" --format '{{.Config.User}}')"; test -n "$user" && test "$user" != root && test "$user" != 0
          version="$(docker run --rm "$PROBE_IMAGE" n8n --version | tr -d '\r' | tail -n1)"; test "$version" = "$UPSTREAM_STABLE_VERSION"
          printf 'ARCH=amd64\nUSER=%s\nVERSION=%s\nIMAGE_ID=%s\n' "$user" "$version" "$(cat "$OUT/final-image-id.txt")" > "$OUT/runtime-identity.txt"
          cid="$(docker run -d --rm --tmpfs /tmp:rw,nosuid,nodev -e N8N_USER_FOLDER=/tmp/n8n -e N8N_ENCRYPTION_KEY=ci-only-patched-probe-encryption-key-000000000000 -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false -p 127.0.0.1:15678:5678 "$PROBE_IMAGE")"
          trap 'docker logs "$cid" > "$OUT/startup-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 120); do curl -fsS http://127.0.0.1:15678/healthz >/dev/null 2>&1 && break; sleep .5; done
          curl -fsS http://127.0.0.1:15678/healthz >/dev/null; docker logs "$cid" > "$OUT/startup-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null; trap - EXIT
          vol="sitescore-patched-import-${GITHUB_RUN_ID}"; docker volume create "$vol" >/dev/null
          trap 'docker volume rm -f "$vol" >/dev/null 2>&1 || true' EXIT
          for wf in sitescore-order-paid-v1.json sitescore-recovery-schedule-v1.json; do docker run --rm -e N8N_ENCRYPTION_KEY=ci-only-patched-probe-encryption-key-000000000000 -e N8N_DIAGNOSTICS_ENABLED=false -v "$vol:/home/node/.n8n" -v "$GITHUB_WORKSPACE/automation/n8n/workflows:/workflows:ro" "$PROBE_IMAGE" import:workflow --input="/workflows/$wf"; done
          docker volume rm -f "$vol" >/dev/null; trap - EXIT

      - name: Generate SPDX and Grype evidence
        if: steps.base.outputs.pass == 'pass'
        run: |
          set -euo pipefail
          syft="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          grype="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          docker pull --platform linux/amd64 "$OFFICIAL_IMAGE" >/dev/null
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$syft" "$PROBE_IMAGE" -o spdx-json > "$OUT/n8n.spdx.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype" "$PROBE_IMAGE" -o json > "$OUT/n8n.grype.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype" "$OFFICIAL_IMAGE" -o json > "$OUT/official-2.37.7.grype.json"

      - name: Reconcile OpenVEX and CISA KEV
        if: steps.base.outputs.pass == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o "$OUT/cisa-kev.json"
          python - <<'PY'
          import hashlib,json,os,urllib.request
          out=os.environ['OUT']; ctx=json.load(open(out+'/source-context.json')); token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/n8n-io/n8n/releases/{ctx["release_id"]}/assets',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-patched'})
          with urllib.request.urlopen(req,timeout=30) as r: assets=json.load(r)
          asset=next((a for a in assets if a.get('name')=='vex.openvex.json'),None)
          if not asset: raise SystemExit('exact stable OpenVEX asset missing')
          urllib.request.urlretrieve(asset['browser_download_url'],out+'/upstream.openvex.json')
          computed='sha256:'+hashlib.sha256(open(out+'/upstream.openvex.json','rb').read()).hexdigest(); recorded=asset.get('digest')
          verified=bool(recorded and recorded==computed)
          json.dump(asset,open(out+'/openvex-asset-metadata.json','w'),indent=2,sort_keys=True)
          json.dump({'metadata_digest':recorded,'computed_digest':computed,'verified':verified},open(out+'/openvex-asset-verification.json','w'),indent=2,sort_keys=True)
          if not verified: raise SystemExit('OpenVEX digest verification failed')
          ctx['selected_digest']=open(out+'/final-image-id.txt').read().strip(); json.dump(ctx,open(out+'/release-context.json','w'),indent=2,sort_keys=True)
          PY
          git show d008f7b9689a936afd09ac55397c82647477b644:deploy/containers/n8n_openvex_reconcile.py > /tmp/n8n_openvex_reconcile.py
          python /tmp/n8n_openvex_reconcile.py "$OUT"

      - name: Evaluate patched security gate
        if: steps.base.outputs.pass == 'pass'
        id: security
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          out=os.environ['OUT']; rows=json.load(open(out+'/n8n.vendor-openvex-reconciliation.json')); official=json.load(open(out+'/official-2.37.7.grype.json'))
          critical=[r for r in rows if r['severity']=='CRITICAL' and r.get('final_disposition')!='VEX_NOT_AFFECTED_ALLOWED']
          high=[r for r in rows if r['severity']=='HIGH' and r.get('final_disposition')!='VEX_NOT_AFFECTED_ALLOWED']
          kev=[r for r in rows if r.get('CISA_KEV_alias_matches')]
          nodemailer=[]; other=[]
          for r in high:
              ids={str(x).upper() for x in (r.get('scanner_alias_ids') or [])}; ids.add(str(r.get('scanner_advisory_id') or '').upper())
              if r.get('package_name')=='nodemailer' and r.get('installed_version')=='8.0.10' and 'GHSA-P6GQ-J5CR-W38F' in ids: nodemailer.append(r)
              else: other.append(r)
          official_high={(str((m.get('vulnerability') or {}).get('id')),str((m.get('artifact') or {}).get('name'))) for m in official.get('matches',[]) if str((m.get('vulnerability') or {}).get('severity') or '').upper()=='HIGH'}
          new_high=[r for r in high if (str(r.get('scanner_advisory_id')),str(r.get('package_name'))) not in official_high]
          os_high=[r for r in high if r.get('package_type')=='apk']; ip=[r for r in high if r.get('package_name')=='ip-address']; brace=[r for r in high if r.get('package_name')=='brace-expansion']
          summary={'RAW_CRITICAL':sum(1 for r in rows if r['severity']=='CRITICAL'),'RAW_HIGH':sum(1 for r in rows if r['severity']=='HIGH'),'BLOCKING_CRITICAL':len(critical),'CISA_KEV':len(kev),'OS_HIGH_BLOCKING':len(os_high),'IP_ADDRESS_HIGH_BLOCKING':len(ip),'BRACE_EXPANSION_HIGH_BLOCKING':len(brace),'NEW_HIGH_INTRODUCED':len(new_high),'OTHER_HIGH':len(other),'NODEMAILER_EXCEPTION_CANDIDATES':len(nodemailer)}
          summary['PRELIMINARY_HARDENED_SECURITY_PASS']=(not critical and not kev and not os_high and not ip and not brace and not new_high and not other and len(nodemailer)<=1)
          json.dump(summary,open(out+'/hardened-security-summary.json','w'),indent=2,sort_keys=True); print(json.dumps(summary,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('prelim='+('pass' if summary['PRELIMINARY_HARDENED_SECURITY_PASS'] else 'fail')+'\n')
          PY

      - name: Prove nodemailer containment
        if: steps.security.outputs.prelim == 'pass'
        run: |
          set -euo pipefail
          test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = '02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1'
          test "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" = 'f5409839cec1fa86b6af20f6cd242e71d52dceec8dcdb6cf35fd0b237e4a489c'
          ! grep -R -F 'n8n-nodes-base.emailSend' automation/n8n/workflows/*.json
          ! grep -R -F 'n8n-nodes-base.code' automation/n8n/workflows/*.json
          ! grep -R -F 'n8n-nodes-base.executeCommand' automation/n8n/workflows/*.json
          ! grep -R -F 'n8n-nodes-base.readWriteFile' automation/n8n/workflows/*.json
          envs="$(docker image inspect "$PROBE_IMAGE" --format '{{json .Config.Env}}')"; echo "$envs" > "$OUT/image-env.json"
          grep -F 'n8n-nodes-base.emailSend' "$OUT/image-env.json"; grep -F 'n8n-nodes-base.executeCommand' "$OUT/image-env.json"; grep -F 'n8n-nodes-base.localFileTrigger' "$OUT/image-env.json"
          ! grep -Eiq 'SMTP|N8N_EMAIL_MODE|N8N_SMTP' automation/n8n/runtime/docker-compose.yml
          grep -F '127.0.0.1:5678:5678' automation/n8n/runtime/docker-compose.yml
          cid="$(docker run -d --rm --tmpfs /tmp:rw,nosuid,nodev -e N8N_USER_FOLDER=/tmp/n8n -e N8N_ENCRYPTION_KEY=ci-only-patched-probe-encryption-key-000000000000 -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false -p 127.0.0.1:15679:5678 "$PROBE_IMAGE")"
          trap 'docker logs "$cid" > "$OUT/reachability-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 120); do curl -fsS http://127.0.0.1:15679/healthz >/dev/null 2>&1 && break; sleep .5; done
          curl -fsS http://127.0.0.1:15679/healthz >/dev/null
          ! docker inspect "$cid" --format '{{json .Config.Env}}' | grep -Eiq 'SMTP|N8N_EMAIL_MODE|N8N_SMTP'
          code="$(curl -sS -o "$OUT/node-types.json" -w '%{http_code}' http://127.0.0.1:15679/types/nodes.json || true)"; test "$code" = 200
          ! grep -Fq 'n8n-nodes-base.emailSend' "$OUT/node-types.json"; ! grep -Fq 'n8n-nodes-base.executeCommand' "$OUT/node-types.json"; ! grep -Fq 'n8n-nodes-base.localFileTrigger' "$OUT/node-types.json"; grep -Fq 'n8n-nodes-base.httpRequest' "$OUT/node-types.json"
          docker stop -t 5 "$cid" >/dev/null; trap - EXIT
          cat > "$OUT/nodemailer-risk-record-probe.md" <<'EOF'
          # nodemailer residual probe risk record
          Advisory: GHSA-p6gq-j5cr-w38f
          Package/version: nodemailer 8.0.10
          Owner: SiteScore owner/operator
          Re-review no later than: 2026-10-03
          Controls: frozen workflows do not use emailSend; emailSend/executeCommand/localFileTrigger excluded; no SMTP transport configured; n8n bind is loopback/non-public; frozen workflows do not use Code/ExecuteCommand/ReadWriteFile.
          Re-review triggers: newer official stable n8n; upstream nodemailer remediation; workflow hash/node change; NODES_EXCLUDE change; SMTP/mail configuration; network exposure change.
          Status: probe evidence; permanent record required on promotion.
          EOF
          echo 'NODEMAILER_REACHABILITY_CONTROLS=PASS' > "$OUT/nodemailer-reachability.txt"

      - name: Run frozen n8n static contracts
        if: steps.security.outputs.prelim == 'pass'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          python -m pytest -q automation/n8n/tests | tee "$OUT/static-tests.txt"
          grep -E '12 passed' "$OUT/static-tests.txt"

      - name: Run order-paid and recovery compatibility smokes
        if: steps.security.outputs.prelim == 'pass'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re,difflib
          out=Path(os.environ['OUT']); paths=[Path('automation/n8n/tests/runtime_smoke.sh'),Path('automation/n8n/tests/recovery_schedule_runtime_smoke.sh'),Path('automation/n8n/tests/recovery_replay_runtime_smoke.sh')]
          for p in paths:
              text=p.read_text(); patched=text.replace('IMAGE="n8nio/n8n:2.33.4"','IMAGE="sitescore-n8n-patched:probe"').replace('docker pull "$IMAGE" >/dev/null\n','').replace('test "$VERSION" = "2.33.4"','test "$VERSION" = "2.37.7"')
              patched=re.sub(r'DIGEST="\$\(docker image inspect "\$IMAGE" --format \'\{\{index \.RepoDigests 0\}\}\'\)"\ncase "\$DIGEST" in .*?esac\n','DIGEST="$(docker image inspect "$IMAGE" --format \'{{.Id}}\')"\ntest -n "$DIGEST"\n',patched,count=1,flags=re.S)
              q=p.with_name('.probe-'+p.name); q.write_text(patched); q.chmod(0o755); (out/(p.name+'.probe.patch')).write_text(''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile=str(p),tofile=str(q))))
          PY
          trap 'rm -f automation/n8n/tests/.probe-runtime_smoke.sh automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh' EXIT
          bash automation/n8n/tests/.probe-runtime_smoke.sh | tee "$OUT/order-paid-runtime-smoke.txt"
          bash automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh | tee "$OUT/recovery-schedule-runtime-smoke.txt"
          bash automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh | tee "$OUT/recovery-replay-runtime-smoke.txt"
          rm -f automation/n8n/tests/.probe-runtime_smoke.sh automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh; trap - EXIT
          git diff --exit-code

      - name: Final patched probe decision
        if: always()
        run: |
          set -euo pipefail
          base='${{ steps.base.outputs.pass }}'; prelim='${{ steps.security.outputs.prelim }}'
          test "$base" = pass || { echo 'PATCHED_BASE_GATE=FAIL_OR_NOT_REACHED' | tee "$OUT/final-gate.txt"; exit 1; }
          test "$prelim" = pass || { echo 'PATCHED_SECURITY_GATE=FAIL_OR_NOT_REACHED' | tee "$OUT/final-gate.txt"; exit 1; }
          grep -F 'NODEMAILER_REACHABILITY_CONTROLS=PASS' "$OUT/nodemailer-reachability.txt"
          test -f "$OUT/static-tests.txt"; test -f "$OUT/order-paid-runtime-smoke.txt"; test -f "$OUT/recovery-schedule-runtime-smoke.txt"; test -f "$OUT/recovery-replay-runtime-smoke.txt"
          echo 'PATCHED_HARDENED_N8N_SECURITY_RUNTIME_WORKFLOW_GATE=PASS' | tee "$OUT/final-gate.txt"

      - name: Upload patched final probe evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.2
        with:
          name: faz7-n8n-patched-final-${{ github.sha }}
          path: deploy/containers/artifacts/n8n-patched-final-probe/
          if-no-files-found: error
          retention-days: 14
