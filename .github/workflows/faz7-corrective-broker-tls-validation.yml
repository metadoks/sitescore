name: faz7-corrective-broker-tls-commerce-proof

on:
  push:
    branches:
      - faz7/corrective-broker-tls-rediss
    paths:
      - .github/workflows/faz7-corrective-broker-tls-validation.yml

permissions:
  contents: read
  statuses: write

jobs:
  commerce-current-head-applicable:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitescore_commerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sitescore_commerce" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SITESCORE_COMMERCE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore_commerce
      SITESCORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore_commerce
      SITESCORE_BROKER_URL: redis://127.0.0.1:6379/0
      SITESCORE_API_KEY_PEPPER: ci-pepper-value-not-real-0123456789-abcdefghijklmnopqrstuvwxyz
      SITESCORE_ANALYSIS_DEADLINE_SECONDS: 900
      SITESCORE_WORKER_SOFT_LIMIT_SECONDS: 840
      SITESCORE_WORKER_HARD_LIMIT_SECONDS: 900
      SITESCORE_REPORT_STORAGE_BUCKET: sitescore-reports
      SITESCORE_REPORT_STORAGE_REGION: us-east-1
      SITESCORE_REPORT_STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      SITESCORE_REPORT_MAX_BYTES: 10485760
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ci-minio-access
      AWS_SECRET_ACCESS_KEY: ci-minio-secret-not-real-0123456789
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove Commerce and n8n bytes unchanged from corrective base
        run: |
          test -z "$(git diff --name-only ee45e4fdd3d805137387a0fc1198eedf8d461fb2...HEAD -- sitescore-commerce automation/n8n)"
          echo "COMMERCE_N8N_DIFF_FROM_BASE=NONE"
      - name: Install frozen dependency graph and Commerce test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "shapely==2.1.2" "pyproj==3.7.2"
          for pkg in sitescore-core sitescore-data sitescore-providers sitescore-spatial sitescore-metrics sitescore-benchmarks sitescore-pipeline sitescore-app; do
            python -m pip install -e "$pkg" --no-deps
          done
          python -m pip install -e "sitescore-report[dev]"
          python -m pip install -e "sitescore-api[dev]"
          python -m pip install -e "sitescore-commerce[test]"
          python -m pip check
      - name: Run current-head applicable Commerce regression
        id: current
        continue-on-error: true
        working-directory: sitescore-commerce
        run: |
          set -o pipefail
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python -m pytest -o addopts='' -q --tb=short \
            -k 'not test_final_candidate_is_based_on_corrective_locked_main_and_permanent_diff_is_audit_only' | tee /tmp/current-commerce.log
      - name: Publish current-head Commerce evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.current.outcome }}
        run: |
          summary=$(grep -E '[0-9]+ passed' /tmp/current-commerce.log | tail -n 1 || true)
          state=failure
          description="current-head Commerce applicable regression FAILED"
          if [ "$TEST_OUTCOME" = success ] && echo "$summary" | grep -q '416 passed'; then
            state=success
            description="416 current-head Commerce tests PASS; legacy FAZ6 diff gate excluded"
          fi
          python - "$state" "$description" <<'PY' >/tmp/status.json
          import json, os, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "faz7/commerce-current-applicable",
              "description": sys.argv[2],
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null
          test "$state" = success

  commerce-frozen-base-full:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitescore_commerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sitescore_commerce" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SITESCORE_COMMERCE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore_commerce
      SITESCORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore_commerce
      SITESCORE_BROKER_URL: redis://127.0.0.1:6379/0
      SITESCORE_API_KEY_PEPPER: ci-pepper-value-not-real-0123456789-abcdefghijklmnopqrstuvwxyz
      SITESCORE_ANALYSIS_DEADLINE_SECONDS: 900
      SITESCORE_WORKER_SOFT_LIMIT_SECONDS: 840
      SITESCORE_WORKER_HARD_LIMIT_SECONDS: 900
      SITESCORE_REPORT_STORAGE_BUCKET: sitescore-reports
      SITESCORE_REPORT_STORAGE_REGION: us-east-1
      SITESCORE_REPORT_STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      SITESCORE_REPORT_MAX_BYTES: 10485760
      AWS_EC2_METADATA_DISABLED: true
      AWS_ACCESS_KEY_ID: ci-minio-access
      AWS_SECRET_ACCESS_KEY: ci-minio-secret-not-real-0123456789
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee45e4fdd3d805137387a0fc1198eedf8d461fb2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen Commerce replay SHA
        run: test "$(git rev-parse HEAD)" = "ee45e4fdd3d805137387a0fc1198eedf8d461fb2"
      - name: Install frozen dependency graph and Commerce test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "shapely==2.1.2" "pyproj==3.7.2"
          for pkg in sitescore-core sitescore-data sitescore-providers sitescore-spatial sitescore-metrics sitescore-benchmarks sitescore-pipeline sitescore-app; do
            python -m pip install -e "$pkg" --no-deps
          done
          python -m pip install -e "sitescore-report[dev]"
          python -m pip install -e "sitescore-api[dev]"
          python -m pip install -e "sitescore-commerce[test]"
          python -m pip check
      - name: Run frozen Commerce 417-test baseline
        id: frozen
        continue-on-error: true
        working-directory: sitescore-commerce
        run: |
          set -o pipefail
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python -m pytest -o addopts='' -q --tb=short | tee /tmp/frozen-commerce.log
      - name: Publish frozen Commerce replay evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.frozen.outcome }}
        run: |
          summary=$(grep -E '[0-9]+ passed' /tmp/frozen-commerce.log | tail -n 1 || true)
          state=failure
          description="frozen-base Commerce replay FAILED"
          if [ "$TEST_OUTCOME" = success ] && echo "$summary" | grep -q '417 passed'; then
            state=success
            description="417/417 frozen Commerce baseline PASS at exact base ee45e4f"
          fi
          python - "$state" "$description" <<'PY' >/tmp/status.json
          import json, os, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "faz7/commerce-frozen-base",
              "description": sys.argv[2],
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null
          test "$state" = success
