# Temporary final exact-HEAD validation; remove before Reviewer handoff.
name: authority-corrective-validation

on:
  push:
    branches:
      - faz4/authority-corrective-reopen

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corrective scope audit
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -E '^(sitescore-core|sitescore-data|sitescore-providers|sitescore-spatial|sitescore-metrics|sitescore-benchmarks)/' || true)"
          if [ -n "$forbidden" ]; then
            echo "Forbidden frozen-package changes detected:"
            printf '%s\n' "$forbidden"
            exit 1
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(sitescore-pipeline/src/sitescore_pipeline/integration.py|sitescore-pipeline/tests/.*|sitescore-app/src/sitescore_app/gating.py|sitescore-app/tests/.*|docs/AUTHORITY_CORRECTIVE_REOPEN_PIPE_APP.md|\.github/workflows/authority-corrective-validation.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected corrective-scope paths detected:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if ! git diff --quiet origin/main...HEAD -- ':(glob)*/pyproject.toml' ':(glob)*/requirements.lock'; then
            echo "Package/version/dependency metadata changed unexpectedly."
            exit 1
          fi
          echo "CORRECTIVE_SCOPE_AUDIT=PASS"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./sitescore-core
          python -m pip install -e ./sitescore-data
          python -m pip install -e ./sitescore-spatial
          python -m pip install -e ./sitescore-providers
          python -m pip install -e ./sitescore-metrics
          python -m pip install -e ./sitescore-benchmarks
          python -m pip install -e ./sitescore-pipeline
          python -m pip install -e ./sitescore-app
      - name: Test sitescore-app
        working-directory: sitescore-app
        run: |
          python -m pytest -q
          echo "sitescore-app PASS"
      - name: Test sitescore-pipeline
        working-directory: sitescore-pipeline
        run: |
          python -m pytest -q
          echo "sitescore-pipeline PASS"
      - name: Test sitescore-benchmarks
        working-directory: sitescore-benchmarks
        run: |
          python -m pytest -q
          echo "sitescore-benchmarks PASS"
      - name: Test sitescore-metrics
        working-directory: sitescore-metrics
        run: |
          python -m pytest -q
          echo "sitescore-metrics PASS"
      - name: Test sitescore-spatial
        working-directory: sitescore-spatial
        run: |
          python -m pytest -q
          echo "sitescore-spatial PASS"
      - name: Test sitescore-providers
        working-directory: sitescore-providers
        run: |
          python -m pytest -q
          echo "sitescore-providers PASS"
      - name: Test sitescore-data
        working-directory: sitescore-data
        run: |
          python -m pytest -q
          echo "sitescore-data PASS"
      - name: Test sitescore-core
        working-directory: sitescore-core
        run: |
          python -m pytest -q
          echo "sitescore-core PASS"
