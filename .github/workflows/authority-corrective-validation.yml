- `sitescore-app/src/sitescore_app/gating.py`

Associated adversarial tests and this record are additive.

## PIPE-AUTH-H001 correction

The pipeline no longer treats registered object identity alone as canonical execution authority. `_install_canonical_factories()` now keeps closure-private construction-time bindings for every canonical `NormalizedFeatureAssembly` and `ReadinessEvaluation`.

For assemblies the binding retains the exact construction-time `features`, `direct_results`, `feature_policies`, `compatibility`, `approved_fallback_policies`, `artifact_identities`, and `assembly_id`, plus a construction-time semantic attestation. Resolution requires both exact registered object identity and current-field integrity. The attestation is recomputed to detect nested semantic mutation, including mutation of normalized feature values.

For readiness evaluations the binding retains the exact construction-time assembly and readiness result plus a semantic attestation of the full readiness result. Replacement of `assembly` / `result`, or mutation such as flipping `is_score_ready`, fails closed.

Readiness validation and terminal construction consume closure-resolved trusted construction-time values rather than caller-mutated public fields. Existing hashes remain diagnostic/semantic records; they do not grant origin authority by themselves.

## APP-H002 correction

`_install_application_factories()` now retains closure-private construction-time bindings through weak references:

- `ApplicationPipelineResult` -> exact `RealDataPipelineResult` returned by the closure-captured canonical pipeline factory.
- `ApplicationScoringInput` -> exact `ApplicationPipelineResult` used to create it.

Canonical requirements verify registered wrapper identity and exact current nested-reference integrity. Authorization decisions use the closure-bound terminal reference. Redirecting either wrapper after registration fails closed.

## Adversarial coverage

The corrective regressions exercise `object.__setattr__` directly and cover:

- replacement of every authority-bearing `NormalizedFeatureAssembly` field;
- replacement of `ReadinessEvaluation.assembly` and `.result`;
- nested readiness mutation attempting to flip `is_score_ready`;
- nested forged numeric `road_parking_access_score` while COMB-005 remains unavailable;
- copied/reconstructed pipeline authority objects (retained prior regressions);
- `ApplicationPipelineResult.pipeline_result` redirection;
- `ApplicationScoringInput.application_pipeline_result` redirection;
- manual/copy wrappers and raw forged terminal DTO rejection;
- unmodified canonical pipeline behavior remaining `NOT_SCORE_READY` under current COMB-005 truth.

## Non-regression / governance

- `SCORING_MATH_CHANGED: NO`
