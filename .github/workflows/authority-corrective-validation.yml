## Validation and relock

Full package regression is executed by the temporary `authority-corrective-validation` workflow across app, pipeline, benchmarks, metrics, spatial, providers, data, and core. Final run/SHA evidence is recorded in `implementer.md` after validation. The temporary workflow is removed before Reviewer handoff, and final HEAD must differ from the validated SHA only by workflow removal.

