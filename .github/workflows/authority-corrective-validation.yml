name: authority-corrective-validation

on:
  push:
    branches:
      - faz4/authority-corrective-reopen

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow authority correction
        run: |
          python - <<'PY'
          import base64, gzip
          payload = '' 
          exec(gzip.decompress(base64.b64decode(payload)).decode('utf-8'))
          PY
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./sitescore-core
          python -m pip install -e ./sitescore-data
          python -m pip install -e ./sitescore-spatial
          python -m pip install -e ./sitescore-providers
          python -m pip install -e ./sitescore-metrics
          python -m pip install -e ./sitescore-benchmarks
          python -m pip install -e ./sitescore-pipeline
          python -m pip install -e ./sitescore-app
      - name: Test sitescore-app
        working-directory: sitescore-app
        run: python -m pytest -q
      - name: Test sitescore-pipeline
        working-directory: sitescore-pipeline
        run: python -m pytest -q
      - name: Test sitescore-benchmarks
        working-directory: sitescore-benchmarks
        run: python -m pytest -q
      - name: Test sitescore-metrics
        working-directory: sitescore-metrics
        run: python -m pytest -q
      - name: Test sitescore-spatial
        working-directory: sitescore-spatial
        run: python -m pytest -q
      - name: Test sitescore-providers
        working-directory: sitescore-providers
        run: python -m pytest -q
      - name: Test sitescore-data
        working-directory: sitescore-data
        run: python -m pytest -q
      - name: Test sitescore-core
        working-directory: sitescore-core
        run: python -m pytest -q
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitescore-pipeline/src/sitescore_pipeline/integration.py \
                  sitescore-pipeline/tests/test_readiness_pipeline.py \
                  sitescore-app/src/sitescore_app/gating.py
          if git diff --cached --quiet; then
            echo "No corrective source changes to commit."
          else
            git commit -m "Harden pipeline and app authority bindings"
            git push origin HEAD:faz4/authority-corrective-reopen
          fi
