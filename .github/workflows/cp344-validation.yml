name: cp344-validation

on:
  push:
    branches:
      - faz3.4/cp3.4-4-benchmark-distribution

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling and packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./sitescore-core
          python -m pip install -e ./sitescore-data
          python -m pip install -e ./sitescore-spatial
          python -m pip install -e ./sitescore-providers
          python -m pip install -e ./sitescore-metrics
          python -m pip install -e ./sitescore-benchmarks
      - name: Test sitescore-benchmarks
        run: python -m pytest -q sitescore-benchmarks
      - name: Test sitescore-metrics
        run: python -m pytest -q sitescore-metrics
      - name: Test sitescore-spatial
        run: python -m pytest -q sitescore-spatial
      - name: Test sitescore-providers
        run: python -m pytest -q sitescore-providers
      - name: Test sitescore-data
        run: python -m pytest -q sitescore-data
      - name: Test sitescore-core
        run: python -m pytest -q sitescore-core

