          python -m pytest -q automation/n8n/tests/test_workflow_static.py automation/n8n/tests/test_recovery_schedule_static.py | tee "$OUT/static-tests.txt"

      - name: Run order-paid and recovery compatibility smokes on candidate
        if: steps.solver.outputs.pass == 'pass'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re,difflib
          out=Path(os.environ['OUT'])
          paths=[Path('automation/n8n/tests/runtime_smoke.sh'),Path('automation/n8n/tests/recovery_schedule_runtime_smoke.sh'),Path('automation/n8n/tests/recovery_replay_runtime_smoke.sh')]
          for p in paths:
              text=p.read_text(); patched=text.replace('IMAGE="n8nio/n8n:2.33.4"','IMAGE="sitescore-n8n-hardened:probe"')
              patched=patched.replace('docker pull "$IMAGE" >/dev/null\n','').replace('test "$VERSION" = "2.33.4"','test "$VERSION" = "2.37.9"')
              patched=re.sub(r'DIGEST="\$\(docker image inspect "\$IMAGE" --format \'\{\{index \.RepoDigests 0\}\}\'\)"\ncase "\$DIGEST" in .*?esac\n',
