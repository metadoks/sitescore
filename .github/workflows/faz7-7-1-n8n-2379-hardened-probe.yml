          bash automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh | tee "$OUT/recovery-schedule-runtime-smoke.txt"
          bash automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh | tee "$OUT/recovery-replay-runtime-smoke.txt"
          rm -f automation/n8n/tests/.probe-runtime_smoke.sh automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh
          trap - EXIT
          git diff --exit-code
          test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = '02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1'
          test "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" = 'f5409839cec1fa86b6af20f6cd242e71d52dceec8dcdb6cf35fd0b237e4a489c'

      - name: Final probe decision
