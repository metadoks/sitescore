name: faz7-7-1-n8n-2379-hardened-probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UPSTREAM_STABLE_VERSION: '2.37.9'
      UPSTREAM_STABLE_COMMIT: '073ec4552a6675a10f5b212d55bdc00c91d4829b'
      UPSTREAM_STABLE_TREE: 'e825fca3c49cca4c0dddf23a9fc426a289118ed1'
      OFFICIAL_IMAGE: 'n8nio/n8n@sha256:ed6bbab565eddbb688f394594cb2932d2b3b24f02240299a8fcce78bfe4201db'
      UPSTREAM_MASTER_COMMIT: 'fd105a6dc2cd51b5e5fd64c2efad57e6801d2325'
      UPSTREAM_DEP_EVIDENCE_COMMIT: '64de0e71db286afb7537324aa4367a3f97cd6d19'
      MASTER_DOCKERFILE_BLOB: 'f72e1a3f3aae40319e58989e5fc2a71e687a1b59'
      MASTER_BASE_DOCKERFILE_BLOB: '1f2a82aa961a389750d774c88735fb11c5ae7c45'
      MASTER_BASE_WORKFLOW_BLOB: 'dd9e3badecd4fc1c5e4a51668824f5f214becaae'
      DHI_REF: 'dhi.io/node:26.7.0-alpine3.24-dev@sha256:4b494d89fb26c950ce97865acf45b480dc7a6868fdc2b81c2d66599702eeac3f'
      BUILDER_IMAGE: 'node:26.7.0-alpine3.24@sha256:aadf416b2cdce311a8811ba3f0608a61b77dbf997500e2eafe781b51f6a0b019'
      UPSTREAM_RUNTIME_IMAGE: 'n8nio/base:26.7.0@sha256:33687300c4e94dc00f42ec79ae15082ae07330ecd82ae1167125905b65908ff8'
      REFERENCE_BASE_IMAGE: 'sitescore-n8n-base-reference:26.7.0'
      HARDENED_BASE_IMAGE: 'sitescore-n8n-base-hardened:26.7.0'
      SOLVER_BASE_IMAGE: 'sitescore-n8n-base-solver-evidence:26.7.0'
      PROBE_IMAGE: 'sitescore-n8n-hardened:probe'
      OUT: 'deploy/containers/artifacts/n8n-2379-hardened-probe'

    steps:
      - name: Checkout SiteScore exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Free runner disk for upstream source rebuild
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # upstream pinned v2.0.2
        with:
          install: false
          version: 11.22.0

      - name: Setup Node 26.7.0 from upstream master build chain
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '26.7.0'

      - name: Re-enumerate stable release and bind frozen workflow bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python - <<'PY'
          import json, os, re, urllib.request
          from urllib.parse import urlencode
          token=os.environ['GH_TOKEN']; releases=[]
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-apk-solver'}
          for page in range(1,11):
              req=urllib.request.Request(
                  'https://api.github.com/repos/n8n-io/n8n/releases?'+urlencode({'per_page':100,'page':page}),
                  headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: batch=json.load(r)
              if not batch: break
              for rel in batch:
                  if rel.get('draft') or rel.get('prerelease'): continue
                  m=re.fullmatch(r'n8n@(\d+)\.(\d+)\.(\d+)',str(rel.get('tag_name','')))
                  if m and int(m.group(1)) == 2:
                      releases.append((tuple(map(int,m.groups())),rel))
              if len(batch)<100: break
          if not releases: raise SystemExit('no official stable 2.x release found')
          version_tuple,rel=max(releases,key=lambda x:x[0]); version='.'.join(map(str,version_tuple))
          expected=os.environ['UPSTREAM_STABLE_VERSION']
          if version != expected:
              raise SystemExit(f'new official stable {version} exists; stop and validate official image first')
          ctx={
              'selected_version':version,'release_tag':rel['tag_name'],'release_id':rel['id'],
              'published_at':rel.get('published_at'),
              'stable_source_commit':os.environ['UPSTREAM_STABLE_COMMIT'],
              'stable_source_tree':os.environ['UPSTREAM_STABLE_TREE'],
              'official_image':os.environ['OFFICIAL_IMAGE'],
              'master_build_commit':os.environ['UPSTREAM_MASTER_COMMIT'],
              'dependency_security_evidence_commit':os.environ['UPSTREAM_DEP_EVIDENCE_COMMIT'],
              'builder_image':os.environ['BUILDER_IMAGE'],
              'upstream_runtime_image':os.environ['UPSTREAM_RUNTIME_IMAGE'],
              'dhi_ref':os.environ['DHI_REF'],
          }
          json.dump(ctx,open(os.environ['OUT']+'/source-context.json','w'),indent=2,sort_keys=True)
          print(json.dumps(ctx,indent=2,sort_keys=True))
          PY
          test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = '02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1'
          test "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" = 'f5409839cec1fa86b6af20f6cd242e71d52dceec8dcdb6cf35fd0b237e4a489c'

      - name: Bind exact upstream stable source and master build recipes
        run: |
          set -euo pipefail
          rm -rf /tmp/n8n-src
          git clone --filter=blob:none --no-checkout https://github.com/n8n-io/n8n.git /tmp/n8n-src
          git -C /tmp/n8n-src fetch --depth=1 origin "$UPSTREAM_STABLE_COMMIT" "$UPSTREAM_MASTER_COMMIT" "$UPSTREAM_DEP_EVIDENCE_COMMIT"
          git -C /tmp/n8n-src checkout --detach "$UPSTREAM_STABLE_COMMIT"
          test "$(git -C /tmp/n8n-src rev-parse HEAD)" = "$UPSTREAM_STABLE_COMMIT"
          test "$(git -C /tmp/n8n-src rev-parse HEAD^{tree})" = "$UPSTREAM_STABLE_TREE"
          test "$(git -C /tmp/n8n-src rev-parse "$UPSTREAM_MASTER_COMMIT:docker/images/n8n/Dockerfile")" = "$MASTER_DOCKERFILE_BLOB"
          actual_base_blob="$(git -C /tmp/n8n-src rev-parse "$UPSTREAM_MASTER_COMMIT:docker/images/n8n-base/Dockerfile")"
          printf 'ACTUAL_MASTER_BASE_DOCKERFILE_BLOB=%s\n' "$actual_base_blob" >> "$GITHUB_WORKSPACE/$OUT/upstream-derived-blobs.txt"
          actual_base_workflow_blob="$(git -C /tmp/n8n-src rev-parse "$UPSTREAM_MASTER_COMMIT:.github/workflows/build-base-image.yml")"
          printf 'ACTUAL_MASTER_BASE_WORKFLOW_BLOB=%s\n' "$actual_base_workflow_blob" >> "$GITHUB_WORKSPACE/$OUT/upstream-derived-blobs.txt"

          git -C /tmp/n8n-src show "$UPSTREAM_MASTER_COMMIT:docker/images/n8n-base/Dockerfile" > "$GITHUB_WORKSPACE/$OUT/upstream-base-Dockerfile"
          git -C /tmp/n8n-src show "$UPSTREAM_MASTER_COMMIT:.github/workflows/build-base-image.yml" > "$GITHUB_WORKSPACE/$OUT/upstream-build-base-image.yml"
          grep -F "node_version: '26.7.0'" "$GITHUB_WORKSPACE/$OUT/upstream-build-base-image.yml"
          grep -F "$DHI_REF" "$GITHUB_WORKSPACE/$OUT/upstream-build-base-image.yml"
          grep -F 'apk del apk-tools' "$GITHUB_WORKSPACE/$OUT/upstream-base-Dockerfile"
          grep -F 'openssh \' "$GITHUB_WORKSPACE/$OUT/upstream-base-Dockerfile"
          grep -F 'graphicsmagick \' "$GITHUB_WORKSPACE/$OUT/upstream-base-Dockerfile"
          grep -F 'ip-address@10: 10.3.1' /tmp/n8n-src/pnpm-workspace.yaml
          grep -F 'brace-expansion@5: 5.0.9' /tmp/n8n-src/pnpm-workspace.yaml
          grep -F 'fast-uri: 3.1.5' /tmp/n8n-src/pnpm-workspace.yaml
          git -C /tmp/n8n-src diff --exit-code
          git -C /tmp/n8n-src show "$UPSTREAM_DEP_EVIDENCE_COMMIT:pnpm-workspace.yaml" > "$GITHUB_WORKSPACE/$OUT/upstream-security-overrides-evidence.yaml"
          grep -F 'fast-uri: 3.1.6' "$GITHUB_WORKSPACE/$OUT/upstream-security-overrides-evidence.yaml"
          grep -F 'ip-address@10: 10.3.1' "$GITHUB_WORKSPACE/$OUT/upstream-security-overrides-evidence.yaml"
          grep -F 'brace-expansion@5: 5.0.9' "$GITHUB_WORKSPACE/$OUT/upstream-security-overrides-evidence.yaml"
          cp /tmp/n8n-src/pnpm-workspace.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-workspace.pre.yaml"
          cp /tmp/n8n-src/pnpm-lock.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-lock.pre.yaml"
          python - <<'PYDEP'
          from pathlib import Path
          p=Path('/tmp/n8n-src/pnpm-workspace.yaml'); text=p.read_text()
          old='  fast-uri: 3.1.5\n'; new='  fast-uri: 3.1.6\n'
          if text.count(old)!=1: raise SystemExit(f'expected one stable fast-uri override, got {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PYDEP
          (cd /tmp/n8n-src && pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts)
          cp /tmp/n8n-src/pnpm-workspace.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-workspace.post.yaml"
          cp /tmp/n8n-src/pnpm-lock.yaml "$GITHUB_WORKSPACE/$OUT/pnpm-lock.post.yaml"
          git -C /tmp/n8n-src diff -- pnpm-workspace.yaml pnpm-lock.yaml > "$GITHUB_WORKSPACE/$OUT/dependency-security-delta.patch"
          python - <<'PYLOCK'
          from pathlib import Path
          import difflib
          pre=Path('/tmp/n8n-src').joinpath('pnpm-lock.yaml')
          before=Path(Path.cwd() / __import__('os').environ['OUT'] / 'pnpm-lock.pre.yaml').read_text().splitlines(True)
          after=pre.read_text().splitlines(True)
          diff=list(difflib.unified_diff(before,after,n=4))
          hunks=[]; current=[]
          for line in diff:
              if line.startswith('@@'):
                  if current: hunks.append(current)
                  current=[line]
              elif current:
                  current.append(line)
          if current: hunks.append(current)
          allowed=('fast-uri','ip-address','brace-expansion')
          bad=[h for h in hunks if not any(tok in ''.join(h) for tok in allowed)]
          if bad:
              raise SystemExit('pnpm lock delta contains non-authorized hunk: '+''.join(bad[0])[:2000])
          workspace=Path('/tmp/n8n-src/pnpm-workspace.yaml').read_text()
          if '  fast-uri: 3.1.6\n' not in workspace or '  fast-uri: 3.1.5\n' in workspace:
              raise SystemExit('fast-uri workspace override delta invalid')
          lock=''.join(after)
          required=('fast-uri@3.1.6','ip-address@10.3.1','brace-expansion@5.0.9')
          for token in required:
              if token not in lock: raise SystemExit(f'fixed lock token missing: {token}')
          for token in ('fast-uri@3.1.5','ip-address@10.2.0','brace-expansion@5.0.8'):
              if token in lock: raise SystemExit(f'vulnerable lock token remains: {token}')
          print('DEPENDENCY_SECURITY_LOCK_DELTA=AUTHORIZED_ONLY')
          PYLOCK

          cp /tmp/n8n-src/docker/images/n8n/Dockerfile "$GITHUB_WORKSPACE/$OUT/stable-Dockerfile"
          git -C /tmp/n8n-src show "$UPSTREAM_MASTER_COMMIT:docker/images/n8n/Dockerfile" > /tmp/n8n-src/docker/images/n8n/Dockerfile
          cp /tmp/n8n-src/docker/images/n8n/Dockerfile "$GITHUB_WORKSPACE/$OUT/master-Dockerfile-used"
          git -C /tmp/n8n-src diff -- docker/images/n8n/Dockerfile > "$GITHUB_WORKSPACE/$OUT/build-metadata-delta.patch"
          test "$(git -C /tmp/n8n-src diff --name-only)" = $'docker/images/n8n/Dockerfile\npnpm-lock.yaml\npnpm-workspace.yaml'
          grep -F "$BUILDER_IMAGE" /tmp/n8n-src/docker/images/n8n/Dockerfile
          grep -F "$UPSTREAM_RUNTIME_IMAGE" /tmp/n8n-src/docker/images/n8n/Dockerfile
          cat > "$GITHUB_WORKSPACE/$OUT/source-identities.txt" <<EOF
          STABLE_SOURCE_COMMIT=$UPSTREAM_STABLE_COMMIT
          STABLE_SOURCE_TREE=$UPSTREAM_STABLE_TREE
          MASTER_BUILD_COMMIT=$UPSTREAM_MASTER_COMMIT
          DEPENDENCY_SECURITY_EVIDENCE_COMMIT=$UPSTREAM_DEP_EVIDENCE_COMMIT
          MASTER_N8N_DOCKERFILE_BLOB=$MASTER_DOCKERFILE_BLOB
          MASTER_BASE_DOCKERFILE_BLOB=$MASTER_BASE_DOCKERFILE_BLOB
          MASTER_BASE_WORKFLOW_BLOB=$MASTER_BASE_WORKFLOW_BLOB
          DHI_REF=$DHI_REF
          BUILDER_IMAGE=$BUILDER_IMAGE
          UPSTREAM_RUNTIME_IMAGE=$UPSTREAM_RUNTIME_IMAGE
          EOF

      - name: Construct reference hardened and solver evidence bases
        run: |
          set -euo pipefail
          cp "$OUT/upstream-base-Dockerfile" /tmp/Dockerfile.base.reference
          python - <<'PY'
          from pathlib import Path
          import difflib, json, os
          src=Path(os.environ['OUT']+'/upstream-base-Dockerfile').read_text()
          hard=src
          for line in ('        openssh \\\n','        graphicsmagick \\\n'):
              if hard.count(line) != 1:
                  raise SystemExit(f'expected exactly one authorized omission line: {line!r}')
              hard=hard.replace(line,'')
          pin_marker='    # Cleanup\n'
          pin_block=(
              "    apk add --no-cache --upgrade \\\n"
              "        'libcrypto3=3.5.8-r0' \\\n"
              "        'libssl3=3.5.8-r0' \\\n"
              "        'libexpat=2.8.4-r0' && \\\n"
          )
          if hard.count(pin_marker)!=1: raise SystemExit('exact runtime pin insertion marker missing')
          hard=hard.replace(pin_marker,pin_block+pin_marker,1)
          solver=src
          needle='    apk del apk-tools\n'
          if solver.count(needle) != 1:
              raise SystemExit('expected exactly one upstream final apk-tools cleanup line')
          solver=solver.replace(needle,'    true\n')
          Path('/tmp/Dockerfile.base.hardened').write_text(hard)
          Path('/tmp/Dockerfile.base.solver').write_text(solver)
          Path(os.environ['OUT']+'/base-hardening.patch').write_text(''.join(difflib.unified_diff(
              src.splitlines(True),hard.splitlines(True),fromfile='upstream-base-Dockerfile',tofile='hardened-base-Dockerfile')))
          Path(os.environ['OUT']+'/solver-evidence.patch').write_text(''.join(difflib.unified_diff(
              src.splitlines(True),solver.splitlines(True),fromfile='upstream-base-Dockerfile',tofile='solver-evidence-Dockerfile')))
          json.dump({'production_delta':{'deliberate_omissions':['openssh','graphicsmagick']},
                     'runtime_security_delta':{'libcrypto3':'3.5.8-r0','libssl3':'3.5.8-r0','libexpat':'2.8.4-r0'},
                     'evidence_only_delta':'defer final apk del apk-tools until solver proof'},
                    open(os.environ['OUT']+'/base-construction-delta.json','w'),indent=2,sort_keys=True)
          PY
          test "$(grep -c '^        openssh \\' /tmp/Dockerfile.base.reference)" = 1
          test "$(grep -c '^        graphicsmagick \\' /tmp/Dockerfile.base.reference)" = 1
          test "$(grep -c '^        openssh \\' /tmp/Dockerfile.base.hardened || true)" = 0
          test "$(grep -c '^        graphicsmagick \\' /tmp/Dockerfile.base.hardened || true)" = 0
          test "$(grep -c '^    apk del apk-tools$' /tmp/Dockerfile.base.reference)" = 1
          test "$(grep -c '^    apk del apk-tools$' /tmp/Dockerfile.base.hardened)" = 1
          test "$(grep -c '^    apk del apk-tools$' /tmp/Dockerfile.base.solver || true)" = 0
          test "$(grep -c '^    true$' /tmp/Dockerfile.base.solver)" = 1

          docker build --platform linux/amd64 --no-cache --build-arg DHI_REF="$DHI_REF" \
            -f /tmp/Dockerfile.base.reference -t "$REFERENCE_BASE_IMAGE" /tmp/n8n-src
          docker build --platform linux/amd64 --no-cache --build-arg DHI_REF="$DHI_REF" \
            -f /tmp/Dockerfile.base.hardened -t "$HARDENED_BASE_IMAGE" /tmp/n8n-src
          docker build --platform linux/amd64 --no-cache --build-arg DHI_REF="$DHI_REF" \
            -f /tmp/Dockerfile.base.solver -t "$SOLVER_BASE_IMAGE" /tmp/n8n-src

          for image in "$REFERENCE_BASE_IMAGE" "$HARDENED_BASE_IMAGE" "$SOLVER_BASE_IMAGE"; do
            test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
            test "$(docker run --rm --entrypoint sh "$image" -c 'node --version')" = 'v26.7.0'
          done
          ! docker run --rm --entrypoint sh "$REFERENCE_BASE_IMAGE" -c 'command -v apk >/dev/null'
          ! docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'command -v apk >/dev/null'
          docker run --rm --entrypoint sh "$SOLVER_BASE_IMAGE" -c 'command -v apk >/dev/null'

      - name: Prove package closure with APK solver authority
        id: solver
        run: |
          set -euo pipefail
          normalize_db () {
            python - "$1" "$2" <<'PY'
          import sys
          raw=open(sys.argv[1],encoding='utf-8').read(); rows=[]
          for rec in raw.strip().split('\n\n'):
              p=v=None
              for line in rec.splitlines():
                  if line.startswith('P:'): p=line[2:]
                  elif line.startswith('V:'): v=line[2:]
              if p is not None and v is not None: rows.append((p,v))
          with open(sys.argv[2],'w',encoding='utf-8') as f:
              for p,v in sorted(rows): f.write(f'{p}\t{v}\n')
          PY
          }

          for spec in \
            "$REFERENCE_BASE_IMAGE reference" \
            "$HARDENED_BASE_IMAGE hardened"; do
            set -- $spec; image="$1"; prefix="$2"
            docker run --rm --entrypoint sh "$image" -c 'cat /etc/apk/repositories' > "$OUT/${prefix}-repositories.txt"
            docker run --rm --entrypoint sh "$image" -c 'cat /etc/apk/world' > "$OUT/${prefix}-world.txt"
            docker run --rm --entrypoint sh "$image" -c 'cat /lib/apk/db/installed' > "$OUT/${prefix}-installed.raw"
            normalize_db "$OUT/${prefix}-installed.raw" "$OUT/${prefix}-packages.tsv"
          done

          rm -f "$OUT/solver-transaction.log"
          docker run --name sitescore-apk-solver-${GITHUB_RUN_ID} --user 0 --entrypoint sh \
            -v "$GITHUB_WORKSPACE/$OUT:/evidence" "$SOLVER_BASE_IMAGE" -c '
              set -eu
              cat /etc/apk/repositories > /evidence/solver-pre-repositories.txt
              cat /etc/apk/world > /evidence/solver-pre-world.txt
              cat /lib/apk/db/installed > /evidence/solver-pre-installed.raw
              apk policy libcrypto3 libssl3 libexpat > /evidence/runtime-pin-policy.txt
              { echo "COMMAND=apk del openssh graphicsmagick"; apk del openssh graphicsmagick; \
                echo "COMMAND=apk add --no-cache --upgrade libcrypto3=3.5.8-r0 libssl3=3.5.8-r0 libexpat=2.8.4-r0"; \
                apk add --no-cache --upgrade 'libcrypto3=3.5.8-r0' 'libssl3=3.5.8-r0' 'libexpat=2.8.4-r0'; \
              } > /evidence/solver-transaction.log 2>&1
              cat /etc/apk/world > /evidence/solver-post-world.txt
              cat /lib/apk/db/installed > /evidence/solver-post-installed.raw
              { echo "COMMAND=apk del apk-tools"; apk del apk-tools; } >> /evidence/solver-transaction.log 2>&1
              cat /etc/apk/world > /evidence/solver-final-world.txt
              cat /lib/apk/db/installed > /evidence/solver-final-installed.raw
            '
          docker rm sitescore-apk-solver-${GITHUB_RUN_ID} >/dev/null

          normalize_db "$OUT/solver-pre-installed.raw" "$OUT/solver-pre-packages.tsv"
          normalize_db "$OUT/solver-post-installed.raw" "$OUT/solver-post-packages.tsv"
          normalize_db "$OUT/solver-final-installed.raw" "$OUT/solver-final-packages.tsv"

          cmp "$OUT/reference-repositories.txt" "$OUT/hardened-repositories.txt"
          cmp "$OUT/reference-repositories.txt" "$OUT/solver-pre-repositories.txt"
          grep -F 'openssh' "$OUT/solver-pre-world.txt"
          grep -F 'graphicsmagick' "$OUT/solver-pre-world.txt"
          ! grep -Fxq 'openssh' "$OUT/solver-post-world.txt"
          ! grep -Fxq 'graphicsmagick' "$OUT/solver-post-world.txt"
          grep -F 'COMMAND=apk del openssh graphicsmagick' "$OUT/solver-transaction.log"
          grep -F 'COMMAND=apk del apk-tools' "$OUT/solver-transaction.log"
          grep -F 'COMMAND=apk add --no-cache --upgrade libcrypto3=3.5.8-r0 libssl3=3.5.8-r0 libexpat=2.8.4-r0' "$OUT/solver-transaction.log"
          grep -F 'libcrypto3' "$OUT/runtime-pin-policy.txt"
          grep -F 'libssl3' "$OUT/runtime-pin-policy.txt"
          grep -F 'libexpat' "$OUT/runtime-pin-policy.txt"

          python - <<'PY'
          import json, os
          out=os.environ['OUT']
          def read(path):
              result={}
              for line in open(path,encoding='utf-8'):
                  line=line.rstrip('\n')
                  if not line: continue
                  p,v=line.split('\t',1); result[p]=v
              return result
          ref=read(out+'/reference-packages.tsv'); hard=read(out+'/hardened-packages.tsv')
          pre=read(out+'/solver-pre-packages.tsv'); post=read(out+'/solver-post-packages.tsv'); final=read(out+'/solver-final-packages.tsv')
          apk_version=pre.get('apk-tools')
          if not apk_version: raise SystemExit('solver pre-state missing apk-tools')
          pre_wo=dict(pre); pre_wo.pop('apk-tools')
          if pre_wo != ref: raise SystemExit('solver pre-state excluding apk-tools is not exact reference inventory')
          post_wo=dict(post); post_wo.pop('apk-tools',None)
          if post_wo != hard: raise SystemExit('solver post-state excluding apk-tools != hardened final inventory')
          if final != hard: raise SystemExit('solver final inventory != hardened final inventory')
          expected_pins={'libcrypto3':'3.5.8-r0','libssl3':'3.5.8-r0','libexpat':'2.8.4-r0'}
          changed={p:(ref[p],hard[p]) for p in sorted(set(ref)&set(hard)) if ref[p]!=hard[p]}
          if set(changed)!=set(expected_pins): raise SystemExit(f'unexpected package version delta: {changed}')
          for p,v in expected_pins.items():
              if hard.get(p)!=v: raise SystemExit(f'exact runtime pin missing: {p}={hard.get(p)} expected {v}')
          added=sorted(set(hard)-set(ref))
          allowed_world_pin_names=set(expected_pins)
          if added: raise SystemExit(f'unexpected added installed packages: {added}')
          removed=sorted(set(ref)-set(hard))
          if not {'openssh','graphicsmagick'} <= set(removed): raise SystemExit(f'authorized removal roots missing: {removed}')
          for forbidden in ('apk-tools','openssh','graphicsmagick'):
              if forbidden in hard: raise SystemExit(f'forbidden package remains: {forbidden}')
          required={'tini','tzdata','ca-certificates','librdkafka','libssl3','libcrypto3','libexpat','gcompat'}
          missing=sorted(required-set(hard))
          if missing: raise SystemExit(f'required retained packages missing: {missing}')
          if hard.get('gcompat')!='1.1.0-r4': raise SystemExit(f'unexpected libc6 provider: {hard.get("gcompat")}')
          world={x.strip() for x in open(out+'/hardened-world.txt') if x.strip()}
          if 'libc6-compat' not in world: raise SystemExit('APK world lost libc6-compat capability requirement')
          raw=open(out+'/hardened-installed.raw').read(); gcompat=None
          for rec in raw.strip().split('\n\n'):
              lines=rec.splitlines()
              if 'P:gcompat' in lines: gcompat=lines; break
          if not gcompat: raise SystemExit('gcompat installed record missing')
          provides=' '.join(x[2:] for x in gcompat if x.startswith('p:'))
          replaces=' '.join(x[2:] for x in gcompat if x.startswith('r:'))
          if 'libc6-compat=1.1.0-r4' not in provides or 'libc6-compat' not in replaces:
              raise SystemExit(f'gcompat does not prove libc6-compat relation: provides={provides} replaces={replaces}')
          ref_world={x.strip() for x in open(out+'/reference-world.txt') if x.strip()}
          added_world=sorted(world-ref_world); removed_world=sorted(ref_world-world)
          allowed_added={'libcrypto3=3.5.8-r0','libssl3=3.5.8-r0','libexpat=2.8.4-r0'}
          if set(added_world)-allowed_added: raise SystemExit(f'unexpected top-level world additions: {added_world}')
          if not {'openssh','graphicsmagick'} <= set(removed_world): raise SystemExit(f'world removal roots missing: {removed_world}')
          summary={
              'REFERENCE_BASE_BUILD':'PASS','HARDENED_BASE_BUILD':'PASS','SOLVER_EVIDENCE_BASE_BUILD':'PASS',
              'APK_SOLVER_TRANSACTION':'PASS','APK_SOLVER_FINAL_INVENTORY_EQUALS_HARDENED':'PASS',
              'APK_RUNTIME_PIN_DELTA':'PASS','LIBC6_COMPAT_CAPABILITY':'SATISFIED_BY_GCOMPAT_1.1.0-r4',
              'reference_count':len(ref),'hardened_count':len(hard),'solver_pre_count':len(pre),'solver_post_count':len(post),'solver_final_count':len(final),
              'removed_package_names':removed,'changed_versions':changed,'world_added':added_world,'world_removed':removed_world,
              'required_retained_versions':{p:hard[p] for p in sorted(required)},
          }
          json.dump(summary,open(out+'/apk-solver-proof.json','w'),indent=2,sort_keys=True)
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          test "$(docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'node --version')" = 'v26.7.0'
          echo 'pass=pass' >> "$GITHUB_OUTPUT"

      - name: Build exact stable n8n production closure with Node 26.7.0
        if: steps.solver.outputs.pass == 'pass'
