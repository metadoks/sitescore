            -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false \
            -p 127.0.0.1:15679:5678 "$PROBE_IMAGE")"
          trap 'docker logs "$cid" > "$OUT/reachability-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 120); do curl -fsS http://127.0.0.1:15679/healthz >/dev/null 2>&1 && break; sleep .5; done
          curl -fsS http://127.0.0.1:15679/healthz >/dev/null
          docker inspect "$cid" > "$OUT/reachability-container-inspect.json"
          ! docker inspect "$cid" --format '{{json .Config.Env}}' | grep -Eiq 'SMTP|N8N_EMAIL_MODE|N8N_SMTP'
          code="$(curl -sS -o "$OUT/node-types.json" -w '%{http_code}' http://127.0.0.1:15679/types/nodes.json || true)"
          test "$code" = 200
          ! grep -Fq 'n8n-nodes-base.emailSend' "$OUT/node-types.json"
          grep -Fq 'n8n-nodes-base.httpRequest' "$OUT/node-types.json"
          docker logs "$cid" > "$OUT/reachability-runtime.log" 2>&1 || true
          docker stop -t 5 "$cid" >/dev/null; trap - EXIT
          cat > "$OUT/nodemailer-risk-record-probe.md" <<'EOF'
          # Probe risk record — nodemailer residual
          Advisory: GHSA-p6gq-j5cr-w38f
          Candidate: nodemailer 8.0.10 in n8n 2.37.9
          Controls: no Send Email node in frozen workflows; emailSend excluded via NODES_EXCLUDE; no SMTP runtime configuration; n8n bound non-public; no Code/Execute Command/Read-Write File node used by frozen workflows.
          Status: PROBE EVIDENCE ONLY. Permanent risk record required only after Reviewer-approved promotion.
