            "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" > "$OUT/workflow-hashes.txt"

      - name: Generate pinned SPDX and raw Grype evidence
        if: steps.solver.outputs.pass == 'pass'
        run: |
          set -euo pipefail
          syft="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          grype="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          docker pull --platform linux/amd64 "$OFFICIAL_IMAGE" >/dev/null
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$syft" "$PROBE_IMAGE" -o spdx-json > "$OUT/n8n.spdx.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype" "$PROBE_IMAGE" -o json > "$OUT/n8n.grype.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype" "$OFFICIAL_IMAGE" -o json > "$OUT/official-2.37.9.grype.json"

      - name: Bind exact upstream OpenVEX and CISA KEV then reconcile
        if: steps.solver.outputs.pass == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o "$OUT/cisa-kev.json"
          python - <<'PY'
          import hashlib,json,os,urllib.request
          out=os.environ['OUT']; ctx=json.load(open(out+'/source-context.json')); token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/n8n-io/n8n/releases/{ctx["release_id"]}/assets',
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                       'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-apk-solver'})
          with urllib.request.urlopen(req,timeout=30) as r: assets=json.load(r)
          asset=next((a for a in assets if a.get('name')=='vex.openvex.json'),None)
          if not asset: raise SystemExit('exact stable release OpenVEX asset missing')
          json.dump(asset,open(out+'/openvex-asset-metadata.json','w'),indent=2,sort_keys=True)
          urllib.request.urlretrieve(asset['browser_download_url'],out+'/upstream.openvex.json')
          computed='sha256:'+hashlib.sha256(open(out+'/upstream.openvex.json','rb').read()).hexdigest()
          recorded=asset.get('digest'); verified=bool(recorded and recorded==computed)
          json.dump({'asset_id':asset.get('id'),'metadata_digest':recorded,'computed_digest':computed,'verified':verified},
                    open(out+'/openvex-asset-verification.json','w'),indent=2,sort_keys=True)
          if not verified: raise SystemExit('OpenVEX asset digest verification failed')
          ctx['selected_digest']=open(out+'/final-image-id.txt').read().strip()
          json.dump(ctx,open(out+'/release-context.json','w'),indent=2,sort_keys=True)
          PY
          git show d008f7b9689a936afd09ac55397c82647477b644:deploy/containers/n8n_openvex_reconcile.py > /tmp/n8n_openvex_reconcile.py
          python /tmp/n8n_openvex_reconcile.py "$OUT"

      - name: Evaluate hardened security gate
        if: steps.solver.outputs.pass == 'pass'
        id: security
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          out=os.environ['OUT']
          rows=json.load(open(out+'/n8n.vendor-openvex-reconciliation.json'))
          official=json.load(open(out+'/official-2.37.9.grype.json'))
          blocked=[r for r in rows if r['severity'] in {'CRITICAL','HIGH'} and r.get('final_disposition')!='VEX_NOT_AFFECTED_ALLOWED']
          critical=[r for r in blocked if r['severity']=='CRITICAL']; high=[r for r in blocked if r['severity']=='HIGH']
          kev=[r for r in rows if r.get('CISA_KEV_alias_matches')]
          nodemailer=[]; other=[]
          for r in high:
              ids={str(x).upper() for x in (r.get('scanner_alias_ids') or [])}; ids.add(str(r.get('scanner_advisory_id') or '').upper())
