          python - <<'PYFINAL'
          import json,os
          q=json.load(open(os.environ['OUT']+'/hardened-security-summary.json'))
          zero=['BLOCKING_CRITICAL','CISA_KEV','OS_HIGH_BLOCKING','IP_ADDRESS_HIGH_BLOCKING','BRACE_EXPANSION_HIGH_BLOCKING','FAST_URI_HIGH_BLOCKING','NEW_HIGH_INTRODUCED','OTHER_HIGH']
          bad={k:q.get(k) for k in zero if q.get(k)!=0}
