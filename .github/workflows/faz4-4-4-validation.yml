name: faz4-4-4-http-api-transport-validation

on:
  push:
    branches:
      - faz4/4.4-http-api-transport-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FAZ 4.4 scope audit
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -E '^(sitescore-core|sitescore-data|sitescore-pipeline|sitescore-benchmarks|sitescore-metrics|sitescore-spatial|sitescore-providers)/' || true)"
          test -z "$forbidden" || { echo "$forbidden"; exit 1; }
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(sitescore-app/src/sitescore_app/(transport.py|__init__.py)|sitescore-app/tests/test_http_api_transport_foundation.py|sitescore-app/docs/CHECKPOINT_4_4_HTTP_API_TRANSPORT_FOUNDATION.md|\.github/workflows/faz4-4-4-validation.yml)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          test -z "$(printf '%s\n' "$changed" | grep -E '/pyproject.toml$' || true)"
          ! grep -E 'from sitescore\.analyze|calculate_revenue|calculate_location_score|calculate_financial_metrics|calculate_decision|calculate_confidence|generate_analysis_fingerprint|current_model_versions' sitescore-app/src/sitescore_app/transport.py
          ! grep -E 'FastAPI|Starlette|Flask|Django|Pydantic|Uvicorn|Gunicorn|OpenAPI|CORS|rate_limit|Stripe|n8n' sitescore-app/src/sitescore_app/transport.py
          grep -F 'version = "0.1.0"' sitescore-app/pyproject.toml
          grep -F '"sitescore-data==0.1.0"' sitescore-app/pyproject.toml
          grep -F '"sitescore-pipeline==0.1.0"' sitescore-app/pyproject.toml
          grep -F '"sitescore-core==0.1.0"' sitescore-app/pyproject.toml
          echo 'FAZ4_4_SCOPE_AUDIT=PASS'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./sitescore-core
          python -m pip install -e ./sitescore-data
          python -m pip install -e ./sitescore-spatial
          python -m pip install -e ./sitescore-providers
          python -m pip install -e ./sitescore-metrics
          python -m pip install -e ./sitescore-benchmarks
          python -m pip install -e ./sitescore-pipeline
          python -m pip install -e ./sitescore-app
      - name: Test sitescore-app
        working-directory: sitescore-app
        run: python -m pytest -q
      - name: Test sitescore-pipeline
        working-directory: sitescore-pipeline
        run: python -m pytest -q
      - name: Test sitescore-benchmarks
        working-directory: sitescore-benchmarks
        run: python -m pytest -q
      - name: Test sitescore-metrics
        working-directory: sitescore-metrics
        run: python -m pytest -q
      - name: Test sitescore-spatial
        working-directory: sitescore-spatial
        run: python -m pytest -q
      - name: Test sitescore-providers
        working-directory: sitescore-providers
        run: python -m pytest -q
      - name: Test sitescore-data
        working-directory: sitescore-data
        run: python -m pytest -q
      - name: Test sitescore-core
        working-directory: sitescore-core
        run: python -m pytest -q
