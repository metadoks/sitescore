name: faz6-6-3-webhook-diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}"}
      - name: Prove owner setup before import enables production webhook registration
        run: |
          set -euo pipefail
          IMAGE=n8nio/n8n:2.33.4
          docker pull "$IMAGE" >/dev/null
          test "$(docker run --rm "$IMAGE" --version | tail -n1 | tr -d '\r')" = "2.33.4"
          VOL="n8n-webhook-diag-${GITHUB_RUN_ID}"
          CONTAINER="n8n-webhook-diag-${GITHUB_RUN_ID}"
          TMP="$(mktemp -d)"
          ENC=$(python -c 'import secrets; print(secrets.token_hex(32))')
          INGRESS=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          AUTO=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          OWNER_PASSWORD='SiteScoreCiOwner42!'
          echo "::add-mask::$ENC"; echo "::add-mask::$INGRESS"; echo "::add-mask::$AUTO"; echo "::add-mask::$OWNER_PASSWORD"
          cleanup(){ docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; if [[ -n "${FAKE_PID:-}" ]]; then kill "$FAKE_PID" >/dev/null 2>&1 || true; fi; docker volume rm "$VOL" >/dev/null 2>&1 || true; rm -rf "$TMP"; }
          trap cleanup EXIT
          docker volume create "$VOL" >/dev/null

          common_env=(
            -e N8N_ENCRYPTION_KEY="$ENC"
            -e N8N_HOST=0.0.0.0
            -e N8N_PORT=5678
            -e N8N_PROTOCOL=http
            -e N8N_WEBHOOK_URL=http://127.0.0.1:5678/
            -e N8N_SECURE_COOKIE=false
            -e N8N_DIAGNOSTICS_ENABLED=false
            -e N8N_VERSION_NOTIFICATIONS_ENABLED=false
            -e N8N_PERSONALIZATION_ENABLED=false
            -e N8N_BLOCK_ENV_ACCESS_IN_NODE=false
            -e COMMERCE_N8N_INGRESS_SECRET="$INGRESS"
            -e COMMERCE_AUTOMATION_API_KEY="$AUTO"
            -e SITESCORE_COMMERCE_AUTOMATION_BASE_URL=http://host.docker.internal:18080
            -e SITESCORE_N8N_POLL_SECONDS=2
            -e SITESCORE_N8N_MAX_POLLS=10
          )

          docker run -d --name "$CONTAINER" -p 5678:5678 "${common_env[@]}" -v "$VOL:/home/node/.n8n" "$IMAGE" >/dev/null
          for _ in $(seq 1 80); do if curl -fsS http://127.0.0.1:5678/healthz >/dev/null 2>&1; then break; fi; sleep .5; done
          curl -fsS http://127.0.0.1:5678/healthz >/dev/null
          SETUP_CODE=$(curl -sS -o "$TMP/owner.body" -w '%{http_code}' -H 'Content-Type: application/json' -X POST http://127.0.0.1:5678/rest/owner/setup -d '{"email":"sitescore-ci-owner@example.test","firstName":"SiteScore","lastName":"CI","password":"'"$OWNER_PASSWORD"'"}')
          echo "OWNER_SETUP_HTTP=$SETUP_CODE"
          test "$SETUP_CODE" = 200
          echo OWNER_SETUP=PASS
          docker stop "$CONTAINER" >/dev/null
          docker rm "$CONTAINER" >/dev/null

          docker run --rm -e N8N_ENCRYPTION_KEY="$ENC" -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_VERSION_NOTIFICATIONS_ENABLED=false -v "$VOL:/home/node/.n8n" -v "$PWD/automation/n8n/workflows:/workflows:ro" "$IMAGE" import:workflow --input=/workflows/sitescore-order-paid-v1.json
          docker run --rm -e N8N_ENCRYPTION_KEY="$ENC" -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_VERSION_NOTIFICATIONS_ENABLED=false -v "$VOL:/home/node/.n8n" "$IMAGE" publish:workflow --id=sitescoreOrderPaidV1

          FAKE_COMMERCE_AUTOMATION_KEY="$AUTO" FAKE_COMMERCE_LOG_FILE="$TMP/fake.jsonl" python automation/n8n/tests/fake_commerce_server.py >"$TMP/fake.log" 2>&1 & FAKE_PID=$!
          for _ in $(seq 1 30); do if curl -fsS http://127.0.0.1:18080/__stats >/dev/null 2>&1; then break; fi; sleep .2; done
          docker run -d --name "$CONTAINER" --add-host=host.docker.internal:host-gateway -p 5678:5678 "${common_env[@]}" -v "$VOL:/home/node/.n8n" "$IMAGE" >/dev/null
          for _ in $(seq 1 80); do if curl -fsS http://127.0.0.1:5678/healthz >/dev/null 2>&1; then break; fi; sleep .5; done
          curl -fsS http://127.0.0.1:5678/healthz >/dev/null
          sleep 2
          echo '--- STARTUP ACTIVATION LOGS ---'
          docker logs "$CONTAINER" 2>&1 | grep -Ei 'workflow|webhook|activat|publish|trigger|error|warn' | tail -n 300 || true

          URL=http://127.0.0.1:5678/webhook/sitescore-order-paid-v1
          DELIVERY=00000000-0000-4000-8000-000000000001
          PAYLOAD='{"event_id":"10000000-0000-4000-8000-000000000001","event_type":"order.paid.v1","order_id":"'"$DELIVERY"'","occurred_at":"2026-08-19T15:30:00Z"}'
          CODE=$(curl -sS -o "$TMP/body" -w '%{http_code}' -H 'Content-Type: application/json' -H "Authorization: Bearer $INGRESS" -X POST "$URL" -d "$PAYLOAD")
          echo "VALID_WEBHOOK_HTTP=$CODE"
          cat "$TMP/body"; echo
          test "$CODE" = 202
          sleep 1
          curl -fsS http://127.0.0.1:18080/__stats > "$TMP/stats.json"
          python - "$TMP/stats.json" "$DELIVERY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); order=sys.argv[2]
          r=[x for x in d['requests'] if order in x['path']]
          assert r and r[0]['method']=='GET',r
          assert all(x['auth_valid'] for x in r),r
          assert not [x for x in r if x['method']=='POST'],r
          print('CONFIGURED_INSTANCE_WEBHOOK=PASS')
          PY
