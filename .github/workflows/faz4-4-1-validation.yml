name: faz4-4-1-category-aggregation-validation

on:
  push:
    branches:
      - faz4/4.1-category-aggregation-authority

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FAZ 4.1 scope audit
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -E '^(sitescore-core|sitescore-data|sitescore-pipeline|sitescore-benchmarks|sitescore-metrics|sitescore-spatial|sitescore-providers)/' || true)"
          if [ -n "$forbidden" ]; then
            echo "Forbidden frozen-package changes detected:"
            printf '%s\n' "$forbidden"
            exit 1
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(sitescore-app/src/sitescore_app/aggregation.py|sitescore-app/src/sitescore_app/__init__.py|sitescore-app/pyproject.toml|sitescore-app/tests/.*|sitescore-app/docs/CHECKPOINT_4_1_CATEGORY_AGGREGATION_AUTHORITY.md|\.github/workflows/faz4-4-1-validation.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected FAZ 4.1 paths detected:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          metadata="$(printf '%s\n' "$changed" | grep -E '/pyproject.toml$' || true)"
          if [ "$metadata" != "sitescore-app/pyproject.toml" ]; then
            echo "Only sitescore-app/pyproject.toml may change dependency metadata."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import tomllib
          data = tomllib.loads(Path('sitescore-app/pyproject.toml').read_text())
          project = data['project']
          assert project['version'] == '0.1.0'
          assert project['dependencies'] == [
              'sitescore-data==0.1.0',
              'sitescore-pipeline==0.1.0',
              'sitescore-core==0.1.0',
          ]
          PY
          echo "FAZ4_1_SCOPE_AUDIT=PASS"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./sitescore-core
          python -m pip install -e ./sitescore-data
          python -m pip install -e ./sitescore-spatial
          python -m pip install -e ./sitescore-providers
          python -m pip install -e ./sitescore-metrics
          python -m pip install -e ./sitescore-benchmarks
          python -m pip install -e ./sitescore-pipeline
          python -m pip install -e ./sitescore-app
      - name: Test sitescore-app
        working-directory: sitescore-app
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/sitescore-app.log
      - name: Test sitescore-pipeline
        working-directory: sitescore-pipeline
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/sitescore-pipeline.log
      - name: Test sitescore-benchmarks
        working-directory: sitescore-benchmarks
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/sitescore-benchmarks.log
      - name: Test sitescore-metrics
        working-directory: sitescore-metrics
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/sitescore-metrics.log
      - name: Test sitescore-spatial
        working-directory: sitescore-spatial
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/sitescore-spatial.log
      - name: Test sitescore-providers
        working-directory: sitescore-providers
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/sitescore-providers.log
      - name: Test sitescore-data
        working-directory: sitescore-data
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/sitescore-data.log
      - name: Test sitescore-core
        working-directory: sitescore-core
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/sitescore-core.log
      - name: Compact exact pass-count evidence
        run: |
          for package in sitescore-app sitescore-pipeline sitescore-benchmarks sitescore-metrics sitescore-spatial sitescore-providers sitescore-data sitescore-core; do
            summary="$(grep -E '[0-9]+ passed in ' "/tmp/${package}.log" | tail -n 1)"
            if [ -z "$summary" ]; then
              echo "Missing pytest summary for $package"
              exit 1
            fi
            echo "PASS_COUNT ${package}: ${summary}"
          done
