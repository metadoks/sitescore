name: faz5-5-5-exact-head-validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitescore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sitescore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SITESCORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sitescore
      SITESCORE_BROKER_URL: redis://127.0.0.1:6379/0
      SITESCORE_API_KEY_PEPPER: test-only-ci-pepper-0123456789-abcdefghijklmnopqrstuvwxyz
      SITESCORE_ANALYSIS_DEADLINE_SECONDS: "900"
      SITESCORE_WORKER_SOFT_LIMIT_SECONDS: "840"
      SITESCORE_WORKER_HARD_LIMIT_SECONDS: "900"
      SITESCORE_REPORT_STORAGE_BUCKET: sitescore-reports
      SITESCORE_REPORT_STORAGE_REGION: us-east-1
      SITESCORE_REPORT_STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      SITESCORE_REPORT_MAX_BYTES: "10485760"
      AWS_EC2_METADATA_DISABLED: "true"
      MPLCONFIGDIR: /tmp/sitescore-mplconfig

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head checkout
        run: |
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED='${{ github.event.pull_request.head.sha }}'
          echo "ACTUAL_HEAD=$ACTUAL"
          echo "EXPECTED_HEAD=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Start pinned private MinIO integration service
        run: |
          ACCESS=$(python -c 'import secrets; print("ci" + secrets.token_hex(8))')
          SECRET=$(python -c 'import secrets; print(secrets.token_hex(24))')
          echo "::add-mask::$ACCESS"
          echo "::add-mask::$SECRET"
          echo "AWS_ACCESS_KEY_ID=$ACCESS" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"
          docker run -d --name sitescore-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$ACCESS" \
            -e MINIO_ROOT_PASSWORD="$SECRET" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --address :9000
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null
          docker exec sitescore-minio minio --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact local runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "shapely==2.1.2" "pyproj==3.7.2"
          for pkg in sitescore-core sitescore-data sitescore-providers sitescore-spatial sitescore-metrics sitescore-benchmarks sitescore-pipeline sitescore-app; do
            python -m pip install -e "$pkg" --no-deps
          done
          python -m pip install -e "sitescore-report[dev]"
          python -m pip install -e "sitescore-api[dev]"

      - name: Verify exact dependency versions
        run: |
          python - <<'PY'
          import importlib.metadata
          import sys
          import alembic, boto3, celery, fastapi, httpx, matplotlib, openai, psycopg, pydantic, pyproj, pytest, redis, shapely, sqlalchemy, weasyprint
          versions = {
              "Python": ".".join(map(str, sys.version_info[:3])),
              "FastAPI": fastapi.__version__,
              "Pydantic": pydantic.__version__,
              "SQLAlchemy": sqlalchemy.__version__,
              "Alembic": alembic.__version__,
              "psycopg": psycopg.__version__,
              "Celery": celery.__version__,
              "redis": redis.__version__,
              "HTTPX": httpx.__version__,
              "pytest": pytest.__version__,
              "Shapely": shapely.__version__,
              "pyproj": pyproj.__version__,
              "OpenAI": openai.__version__,
              "Jinja2": importlib.metadata.version("Jinja2"),
              "matplotlib": matplotlib.__version__,
              "weasyprint": weasyprint.__version__,
              "pypdf": importlib.metadata.version("pypdf"),
              "boto3": boto3.__version__,
              "sitescore-core": importlib.metadata.version("sitescore-core"),
              "sitescore-app": importlib.metadata.version("sitescore-app"),
              "sitescore-api": importlib.metadata.version("sitescore-api"),
              "sitescore-report": importlib.metadata.version("sitescore-report"),
          }
          expected = {
              "FastAPI": "0.140.0", "Pydantic": "2.13.4", "SQLAlchemy": "2.0.51",
              "Alembic": "1.18.5", "psycopg": "3.3.4", "Celery": "5.6.3",
              "redis": "7.4.1", "HTTPX": "0.28.1", "pytest": "8.4.2",
              "Shapely": "2.1.2", "pyproj": "3.7.2", "OpenAI": "3.2.0",
              "Jinja2": "3.1.6", "matplotlib": "3.11.1", "weasyprint": "69.0",
              "pypdf": "6.14.2", "boto3": "1.43.55", "sitescore-core": "0.1.0",
              "sitescore-app": "0.1.0", "sitescore-api": "0.3.0", "sitescore-report": "0.3.0",
          }
          for key, value in versions.items(): print(f"{key}={value}")
          for key, value in expected.items(): assert versions[key] == value, (key, versions[key], value)
          PY

      - name: Upgrade PostgreSQL through FAZ 5.5 migration
        working-directory: sitescore-api
        run: alembic upgrade head

      - name: Prove real S3-compatible private object storage
        run: |
          python - <<'PY'
          import boto3, os
          from sitescore_api.report_artifacts import S3CompatibleObjectStorage
          endpoint = os.environ["SITESCORE_REPORT_STORAGE_ENDPOINT_URL"]
          bucket = os.environ["SITESCORE_REPORT_STORAGE_BUCKET"]
          region = os.environ["SITESCORE_REPORT_STORAGE_REGION"]
          client = boto3.client("s3", endpoint_url=endpoint, region_name=region)
          client.create_bucket(Bucket=bucket)
          storage = S3CompatibleObjectStorage(bucket=bucket, region=region, endpoint_url=endpoint)
          payload = b"%PDF-1.7\nminio integration\n%%EOF\n"
          key = "integration/private/report.pdf"
          storage.put(key, payload, content_type="application/pdf")
          head = storage.head(key)
          assert head.byte_length == len(payload)
          assert head.content_type == "application/pdf"
          assert storage.get(key, max_bytes=1024) == payload
          acl = client.get_object_acl(Bucket=bucket, Key=key)
          assert not any("AllUsers" in str(grant) or "AuthenticatedUsers" in str(grant) for grant in acl.get("Grants", []))
          storage.delete(key)
          try:
              storage.head(key)
          except Exception:
              pass
          else:
              raise AssertionError("deleted object must not remain readable")
          print("MINIO_S3_PUT_HEAD_GET_DELETE=PASS")
          PY

      - name: Run locked sitescore-report suite
        working-directory: sitescore-report
        run: python -m pytest -o addopts='' -q

      - name: Run sitescore-api 5.5 suite
        working-directory: sitescore-api
        run: python -m pytest -o addopts='' -q

      - name: Re-prove Redis broker and Celery worker transport
        run: |
          python -m celery -A sitescore_api.tasks:celery_app worker --loglevel=INFO --concurrency=1 --hostname=faz55exact@%h > /tmp/faz55-celery.log 2>&1 &
          echo $! > /tmp/faz55-celery.pid
          ready=0
          for i in $(seq 1 20); do
            if python -m celery -A sitescore_api.tasks:celery_app inspect ping -t 1 > /tmp/faz55-ping.log 2>&1; then ready=1; break; fi
            sleep 1
          done
          cat /tmp/faz55-ping.log; test "$ready" = "1"
          python - <<'PY'
          from uuid import uuid4
          from sitescore_api.runtime import build_runtime
          runtime = build_runtime()
          assert runtime.celery_app.conf.task_ignore_result is True
          assert runtime.celery_app.backend.__class__.__name__ == "DisabledBackend"
          runtime.celery_app.send_task("sitescore_api.reconcile_timeouts", task_id=str(uuid4()))
          PY
          sleep 3
          grep -q "sitescore_api.reconcile_timeouts" /tmp/faz55-celery.log
          kill "$(cat /tmp/faz55-celery.pid)" || true
          cat /tmp/faz55-celery.log

      - name: Frozen sitescore-app regression
        working-directory: sitescore-app
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-pipeline regression
        working-directory: sitescore-pipeline
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-benchmarks regression
        working-directory: sitescore-benchmarks
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-metrics regression
        working-directory: sitescore-metrics
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-spatial regression
        working-directory: sitescore-spatial
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-providers regression
        working-directory: sitescore-providers
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-data regression
        working-directory: sitescore-data
        run: python -m pytest -o addopts='' -q
      - name: Frozen sitescore-core regression
        working-directory: sitescore-core
        run: python -m pytest -o addopts='' -q
