name: faz7-7-1-n8n-base-digest-probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve current official same-Node-line base digest
        run: |
          set -euo pipefail
          current="$(docker buildx imagetools inspect n8nio/base:26.5.1 | awk '/^Digest:/ {print $2; exit}')"
          pinned='sha256:1b0bca5c94bbd04ad2120b9e9892a8bc717a1d88efa76fefe452c59bdc611d25'
          printf 'PINNED_26_5_1_BASE=%s\nCURRENT_26_5_1_BASE=%s\n' "$pinned" "$current"
          if [ "$current" = "$pinned" ]; then
            echo 'SAME_NODE_LINE_NEWER_BASE_AVAILABLE=NO'
          else
            echo 'SAME_NODE_LINE_NEWER_BASE_AVAILABLE=YES'
          fi
