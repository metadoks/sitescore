name: faz7-7-1-n8n-hardened-final-probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UPSTREAM_STABLE_VERSION: '2.37.7'
      UPSTREAM_STABLE_COMMIT: '2a4ca7868dc75edca4c575d6507021e1e6b0ec90'
      UPSTREAM_STABLE_TREE: '40ff00093dbc474f82b4a133eb8ca51a3c76734a'
      OFFICIAL_IMAGE: 'n8nio/n8n@sha256:869500232f49760d6a422d320d3ead3cb28ee93a00e6f67c89eb3d6b81acd6be'
      UPSTREAM_MASTER_COMMIT: 'efd3ec9e260ef9ac7d9cbc134952590bedd33acb'
      MASTER_DOCKERFILE_BLOB: 'f72e1a3f3aae40319e58989e5fc2a71e687a1b59'
      MASTER_BASE_DOCKERFILE_BLOB: '1f2a82aa961a389750d774c88735fb11c5ae7c45'
      MASTER_BASE_WORKFLOW_BLOB: 'dd9e3badecd4fc1c5e4a51668824f5f214becaae'
      DHI_REF: 'dhi.io/node:26.7.0-alpine3.24-dev@sha256:4b494d89fb26c950ce97865acf45b480dc7a6868fdc2b81c2d66599702eeac3f'
      BUILDER_IMAGE: 'node:26.7.0-alpine3.24@sha256:aadf416b2cdce311a8811ba3f0608a61b77dbf997500e2eafe781b51f6a0b019'
      UPSTREAM_RUNTIME_IMAGE: 'n8nio/base:26.7.0@sha256:33687300c4e94dc00f42ec79ae15082ae07330ecd82ae1167125905b65908ff8'
      HARDENED_BASE_IMAGE: 'sitescore-n8n-base-hardened:26.7.0'
      PROBE_IMAGE: 'sitescore-n8n-hardened:probe'
      OUT: 'deploy/containers/artifacts/n8n-hardened-final-probe'

    steps:
      - name: Checkout SiteScore exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Free runner disk for upstream source rebuild
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # upstream pinned v2.0.2
        with:
          install: false
          version: 11.22.0

      - name: Setup Node 26.7.0
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '26.7.0'

      - name: Re-enumerate stable release and bind frozen workflow bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python - <<'PY'
          import json, os, re, urllib.request
          from urllib.parse import urlencode
          token=os.environ['GH_TOKEN']; releases=[]
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-hardened-final'}
          for page in range(1,11):
              req=urllib.request.Request('https://api.github.com/repos/n8n-io/n8n/releases?'+urlencode({'per_page':100,'page':page}),headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: batch=json.load(r)
              if not batch: break
              for rel in batch:
                  if rel.get('draft') or rel.get('prerelease'): continue
                  m=re.fullmatch(r'n8n@(\d+)\.(\d+)\.(\d+)',str(rel.get('tag_name','')))
                  if m and int(m.group(1)) == 2: releases.append((tuple(map(int,m.groups())),rel))
              if len(batch)<100: break
          if not releases: raise SystemExit('no official stable 2.x release found')
          version_tuple,rel=max(releases,key=lambda x:x[0]); version='.'.join(map(str,version_tuple))
          if version != os.environ['UPSTREAM_STABLE_VERSION']:
              raise SystemExit(f'new official stable {version} exists; stop and validate official image first')
          ctx={'selected_version':version,'release_tag':rel['tag_name'],'release_id':rel['id'],'published_at':rel.get('published_at'),
               'stable_source_commit':os.environ['UPSTREAM_STABLE_COMMIT'],'stable_source_tree':os.environ['UPSTREAM_STABLE_TREE'],
               'official_image':os.environ['OFFICIAL_IMAGE'],'master_build_commit':os.environ['UPSTREAM_MASTER_COMMIT'],
               'builder_image':os.environ['BUILDER_IMAGE'],'upstream_runtime_image':os.environ['UPSTREAM_RUNTIME_IMAGE'],
               'dhi_ref':os.environ['DHI_REF']}
          json.dump(ctx,open(os.environ['OUT']+'/source-context.json','w'),indent=2,sort_keys=True)
          print(json.dumps(ctx,indent=2,sort_keys=True))
          PY
          test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = '02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1'
          test "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" = 'f5409839cec1fa86b6af20f6cd242e71d52dceec8dcdb6cf35fd0b237e4a489c'

      - name: Bind exact upstream source and build recipes
        run: |
          set -euo pipefail
          rm -rf /tmp/n8n-src
          git clone --filter=blob:none --no-checkout https://github.com/n8n-io/n8n.git /tmp/n8n-src
          git -C /tmp/n8n-src fetch --depth=1 origin "$UPSTREAM_STABLE_COMMIT" "$UPSTREAM_MASTER_COMMIT"
          git -C /tmp/n8n-src checkout --detach "$UPSTREAM_STABLE_COMMIT"
          test "$(git -C /tmp/n8n-src rev-parse HEAD)" = "$UPSTREAM_STABLE_COMMIT"
          test "$(git -C /tmp/n8n-src rev-parse HEAD^{tree})" = "$UPSTREAM_STABLE_TREE"
          test "$(git -C /tmp/n8n-src rev-parse "$UPSTREAM_MASTER_COMMIT:docker/images/n8n/Dockerfile")" = "$MASTER_DOCKERFILE_BLOB"
          test "$(git -C /tmp/n8n-src rev-parse "$UPSTREAM_MASTER_COMMIT:docker/images/n8n-base/Dockerfile")" = "$MASTER_BASE_DOCKERFILE_BLOB"
          test "$(git -C /tmp/n8n-src rev-parse "$UPSTREAM_MASTER_COMMIT:.github/workflows/build-base-image.yml")" = "$MASTER_BASE_WORKFLOW_BLOB"
          git -C /tmp/n8n-src show "$UPSTREAM_MASTER_COMMIT:docker/images/n8n-base/Dockerfile" > "$GITHUB_WORKSPACE/$OUT/upstream-base-Dockerfile"
          git -C /tmp/n8n-src show "$UPSTREAM_MASTER_COMMIT:.github/workflows/build-base-image.yml" > "$GITHUB_WORKSPACE/$OUT/upstream-build-base-image.yml"
          grep -F "node_version: '26.7.0'" "$GITHUB_WORKSPACE/$OUT/upstream-build-base-image.yml"
          grep -F "$DHI_REF" "$GITHUB_WORKSPACE/$OUT/upstream-build-base-image.yml"
          grep -F 'ip-address@10: 10.3.1' /tmp/n8n-src/pnpm-workspace.yaml
          grep -F 'brace-expansion@5: 5.0.9' /tmp/n8n-src/pnpm-workspace.yaml
          cp /tmp/n8n-src/docker/images/n8n/Dockerfile "$OUT/stable-Dockerfile"
          git -C /tmp/n8n-src show "$UPSTREAM_MASTER_COMMIT:docker/images/n8n/Dockerfile" > /tmp/n8n-src/docker/images/n8n/Dockerfile
          cp /tmp/n8n-src/docker/images/n8n/Dockerfile "$OUT/master-Dockerfile-used"
          git -C /tmp/n8n-src diff -- docker/images/n8n/Dockerfile > "$OUT/build-metadata-delta.patch"
          test "$(git -C /tmp/n8n-src diff --name-only)" = 'docker/images/n8n/Dockerfile'
          grep -F "$BUILDER_IMAGE" /tmp/n8n-src/docker/images/n8n/Dockerfile
          grep -F "$UPSTREAM_RUNTIME_IMAGE" /tmp/n8n-src/docker/images/n8n/Dockerfile

      - name: Build hardened upstream-faithful runtime base and prove libc6 capability
        id: base
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import difflib, json, os
          src=Path(os.environ['OUT']+'/upstream-base-Dockerfile').read_text(); hard=src
          for line in ('        openssh \\\n','        graphicsmagick \\\n'):
              if hard.count(line) != 1: raise SystemExit(f'expected exact authorized omission line once: {line!r}')
              hard=hard.replace(line,'')
          Path('/tmp/Dockerfile.base.hardened').write_text(hard)
          Path(os.environ['OUT']+'/base-hardening.patch').write_text(''.join(difflib.unified_diff(src.splitlines(True),hard.splitlines(True),fromfile='upstream-base-Dockerfile',tofile='hardened-base-Dockerfile')))
          json.dump({'deliberate_top_level_omissions':['openssh','graphicsmagick']},open(os.environ['OUT']+'/base-hardening.json','w'),indent=2)
          PY
          test "$(grep -c '^        openssh \\' /tmp/Dockerfile.base.hardened || true)" = 0
          test "$(grep -c '^        graphicsmagick \\' /tmp/Dockerfile.base.hardened || true)" = 0
          test "$(grep -c '^    apk del apk-tools$' /tmp/Dockerfile.base.hardened)" = 1
          docker build --platform linux/amd64 --no-cache --build-arg DHI_REF="$DHI_REF" -f /tmp/Dockerfile.base.hardened -t "$HARDENED_BASE_IMAGE" /tmp/n8n-src
          test "$(docker image inspect "$HARDENED_BASE_IMAGE" --format '{{.Architecture}}')" = amd64
          test "$(docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'node --version')" = 'v26.7.0'
          ! docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'command -v apk >/dev/null'
          docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'cat /etc/apk/world' > "$OUT/hardened-world.txt"
          docker run --rm --entrypoint sh "$HARDENED_BASE_IMAGE" -c 'cat /lib/apk/db/installed' > "$OUT/hardened-installed.raw"
          python - <<'PY'
          import json,os
          out=os.environ['OUT']; raw=open(out+'/hardened-installed.raw').read(); world={x.strip() for x in open(out+'/hardened-world.txt') if x.strip()}
          recs=[]
          for rec in raw.strip().split('\n\n'):
              d={}
              for line in rec.splitlines():
                  if len(line)>2 and line[1]==':': d.setdefault(line[0],[]).append(line[2:])
              if d.get('P'): recs.append(d)
          byname={d['P'][0]:d for d in recs}; required={'tini','tzdata','ca-certificates','librdkafka','libssl3','libcrypto3','libexpat'}
          missing=sorted(required-set(byname))
          if missing: raise SystemExit(f'required retained packages missing: {missing}')
          for forbidden in ('apk-tools','openssh','graphicsmagick'):
              if forbidden in byname: raise SystemExit(f'forbidden package remains: {forbidden}')
          if 'libc6-compat' not in world: raise SystemExit('APK world no longer requires libc6-compat capability')
          g=byname.get('gcompat')
          if not g or g.get('V',[''])[0] != '1.1.0-r4': raise SystemExit(f'expected gcompat==1.1.0-r4 provider, got {g}')
          provides=' '.join(g.get('p',[])); replaces=' '.join(g.get('r',[]))
          if 'libc6-compat=1.1.0-r4' not in provides: raise SystemExit(f'gcompat does not provide exact libc6-compat capability: {provides}')
          if 'libc6-compat' not in replaces: raise SystemExit(f'gcompat provider record missing libc6-compat relation: {replaces}')
          summary={'LIBC6_COMPAT_CAPABILITY':'SATISFIED','LIBC6_COMPAT_PROVIDER':'gcompat==1.1.0-r4',
                   'LIBC6_COMPAT_WORLD_REQUIREMENT':'libc6-compat','required_retained_versions':{p:byname[p]['V'][0] for p in sorted(required)},
                   'forbidden_absent':['apk-tools','openssh','graphicsmagick']}
          json.dump(summary,open(out+'/libc6-provider-proof.json','w'),indent=2,sort_keys=True); print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          echo 'pass=pass' >> "$GITHUB_OUTPUT"

      - name: Build exact stable n8n production closure
        if: steps.base.outputs.pass == 'pass'
        working-directory: /tmp/n8n-src
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=7168'
          RELEASE: '2.37.7'
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v26.7.0'
          test "$(pnpm --version)" = '11.22.0'
          pnpm build:n8n
          test -d compiled
          grep -R '"version": "10.3.1"' compiled/node_modules/.pnpm/ip-address@10.3.1*/node_modules/ip-address/package.json
          grep -R '"version": "5.0.9"' compiled/node_modules/.pnpm/brace-expansion@5.0.9*/node_modules/brace-expansion/package.json
          grep -R '"version": "8.0.10"' compiled/node_modules/.pnpm/nodemailer@8.0.10*/node_modules/nodemailer/package.json

      - name: Build final hardened n8n image
        if: steps.base.outputs.pass == 'pass'
        working-directory: /tmp/n8n-src
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg BUILDER_IMAGE="$BUILDER_IMAGE" --build-arg RUNTIME_IMAGE="$HARDENED_BASE_IMAGE" --build-arg N8N_VERSION="$UPSTREAM_STABLE_VERSION" --build-arg N8N_RELEASE_TYPE=stable -f docker/images/n8n/Dockerfile -t sitescore-n8n-hardened-core:probe .
          cat > /tmp/Dockerfile.n8n-contract <<'EOF'
          FROM sitescore-n8n-hardened-core:probe
          ENV NODES_EXCLUDE='["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.emailSend"]'
          EOF
          docker build --network=none --platform linux/amd64 -f /tmp/Dockerfile.n8n-contract -t "$PROBE_IMAGE" /tmp
          test "$(docker image inspect "$PROBE_IMAGE" --format '{{.Architecture}}')" = amd64
          docker image inspect "$PROBE_IMAGE" > "$GITHUB_WORKSPACE/$OUT/final-image-inspect.json"
          docker image inspect "$PROBE_IMAGE" --format '{{.Id}}' > "$GITHUB_WORKSPACE/$OUT/final-image-id.txt"
          docker run --rm --entrypoint sh "$PROBE_IMAGE" -c 'cat /etc/apk/world; cat /lib/apk/db/installed' > "$GITHUB_WORKSPACE/$OUT/final-package-state.txt"

      - name: Prove non-root runtime startup and frozen workflow imports
        if: steps.base.outputs.pass == 'pass'
        run: |
          set -euo pipefail
          user="$(docker image inspect "$PROBE_IMAGE" --format '{{.Config.User}}')"; test -n "$user" && test "$user" != root && test "$user" != 0
          version="$(docker run --rm "$PROBE_IMAGE" n8n --version | tr -d '\r' | tail -n1)"; test "$version" = "$UPSTREAM_STABLE_VERSION"
          printf 'ARCH=amd64\nUSER=%s\nVERSION=%s\nIMAGE_ID=%s\n' "$user" "$version" "$(cat "$OUT/final-image-id.txt")" > "$OUT/runtime-identity.txt"
          cid="$(docker run -d --rm --tmpfs /tmp:rw,nosuid,nodev -e N8N_USER_FOLDER=/tmp/n8n -e N8N_ENCRYPTION_KEY=ci-only-hardened-probe-encryption-key-000000000000 -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false -p 127.0.0.1:15678:5678 "$PROBE_IMAGE")"
          trap 'docker logs "$cid" > "$OUT/startup-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 120); do curl -fsS http://127.0.0.1:15678/healthz >/dev/null 2>&1 && break; sleep .5; done
          curl -fsS http://127.0.0.1:15678/healthz >/dev/null; docker logs "$cid" > "$OUT/startup-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null; trap - EXIT
          vol="sitescore-hardened-import-${GITHUB_RUN_ID}"; docker volume create "$vol" >/dev/null
          trap 'docker volume rm -f "$vol" >/dev/null 2>&1 || true' EXIT
          key='ci-only-hardened-probe-encryption-key-000000000000'
          for wf in sitescore-order-paid-v1.json sitescore-recovery-schedule-v1.json; do
            docker run --rm -e N8N_ENCRYPTION_KEY="$key" -e N8N_DIAGNOSTICS_ENABLED=false -v "$vol:/home/node/.n8n" -v "$GITHUB_WORKSPACE/automation/n8n/workflows:/workflows:ro" "$PROBE_IMAGE" import:workflow --input="/workflows/$wf"
          done
          docker volume rm -f "$vol" >/dev/null; trap - EXIT

      - name: Generate pinned SPDX and raw Grype evidence
        if: steps.base.outputs.pass == 'pass'
        run: |
          set -euo pipefail
          syft="$(awk -F= '$1=="SYFT_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          grype="$(awk -F= '$1=="GRYPE_IMAGE" {print $2}' deploy/containers/supply-chain-tools.lock)"
          docker pull --platform linux/amd64 "$OFFICIAL_IMAGE" >/dev/null
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$syft" "$PROBE_IMAGE" -o spdx-json > "$OUT/n8n.spdx.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype" "$PROBE_IMAGE" -o json > "$OUT/n8n.grype.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$grype" "$OFFICIAL_IMAGE" -o json > "$OUT/official-2.37.7.grype.json"

      - name: Bind exact upstream OpenVEX and CISA KEV then reconcile
        if: steps.base.outputs.pass == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o "$OUT/cisa-kev.json"
          python - <<'PY'
          import hashlib,json,os,urllib.request
          out=os.environ['OUT']; ctx=json.load(open(out+'/source-context.json')); token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/n8n-io/n8n/releases/{ctx["release_id"]}/assets',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sitescore-faz7-hardened-final'})
          with urllib.request.urlopen(req,timeout=30) as r: assets=json.load(r)
          asset=next((a for a in assets if a.get('name')=='vex.openvex.json'),None)
          if not asset: raise SystemExit('exact stable release OpenVEX asset missing')
          json.dump(asset,open(out+'/openvex-asset-metadata.json','w'),indent=2,sort_keys=True)
          urllib.request.urlretrieve(asset['browser_download_url'],out+'/upstream.openvex.json')
          computed='sha256:'+hashlib.sha256(open(out+'/upstream.openvex.json','rb').read()).hexdigest(); recorded=asset.get('digest'); verified=bool(recorded and recorded==computed)
          json.dump({'asset_id':asset.get('id'),'metadata_digest':recorded,'computed_digest':computed,'verified':verified},open(out+'/openvex-asset-verification.json','w'),indent=2,sort_keys=True)
          if not verified: raise SystemExit('OpenVEX asset digest verification failed')
          ctx['selected_digest']=open(out+'/final-image-id.txt').read().strip(); json.dump(ctx,open(out+'/release-context.json','w'),indent=2,sort_keys=True)
          PY
          git show d008f7b9689a936afd09ac55397c82647477b644:deploy/containers/n8n_openvex_reconcile.py > /tmp/n8n_openvex_reconcile.py
          python /tmp/n8n_openvex_reconcile.py "$OUT"

      - name: Evaluate hardened security gate
        if: steps.base.outputs.pass == 'pass'
        id: security
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          out=os.environ['OUT']; rows=json.load(open(out+'/n8n.vendor-openvex-reconciliation.json')); official=json.load(open(out+'/official-2.37.7.grype.json'))
          blocked=[r for r in rows if r['severity'] in {'CRITICAL','HIGH'} and r.get('final_disposition')!='VEX_NOT_AFFECTED_ALLOWED']
          critical=[r for r in blocked if r['severity']=='CRITICAL']; high=[r for r in blocked if r['severity']=='HIGH']; kev=[r for r in rows if r.get('CISA_KEV_alias_matches')]
          nodemailer=[]; other=[]
          for r in high:
              ids={str(x).upper() for x in (r.get('scanner_alias_ids') or [])}; ids.add(str(r.get('scanner_advisory_id') or '').upper())
              if r.get('package_name')=='nodemailer' and r.get('installed_version')=='8.0.10' and 'GHSA-P6GQ-J5CR-W38F' in ids: nodemailer.append(r)
              else: other.append(r)
          official_high=set()
          for m in official.get('matches',[]):
              v=m.get('vulnerability') or {}; a=m.get('artifact') or {}
              if str(v.get('severity') or '').upper()=='HIGH': official_high.add((str(v.get('id')),str(a.get('name'))))
          new_high=[r for r in high if (str(r.get('scanner_advisory_id')),str(r.get('package_name'))) not in official_high]
          ip=[r for r in high if r.get('package_name')=='ip-address']; brace=[r for r in high if r.get('package_name')=='brace-expansion']; os_high=[r for r in high if r.get('package_type')=='apk']
          summary={'RAW_CRITICAL':sum(1 for r in rows if r['severity']=='CRITICAL'),'RAW_HIGH':sum(1 for r in rows if r['severity']=='HIGH'),
                   'BLOCKING_CRITICAL':len(critical),'BLOCKING_HIGH':len(high),'CISA_KEV':len(kev),'OS_HIGH_BLOCKING':len(os_high),
                   'IP_ADDRESS_HIGH_BLOCKING':len(ip),'BRACE_EXPANSION_HIGH_BLOCKING':len(brace),'NEW_HIGH_INTRODUCED':len(new_high),
                   'OTHER_HIGH':len(other),'NODEMAILER_EXCEPTION_CANDIDATES':len(nodemailer)}
          summary['PRELIMINARY_HARDENED_SECURITY_PASS']=(summary['BLOCKING_CRITICAL']==0 and summary['CISA_KEV']==0 and summary['OS_HIGH_BLOCKING']==0 and summary['IP_ADDRESS_HIGH_BLOCKING']==0 and summary['BRACE_EXPANSION_HIGH_BLOCKING']==0 and summary['NEW_HIGH_INTRODUCED']==0 and summary['OTHER_HIGH']==0 and summary['NODEMAILER_EXCEPTION_CANDIDATES']<=1)
          json.dump(summary,open(out+'/hardened-security-summary.json','w'),indent=2,sort_keys=True); json.dump(new_high,open(out+'/new-high-findings.json','w'),indent=2,sort_keys=True); print(json.dumps(summary,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('prelim='+('pass' if summary['PRELIMINARY_HARDENED_SECURITY_PASS'] else 'fail')+'\n')
          PY

      - name: Prove nodemailer reachability containment and runtime surface
        if: steps.security.outputs.prelim == 'pass'
        run: |
          set -euo pipefail
          ! grep -R -F 'n8n-nodes-base.emailSend' automation/n8n/workflows/*.json
          ! grep -R -F 'n8n-nodes-base.code' automation/n8n/workflows/*.json
          ! grep -R -F 'n8n-nodes-base.executeCommand' automation/n8n/workflows/*.json
          ! grep -R -F 'n8n-nodes-base.readWriteFile' automation/n8n/workflows/*.json
          envs="$(docker image inspect "$PROBE_IMAGE" --format '{{json .Config.Env}}')"; echo "$envs" > "$OUT/image-env.json"
          grep -F 'n8n-nodes-base.emailSend' "$OUT/image-env.json"; grep -F 'n8n-nodes-base.executeCommand' "$OUT/image-env.json"; grep -F 'n8n-nodes-base.localFileTrigger' "$OUT/image-env.json"
          ! grep -Eiq 'SMTP|N8N_EMAIL_MODE|N8N_SMTP' automation/n8n/runtime/docker-compose.yml
          grep -F '127.0.0.1:5678:5678' automation/n8n/runtime/docker-compose.yml
          cid="$(docker run -d --rm --tmpfs /tmp:rw,nosuid,nodev -e N8N_USER_FOLDER=/tmp/n8n -e N8N_ENCRYPTION_KEY=ci-only-hardened-probe-encryption-key-000000000000 -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false -p 127.0.0.1:15679:5678 "$PROBE_IMAGE")"
          trap 'docker logs "$cid" > "$OUT/reachability-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 120); do curl -fsS http://127.0.0.1:15679/healthz >/dev/null 2>&1 && break; sleep .5; done
          curl -fsS http://127.0.0.1:15679/healthz >/dev/null
          ! docker inspect "$cid" --format '{{json .Config.Env}}' | grep -Eiq 'SMTP|N8N_EMAIL_MODE|N8N_SMTP'
          code="$(curl -sS -o "$OUT/node-types.json" -w '%{http_code}' http://127.0.0.1:15679/types/nodes.json || true)"; test "$code" = 200
          ! grep -Fq 'n8n-nodes-base.emailSend' "$OUT/node-types.json"; grep -Fq 'n8n-nodes-base.httpRequest' "$OUT/node-types.json"
          docker logs "$cid" > "$OUT/reachability-runtime.log" 2>&1 || true; docker stop -t 5 "$cid" >/dev/null; trap - EXIT
          echo 'NODEMAILER_REACHABILITY_CONTROLS=PASS' > "$OUT/nodemailer-reachability.txt"

      - name: Run frozen n8n static contracts
        if: steps.security.outputs.prelim == 'pass'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          python -m pytest -q automation/n8n/tests/test_workflow_static.py automation/n8n/tests/test_recovery_schedule_static.py | tee "$OUT/static-tests.txt"

      - name: Run order-paid and recovery compatibility smokes on candidate
        if: steps.security.outputs.prelim == 'pass'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re,difflib
          out=Path(os.environ['OUT'])
          paths=[Path('automation/n8n/tests/runtime_smoke.sh'),Path('automation/n8n/tests/recovery_schedule_runtime_smoke.sh'),Path('automation/n8n/tests/recovery_replay_runtime_smoke.sh')]
          for p in paths:
              text=p.read_text(); patched=text.replace('IMAGE="n8nio/n8n:2.33.4"','IMAGE="sitescore-n8n-hardened:probe"')
              patched=patched.replace('docker pull "$IMAGE" >/dev/null\n','').replace('test "$VERSION" = "2.33.4"','test "$VERSION" = "2.37.7"')
              patched=re.sub(r'DIGEST="\$\(docker image inspect "\$IMAGE" --format \'\{\{index \.RepoDigests 0\}\}\'\)"\ncase "\$DIGEST" in .*?esac\n','DIGEST="$(docker image inspect "$IMAGE" --format \'{{.Id}}\')"\ntest -n "$DIGEST"\n',patched,count=1,flags=re.S)
              q=p.with_name('.probe-'+p.name); q.write_text(patched); q.chmod(0o755)
              (out/(p.name+'.probe.patch')).write_text(''.join(difflib.unified_diff(text.splitlines(True),patched.splitlines(True),fromfile=str(p),tofile=str(q))))
          PY
          trap 'rm -f automation/n8n/tests/.probe-runtime_smoke.sh automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh' EXIT
          bash automation/n8n/tests/.probe-runtime_smoke.sh | tee "$OUT/order-paid-runtime-smoke.txt"
          bash automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh | tee "$OUT/recovery-schedule-runtime-smoke.txt"
          bash automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh | tee "$OUT/recovery-replay-runtime-smoke.txt"
          rm -f automation/n8n/tests/.probe-runtime_smoke.sh automation/n8n/tests/.probe-recovery_schedule_runtime_smoke.sh automation/n8n/tests/.probe-recovery_replay_runtime_smoke.sh; trap - EXIT
          git diff --exit-code
          test "$(sha256sum automation/n8n/workflows/sitescore-order-paid-v1.json | awk '{print $1}')" = '02000eddd70914e76dc528d6d3f43915c50d3e2909c849393ebc0dfcd398dea1'
          test "$(sha256sum automation/n8n/workflows/sitescore-recovery-schedule-v1.json | awk '{print $1}')" = 'f5409839cec1fa86b6af20f6cd242e71d52dceec8dcdb6cf35fd0b237e4a489c'

      - name: Final probe decision
        if: always()
        run: |
          set -euo pipefail
          base='${{ steps.base.outputs.pass }}'; prelim='${{ steps.security.outputs.prelim }}'
          echo "BASE=$base PRELIM=$prelim"
          test "$base" = pass || { echo 'HARDENED_BASE_CAPABILITY_PROOF=FAIL_OR_NOT_REACHED' | tee "$OUT/final-gate.txt"; exit 1; }
          test "$prelim" = pass || { echo 'HARDENED_SECURITY_GATE=FAIL_OR_NOT_REACHED' | tee "$OUT/final-gate.txt"; exit 1; }
          grep -F 'NODEMAILER_REACHABILITY_CONTROLS=PASS' "$OUT/nodemailer-reachability.txt"
          test -f "$OUT/static-tests.txt"; test -f "$OUT/order-paid-runtime-smoke.txt"; test -f "$OUT/recovery-schedule-runtime-smoke.txt"; test -f "$OUT/recovery-replay-runtime-smoke.txt"
          echo 'HARDENED_N8N_SECURITY_RUNTIME_WORKFLOW_GATE=PASS' | tee "$OUT/final-gate.txt"

      - name: Upload hardened final probe evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.2
        with:
          name: faz7-n8n-hardened-final-${{ github.sha }}
          path: deploy/containers/artifacts/n8n-hardened-final-probe/
          if-no-files-found: error
          retention-days: 14
