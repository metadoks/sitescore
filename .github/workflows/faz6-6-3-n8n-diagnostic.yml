name: faz6-6-3-n8n-diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}"}
      - name: Prove minimum workflow id required by n8n import
        run: |
          set -euxo pipefail
          IMAGE=n8nio/n8n:2.33.4
          docker pull "$IMAGE" >/dev/null
          test "$(docker run --rm "$IMAGE" --version | tail -n1 | tr -d '\r')" = "2.33.4"
          python - <<'PY'
          import json
          source='automation/n8n/workflows/sitescore-order-paid-v1.json'
          data=json.load(open(source))
          data['id']='sitescoreOrderPaidV1'
          assert 'versionId' not in data
          with open('/tmp/sitescore-order-paid-v1-probe.json','w') as f:
              json.dump(data,f,separators=(',',':'))
          print('PROBE_ID='+data['id'])
          PY
          VOLUME="n8n-diagnostic-${GITHUB_RUN_ID}"
          docker volume create "$VOLUME"
          trap 'docker volume rm "$VOLUME" >/dev/null 2>&1 || true' EXIT
          ENC_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')
          docker run --rm \
            -e N8N_ENCRYPTION_KEY="$ENC_KEY" \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            -v "$VOLUME:/home/node/.n8n" \
            -v /tmp/sitescore-order-paid-v1-probe.json:/workflow.json:ro \
            "$IMAGE" import:workflow --input=/workflow.json
          mkdir -p /tmp/n8n-export && chmod 777 /tmp/n8n-export
          docker run --rm \
            -e N8N_ENCRYPTION_KEY="$ENC_KEY" \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            -v "$VOLUME:/home/node/.n8n" \
            -v /tmp/n8n-export:/out \
            "$IMAGE" export:workflow --all --output=/out/workflows.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/n8n-export/workflows.json'))
          items=data if isinstance(data,list) else [data]
          assert len(items)==1, items
          item=items[0]
          assert item['id']=='sitescoreOrderPaidV1'
          assert item.get('versionId')
          print('N8N_ID_ONLY_IMPORT=PASS')
          print('EXPORTED_ID='+item['id'])
          print('N8N_GENERATED_VERSION_ID='+item['versionId'])
          PY
