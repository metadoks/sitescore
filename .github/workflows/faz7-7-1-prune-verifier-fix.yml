name: faz7-7-1-prune-verifier-fix

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Patch only stale proof identities
        run: |
          set -euo pipefail
          mkdir -p /tmp/patched
          cp .github/workflows/faz7-7-1-n8n-snowflake-prune-probe.yml /tmp/patched/faz7-7-1-n8n-snowflake-prune-probe.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patched/faz7-7-1-n8n-snowflake-prune-probe.yml')
          data=p.read_text()
          count=data.count('2.37.4')
          if count < 1:
              raise SystemExit('no stale proof identity found')
          data=data.replace('2.37.4','2.37.10')
          if '2.37.4' in data:
              raise SystemExit('stale proof identity remains')
          p.write_text(data)
          print('STALE_LITERAL_COUNT='+str(count))
          PY
          sha256sum /tmp/patched/faz7-7-1-n8n-snowflake-prune-probe.yml

      - name: Upload corrected workflow bytes
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: faz7-prune-verifier-corrected-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/patched/faz7-7-1-n8n-snowflake-prune-probe.yml
