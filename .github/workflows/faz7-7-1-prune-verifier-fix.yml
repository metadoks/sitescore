name: faz7-7-1-prune-verifier-fix

on:
  push:
    branches:
      - faz7/7-1-reproducible-containers-supply-chain-governance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Emit corrected prune workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          p=Path('.github/workflows/faz7-7-1-n8n-snowflake-prune-probe.yml')
          data=p.read_text()
          old_version="r['version']=='2.37.4'"
          old_message='n8n-nodes-base@2.37.4 not preserved exactly once'
          if data.count(old_version) != 1 or data.count(old_message) != 1:
              raise SystemExit(f'unexpected stale verifier counts: version={data.count(old_version)} message={data.count(old_message)}')
          data=data.replace(old_version,"r['version']=='2.37.10'",1)
          data=data.replace(old_message,'n8n-nodes-base@2.37.10 not preserved exactly once',1)
          if '2.37.4' in data:
              raise SystemExit('unexpected additional 2.37.4 literal remains')
          raw=data.encode()
          payload=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode()
          req=urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',
              data=payload, method='POST',
              headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'sitescore-faz7-prune-verifier'})
          with urllib.request.urlopen(req,timeout=30) as r:
              result=json.load(r)
          print('PATCHED_BLOB_SHA='+result['sha'])
          print('PATCHED_WORKFLOW_SHA256='+hashlib.sha256(raw).hexdigest())
          PY
