name: faz7-7-1-ci-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FAZ6_COMMERCE_SHA: ee45e4fdd3d805137387a0fc1198eedf8d461fb2
  PYTHON_IMAGE: python:3.11.16-slim-bookworm@sha256:2e32f7d302adc1c37428355c1e646897c0c53f4fd60b6a551245fb90ee129f91
  POSTGRES_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94

jobs:
  current-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Fetch frozen provenance objects
        run: |
          set -euo pipefail
          for sha in \
            0e370940ee5c8c1253db72fa7e33078fb4ef3b2c \
            8a4e358709ae7a662bf079722db042fb6e319ffd \
            af3b9567d644f6bcf0410af704dd7d86de41b5ce \
            719a17c4359524337f57298252a59ccb89dcd0aa \
            8027239b4b168e98e8ee16e15787366632017156 \
            3ed6f6e323fdf4e3b0ef63e8c083d4f978e12628 \
            acc213ac52f980789164d9fedcd4e18deeefcf75 \
            64887a560c4af492312e726f990363fc5010345d \
            7b0b63eb3f4a9fbd74a0bfd92ef793c7d7522fba \
            1f22c4a09c08c2803c746b87a20209d7fdf6c574 \
            bdf43a891ca14941ba2f2c4f115e4a15bec0015a \
            4ed902dd9ebf230dcb983392705ab0d95bb0c846 \
            287367ce8eb708efce0ebae0a2f9c90d681cce01 \
            813e3436bc3f899a774c853a6a81ba7924b54c42 \
            df4e3181712e7f426f8f1752628952a620c98f05; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha"
            git cat-file -e "$sha^{commit}"
          done
      - name: Build exact current test images and add CI-only git tooling
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load --target test --build-arg "SOURCE_REVISION=${GITHUB_SHA}" --build-arg "SOURCE_VERSION=sha-${GITHUB_SHA}" -f deploy/containers/api/Dockerfile -t sitescore-api:test .
          docker buildx build --platform linux/amd64 --load --target test --build-arg "SOURCE_REVISION=${GITHUB_SHA}" --build-arg "SOURCE_VERSION=sha-${GITHUB_SHA}" -f deploy/containers/commerce/Dockerfile -t sitescore-commerce:test .
          cat > /tmp/Dockerfile.test-git <<'EOF'
          ARG BASE
          FROM ${BASE}
          USER 0:0
          RUN apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
          USER 10001:10001
          EOF
          docker build --build-arg BASE=sitescore-api:test -f /tmp/Dockerfile.test-git -t sitescore-api:test-diag /tmp
          docker build --build-arg BASE=sitescore-commerce:test -f /tmp/Dockerfile.test-git -t sitescore-commerce:test-diag /tmp
      - name: Start exact PostgreSQL 16 and isolated databases
        run: |
          set -euo pipefail
          docker run -d --name current-postgres --health-cmd='pg_isready -U ci -d postgres' --health-interval=2s --health-timeout=2s --health-retries=30 -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=postgres -p 127.0.0.1:5432:5432 "$POSTGRES_IMAGE"
          for _ in $(seq 1 60); do docker exec current-postgres pg_isready -U ci -d postgres && break; sleep 1; done
          docker exec current-postgres createdb -U ci api_ci
          docker exec current-postgres createdb -U ci commerce_ci
      - name: Run current suites with complete repo context and preserved output
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag
          common=(-v "$PWD:/testsrc:ro" --tmpfs /tmp:rw,nosuid,nodev --network host -e HOME=/tmp/home)
          set +e
          docker run --rm "${common[@]}" -e SITESCORE_DATABASE_URL='postgresql+psycopg://ci:ci@127.0.0.1:5432/api_ci' sitescore-api:test-diag sh -euc 'mkdir -p "$HOME"; git config --global --add safe.directory /testsrc; cd /testsrc; python -m pytest -p no:cacheprovider -q sitescore-api/tests' 2>&1 | tee /tmp/diag/api.txt
          api_rc=${PIPESTATUS[0]}
          docker run --rm "${common[@]}" sitescore-api:test-diag sh -euc 'mkdir -p "$HOME"; cd /testsrc; python -m pytest -p no:cacheprovider -q sitescore-report/tests' 2>&1 | tee /tmp/diag/report.txt
          report_rc=${PIPESTATUS[0]}
          docker run --rm "${common[@]}" -e SITESCORE_COMMERCE_DATABASE_URL='postgresql+psycopg://ci:ci@127.0.0.1:5432/commerce_ci' sitescore-commerce:test-diag sh -euc 'mkdir -p "$HOME"; git config --global --add safe.directory /testsrc; cd /testsrc/sitescore-commerce; python -m pytest -p no:cacheprovider -q tests --deselect tests/test_faz6_final_freeze_gate.py::test_final_candidate_is_based_on_corrective_locked_main_and_permanent_diff_is_audit_only' 2>&1 | tee /tmp/diag/commerce.txt
          commerce_rc=${PIPESTATUS[0]}
          set -e
          printf 'API_RC=%s\nREPORT_RC=%s\nCOMMERCE_RC=%s\n' "$api_rc" "$report_rc" "$commerce_rc"
          test "$api_rc" -eq 0
          grep -E '114 passed' /tmp/diag/api.txt
          test "$report_rc" -eq 0
          grep -E '24 passed' /tmp/diag/report.txt
          test "$commerce_rc" -eq 0
          grep -E '416 passed' /tmp/diag/commerce.txt

  faz6-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ee45e4fdd3d805137387a0fc1198eedf8d461fb2
          fetch-depth: 0
      - name: Fetch exact frozen FAZ6 provenance objects
        run: |
          set -euo pipefail
          for sha in \
            0e370940ee5c8c1253db72fa7e33078fb4ef3b2c \
            8a4e358709ae7a662bf079722db042fb6e319ffd \
            af3b9567d644f6bcf0410af704dd7d86de41b5ce \
            719a17c4359524337f57298252a59ccb89dcd0aa \
            8027239b4b168e98e8ee16e15787366632017156 \
            3ed6f6e323fdf4e3b0ef63e8c083d4f978e12628 \
            acc213ac52f980789164d9fedcd4e18deeefcf75 \
            64887a560c4af492312e726f990363fc5010345d \
            7b0b63eb3f4a9fbd74a0bfd92ef793c7d7522fba \
            1f22c4a09c08c2803c746b87a20209d7fdf6c574 \
            bdf43a891ca14941ba2f2c4f115e4a15bec0015a \
            4ed902dd9ebf230dcb983392705ab0d95bb0c846 \
            287367ce8eb708efce0ebae0a2f9c90d681cce01 \
            813e3436bc3f899a774c853a6a81ba7924b54c42 \
            df4e3181712e7f426f8f1752628952a620c98f05; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha"
            git cat-file -e "$sha^{commit}"
          done
      - name: Start exact PostgreSQL 16 diagnostic service
        run: |
          set -euo pipefail
          docker run -d --name faz6-postgres --health-cmd='pg_isready -U ci -d ci' --health-interval=2s --health-timeout=2s --health-retries=30 -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci -p 127.0.0.1:5432:5432 "$POSTGRES_IMAGE"
          for _ in $(seq 1 60); do docker exec faz6-postgres pg_isready -U ci -d ci && break; sleep 1; done
      - name: Replay exact frozen suite with full local package chain and git provenance
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network host -e HOME=/tmp/home -e SITESCORE_COMMERCE_DATABASE_URL='postgresql+psycopg://ci:ci@127.0.0.1:5432/ci' -v "$PWD:/repo" -w /repo "$PYTHON_IMAGE" sh -euc '
            apt-get update >/dev/null
            apt-get install -y --no-install-recommends git >/dev/null
            mkdir -p "$HOME"
            git config --global --add safe.directory /repo
            python -m venv /tmp/faz6-commerce
            /tmp/faz6-commerce/bin/pip install ./sitescore-core ./sitescore-data ./sitescore-providers ./sitescore-spatial ./sitescore-metrics ./sitescore-benchmarks ./sitescore-pipeline ./sitescore-app ./sitescore-report ./sitescore-api "./sitescore-commerce[test]" >/dev/null
            /tmp/faz6-commerce/bin/python -m pytest -p no:cacheprovider sitescore-commerce/tests -q
          ' 2>&1 | tee /tmp/faz6-replay.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "FAZ6_REPLAY_RC=$rc"
          test "$rc" -eq 0
          grep -E '417 passed' /tmp/faz6-replay.txt
