[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescore-metrics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "sitescore-data==0.1.0",
  "sitescore-providers==0.1.0",
  "sitescore-spatial==0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
