[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescore-report"
version = "0.3.0"
description = "Canonical report facts, validated narrative, and deterministic PDF presentation for SiteScore AI"
requires-python = ">=3.11"
dependencies = [
    "sitescore-app==0.1.0",
    "sitescore-core==0.1.0",
    "openai==3.2.0",
    "pydantic==2.13.4",
    "Jinja2==3.1.6",
    "matplotlib==3.11.1",
    "weasyprint==69.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pypdf==6.14.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitescore_report = [
    "templates/*.html",
    "assets/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
