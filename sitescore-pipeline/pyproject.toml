[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescore-pipeline"
version = "0.1.0"
description = "SiteScore normalized feature assembly, scoring readiness, and real-data terminal pipeline integration"
requires-python = ">=3.11"
dependencies = [
  "sitescore-data==0.1.0",
  "sitescore-benchmarks==0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
