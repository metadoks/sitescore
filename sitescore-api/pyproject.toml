[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescore-api"
version = "0.1.0"
description = "Versioned external API ingress foundation for SiteScore AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.140.0",
    "pydantic==2.13.4",
    "sitescore-core==0.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
