[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescore-api"
version = "0.3.0"
description = "Durable machine-consumer analysis and report artifact API for SiteScore AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.140.0",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "celery==5.6.3",
    "redis==7.4.1",
    "boto3==1.43.68",
    "sitescore-core==0.1.0",
    "sitescore-data==0.1.0",
    "sitescore-providers==0.1.0",
    "sitescore-metrics==0.1.0",
    "sitescore-benchmarks==0.1.0",
    "sitescore-pipeline==0.1.0",
    "sitescore-app==0.1.0",
    "sitescore-report==0.3.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[project.scripts]
sitescore-provision-service-key = "sitescore_api.provision:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
